/* ══════════════════════════════════════════════════════════════
   EL LOOK NUEVO — crema, navy y naranja
   18 de octubre de 2026

   Esto reemplaza la capa que estaba aquí antes, "LA CANCHA DE
   NOCHE", que pintaba la página oscura. Va al final a propósito y
   funciona igual que la que sustituye: la geometría de arriba se
   queda intacta y esto manda encima. No se tocó ni una regla de
   tamaño, posición o espaciado — sólo color.

   Las variables de la base se reapuntan a la paleta nueva, así que
   todo lo que las usaba cambia solo. Lo que venía escrito a mano
   en hexadecimal hay que nombrarlo, y está abajo.
   ══════════════════════════════════════════════════════════════ */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --linea:#e7e6e2;
  /* Y las que ya usaba esta página, apuntando a lo nuevo */
  --ink:#1b2937; --mute:#617083; --line:#e7e6e2; --tint:#ffffff;
  --accent:#ff7a18; --good:#0b7a5a; --bad:#b4231c;
  --paper:#1b2937; --panel:#ffffff; --gold:#ff7a18; --leather:#ff7a18;
  --ball:#ff7a18; --edge:#e7e6e2; --teal:#ff7a18;
  --noche:#faf8f4; --cancha:#ffffff; --viva:#ff7a18; --brasa:#ff7a18;
  --hueso:#1b2937; --humo:#617083;
}
html, body{background:var(--cream);color:var(--ink)}

/* La cabecera y el pie son lo único oscuro, como en el resto del sitio. */
header, footer, .top{background:var(--navy);border-color:#ffffff22}
header{border-bottom:1px solid #ffffff22}
footer{background:#0a1420;border-top:none;color:#aeb9c6}
footer a{color:#aeb9c6}
footer a:hover{color:var(--orange)}
.mark{color:#fff}
/* El em va en blanco a propósito: arriba vale #4FD3F0, que servía
   para la marca de tres palabras de Cada Punto y pintaría CADA PUNTO CUENTA
   de azul. */
.mark em{color:#fff}
.mark i{color:var(--orange)}
.langb{border:1px solid #ffffff55;color:#fff;background:transparent;border-radius:7px}
.langb:hover{color:var(--orange);border-color:var(--orange)}

/* Cajas y paneles: blancos sobre crema, con su sombra suave. */
.how, .linkbox, .s, .w, .tal, .num, .team, .pl, .caja, .chat, .card,
.panel, .box, .waits, .pay, .cuadro, .m.me{
  background:#fff;border-color:var(--linea);color:var(--ink);
  box-shadow:0 8px 25px #17243806}
.how p, .s span, .w span, .num span, .tal span, .help, .hint, .lede,
.cp, .who, .sub, .nota{color:var(--mute)}

/* Lo que se escribe. */
input, select, textarea{
  background:#fff;border:1px solid #d6d9d6;border-radius:10px;color:var(--ink)}
input::placeholder, textarea::placeholder{color:#9aa6b2}
input:focus, select:focus, textarea:focus{
  border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,24,.18);outline:none}

/* Los botones. Se dicen los dos colores a mano: cambiar sólo las
   variables es como la capa vieja dejaba blanco sobre blanco. */
.btn, button.btn, a.btn{
  background:var(--navy);border:0;border-radius:9px;color:#fff;font-weight:800}
.btn:hover{opacity:.92;background:var(--navy);color:#fff}
.btn.line, .btn.ghost, .btn.sec{
  background:transparent;border:1px solid var(--navy);color:var(--navy)}
.btn.line:hover{background:var(--navy);color:#fff}
.btn.go, .btn.hot, .btn.naranja{background:var(--orange);border:0;color:#111a24}
.btn.go:hover{opacity:.92}
[style*="#FF8A2B"], .btn[class*="go"]{color:#111a24}
.btn:disabled{opacity:.5}

hr, .sep, .div{border-color:var(--linea);background:var(--linea)}
table, th, td{border-color:var(--linea)}

/* Enlaces dentro del texto. Cada :not() suma fuerza, así que lo que
   es un botón se excluye por nombre. */
main a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go),
.wrap a:not(.btn):not(.pedir):not(.cta):not(.wa):not(.go){color:var(--navy)}
a.pedir{color:inherit}

/* Lo que estaba escrito a mano con el navy viejo: ahora sería una
   mancha oscura en una página clara. */
[style*="background:#07141E"], [style*="background: #07141E"]{background:#fff !important}
.ojo, .env-nota, .nota-ojo, .aviso, .warn, .tip{background:#fff !important;color:var(--ink)}
.ttl, .env-nota b{color:var(--ink)}
.cta{background:var(--orange) !important;border-color:var(--orange) !important;color:#111a24 !important}
.cta:hover{opacity:.92}
h1,h2,h3,h4{color:var(--ink)}

/* ══ LA MARCA ══════════════════════════════════════════════════
   CADA PUNTO CUENTA en versales sobre el navy, como en el resto del sitio.
   El punto es lo único naranja. */
.mark, .mark .wm{
  color:#fff !important;text-decoration:none !important;
  font-size:1.05rem !important;font-weight:900 !important;
  letter-spacing:.07em !important;text-transform:uppercase;line-height:1.1}
.mark em, .wm em{font-style:normal;color:#fff !important}
.mark i,  .wm i {font-style:normal;color:var(--orange) !important}

  .mark, .mark .wm{font-size:.92rem !important}
}

/* La fuente. La base pedía Archivo, que ya no se carga. */
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}


/* ══ La barra, el menú y el idioma ══════════════════════════════════
   Puesto al final de la hoja a propósito: lo que haya escrito arriba
   sobre header, .bar o .langb queda debajo de esto.

   --barra tiene que ser la MISMA altura en los dos sitios donde se
   usa: el hueco que deja scroll-padding para que un ancla no quede
   detrás de la cabecera, y el punto donde arranca el panel. */
:root{--barra:66px}
html{scroll-padding-top:calc(var(--barra) + 10px)}
/* overflow-x en el body y no sólo en html: en Safari de iOS, html
   solo no lo sujeta y basta un elemento ancho para arrastrar la
   página de lado. */
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:100;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{min-height:var(--barra);padding:0;gap:10px}
/* El botón del idioma dice el idioma AL QUE lleva, no el que está
   puesto. Por eso necesita sitio para una palabra y no para dos
   letras, y nowrap para que «Español» no se parta en dos líneas. */
.langb,#lang{white-space:nowrap;min-height:40px;font-size:.85rem;
  padding:0 12px;border-radius:9px;font-family:inherit}
.barra-dcha{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Las rayas se pintan con currentColor, no con blanco: prometer.html
   tiene la barra en crema con la marca en navy, y unas rayas
   blancas ahí no se ven. Heredando el color de la barra valen para
   las dos, y para la próxima página que cambie de fondo. Lo
   encontró una captura, no la prueba: la prueba miraba que el botón
   estuviera, no que se viera. */
/* El color de las rayas sale de la barra, y la barra de estas
   páginas no declaraba ninguno: heredaban la tinta del cuerpo
   —navy sobre navy— y el botón se veía con 1.2:1 de contraste,
   que es no verse. Barra navy, tinta blanca. */
header{color:#fff}
.hamb{display:none;width:44px;height:44px;flex:0 0 44px;color:inherit;
  border:1px solid currentColor;background:transparent;border-radius:9px;
  cursor:pointer;padding:0;align-items:center;justify-content:center}
@supports (border-color: color-mix(in srgb, currentColor 45%, transparent)){
  .hamb{border-color: color-mix(in srgb, currentColor 45%, transparent)}
}
.hamb:hover{border-color:var(--orange);color:var(--orange)}
/* color:inherit en la propia raya y no sólo en el botón: privacy
   y terms traen un `strong,b{color:var(--ink)}` para el texto, y
   currentColor dentro de un <b> resuelve al color DEL <b>, no al
   del padre. Las rayas salían navy sobre navy. */
.hamb b{display:block;width:20px;height:2px;color:inherit;
  background:currentColor;border-radius:2px;
  position:relative;transition:background .18s ease}
.hamb b::before,.hamb b::after{content:'';position:absolute;left:0;
  width:20px;height:2px;background:currentColor;border-radius:2px;transition:transform .18s ease}
.hamb b::before{top:-6px}
.hamb b::after{top:6px}
.hamb[aria-expanded="true"] b{background:transparent}
.hamb[aria-expanded="true"] b::before{transform:translateY(6px) rotate(45deg)}
.hamb[aria-expanded="true"] b::after{transform:translateY(-6px) rotate(-45deg)}

.menu{position:absolute;left:0;right:0;top:100%;
  display:flex;flex-direction:column;align-items:stretch;
  background:var(--navy);border-bottom:1px solid #ffffff22;
  /* Cerrado con max-height para que tenga transición, y con
     visibility para que el teclado no se meta dentro: max-height
     sola deja los enlaces tabulables en un panel invisible. */
  max-height:0;visibility:hidden;overflow:hidden;
  transition:max-height .22s ease,visibility .22s}
.menu.abierto{max-height:80vh;visibility:visible;overflow:auto}
.menu a{display:flex;align-items:center;min-height:52px;
  padding:0 max(20px,calc((100vw - 900px)/2 + 20px));
  color:#fff;text-decoration:none;font-weight:600;font-size:1rem;
  border-top:1px solid #ffffff14}
.menu a:first-child{border-top:0}
.menu a:hover{color:var(--orange)}
.menu a.cta{margin:14px 20px 18px;justify-content:center;border-top:0;
  background:var(--orange);color:#111a24;font-weight:800;border-radius:9px}
.menu a.cta:hover{color:#111a24}
/* Las rayas se ven siempre: estas páginas no tienen enlaces en la
   barra en ningún tamaño, así que el menú es la única puerta y
   esconderlo en escritorio dejaría la página sin salida otra vez. */
.hamb{display:flex}
@media(max-width:430px){
:root{--barra:60px}
.langb,#lang{padding:0 10px;font-size:.8rem}
}
</style>

function rpc(name, args){
  return fetch(SB_URL + '/rest/v1/rpc/' + name, {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args || {})
  }).then(function(r){
    if (r.ok) return r.json();
    /* El cuerpo de un error de PostgREST trae el porqué —message,
       hint, details— y tirarlo era lo que convertía cada fallo en
       una visita al editor de SQL: la página sabía exactamente qué
       había pasado y enseñaba "no se pudo". Se lee antes de lanzar. */
    return r.text().then(function(t){
      var d = {}; try { d = JSON.parse(t) } catch(x){}
      var e = new Error(d.message || d.hint || t || ('rpc ' + r.status));
      e.detalle = d.details || d.hint || '';
      e.codigo  = d.code || r.status;
      throw e;
    });
  });

/* El porqué, cuando lo hay. Un mensaje amable que no dice nada manda
   a alguien a buscar en la base; el mismo mensaje con la razón
   detrás se arregla solo. Se recorta: esto es una línea de aviso, no
   un registro. */
function porque(x){
  if (!x) return '';
  var r = (typeof x === 'string') ? x
        : (x.why || x.error || x.message || x.hint || x.detalle || '');
  return r ? ' — ' + String(r).slice(0, 160) : '';
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

/* Sin punto al final: el español acaba la hora en "p. m." y las frases
   que la usan ya traen el suyo. */
function cuando(iso){
  try {
    var d = new Date(iso);
    var loc = LANG === 'es' ? 'es-PR' : 'en-US';
    return d.toLocaleDateString(loc, { weekday:'long', day:'numeric', month:'long' }) +
           ' · ' + d.toLocaleTimeString(loc, { hour:'numeric', minute:'2-digit' });
  } catch(e){ return '' }
}

function pintar(){
  document.getElementById('langBtn').textContent = LANG==='es' ? 'English':'Español';

  if (!D){
    app.innerHTML = '<p class="lede">…</p>';
    return;
  }
  if (D.error){
    app.innerHTML =
      '<h1>' + T('h1') + '</h1>' +
      '<p class="lede">' + esc(D.error) + '</p>' +
      '<button class="btn" onclick="cargar()">' + T('recargar') + '</button>' +
      '<a class="btn" href="index.html">' + T('volver') + '</a>';
    return;
  }

  var nenes = D.nenes || [];
  var jugaron = nenes.filter(function(n){ return (n.jugados||0) > 0 });
  var cuartos = nenes.reduce(function(a,n){ return a + (n.jugados||0) }, 0);
  var puntos  = nenes.reduce(function(a,n){ return a + (n.total||0) }, 0);
  var tope    = jugaron.length ? Math.max.apply(null, jugaron.map(function(n){ return n.total||0 })) : 0;

  var fecha = D.estado === 'antes'   ? T('abreA',   { D: cuando(D.opens_at) })
            : D.estado === 'abierto' ? T('cierraA', { D: cuando(D.closes_at) })
            : D.estado === 'cerrado' ? T('cerroA',  { D: cuando(D.closes_at) })
            : T('sinWin');

  var filas = nenes.map(function(n, i){
    var hechos = {};
    (n.cuartos || []).forEach(function(q){ hechos[q.q] = q.points });

    var chips = '';
    for (var q = 1; q <= 4; q++){
      var hay = Object.prototype.hasOwnProperty.call(hechos, q);
      chips += '<span class="q' + (hay ? ' hecho' : '') + '">' +
               (hay ? hechos[q] : '·') + '</span>';
    }

    var pie = (n.jugados >= 4) ? T('listo')
            : (n.jugados > 0)  ? T('deN', { N: n.jugados })
            : T('sinJugar');

    // Líder sólo si de verdad hay con qué comparar: con todo el mundo
    // en cero, nadie va ganando.
    var lider = tope > 0 && (n.total||0) === tope;

    return '<div class="fila' + (lider ? ' lider' : '') + '">' +
             '<span class="pos">' + (i + 1) + '</span>' +
             '<span class="nm">' + esc(n.nombre) +
               '<small>' + esc(pie) + '</small>' +
               '<span class="qs">' + chips + '</span>' +
             '</span>' +
             '<span class="tot' + ((n.total||0) ? '' : ' cero') + '">' + (n.total||0) + '</span>' +
           '</div>';
  }).join('');

  app.innerHTML =
    '<h1>' + esc(D.program || T('h1')) + '</h1>' +
    '<p class="lede">' + esc(D.name || '') + '</p>' +
    '<div class="estado' + (D.estado === 'abierto' ? ' vivo' : '') + '">' +
      '<span class="punto"></span>' + esc(T(D.estado || 'sinventana')) +
    '</div>' +
    (nenes.length
      ? filas +
        '<div class="resumen">' +
          '<div class="caja"><b>' + puntos + '</b><span>' + esc(T('tPuntos')) + '</span></div>' +
          '<div class="caja"><b>' + jugaron.length + '</b><span>' + esc(T('tNenes')) + '</span></div>' +
          '<div class="caja"><b>' + cuartos + '</b><span>' + esc(T('tCuartos')) + '</span></div>' +
        '</div>'
      : '<p class="vacio">' + esc(T('nadie')) + '</p>') +
    '<p class="pie">' + esc(fecha) + (D.estado === 'abierto' ? ' · ' + esc(T('auto')) : '') + '</p>';
}

function cargar(){
  if (!CHALLENGE && CAMPANA){
    return rpc('cp_reto_vivo', { p_campaign: CAMPANA })
      .then(function(r){
        if (!r || !r.ok || !r.hay){ D = { error: T('sinWin') }; pintar(); return; }
        CHALLENGE = r.challenge_id;
        return cargar();
      })
      .catch(function(){ if (!D){ D = { error: T('err') }; pintar(); } });
  }
  if (!CHALLENGE){ D = { error: T('noLive') }; pintar(); return; }
  return rpc('cp_tablero', { p_challenge: CHALLENGE })
    .then(function(r){
      if (!r || !r.ok){ D = { error: T('noLive') }; pintar(); return; }
      D = r;
      pintar();
      marcarPaso();
    })
    .catch(function(e){
      console.error(e);
      // Un fallo de red no borra lo que ya se estaba enseñando: en una
      // cancha con mala señal eso sería la pantalla parpadeando en
      // blanco cada quince segundos.
      if (!D) { D = { error: T('err') }; pintar(); }
    });
}

/* Sólo se repregunta mientras la ventana está abierta. Antes y después
   el número no cambia, y un tablero cerrado no tiene por qué estar
   pegándole a la base cada quince segundos para siempre. */
function marcarPaso(){
  if (timer){ clearInterval(timer); timer = null; }
  if (D && D.estado === 'abierto'){
    timer = setInterval(cargar, 15000);
  }
}

/* Con el teléfono en el bolsillo no hace falta preguntar nada; al
   volver a mirarlo, sí, y enseguida. */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && D && D.estado === 'abierto') cargar();
});

cargar();
</script>
<script>
/* El <html lang> no se tocaba en esta página: un lector de
   pantalla leía el español con fonemas ingleses. */
(function(){ try{
  var k = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang')
        || localStorage.getItem('fc-lang');
  if (k) document.documentElement.lang = k;
}catch(e){} })();
</script>

<script>
/* ══ El menú de la barra ════════════════════════════════════════════
   Vive aparte del sistema de idioma de cada página a propósito: son
   doce páginas con cuatro formas distintas de pintar sus textos, y
   engancharse a cada una sería cuatro maneras de romperse. Esto lee
   el idioma de donde lo deja todo el mundo —localStorage— y pinta
   sus seis enlaces y nada más. */
(function(){
var ROTULOS = {
  en: { inicio:'Home', como:'How it works', precio:'What it costs',
        ayuda:'Questions', mia:'My team', alta:'Sign up a team',
        menu:'Menu', otro:'Español', aOtro:'Cambiar a español' },
  es: { inicio:'Inicio', como:'Cómo funciona', precio:'Cuánto cuesta',
        ayuda:'Preguntas', mia:'Mi equipo', alta:'Registra un equipo',
        menu:'Menú', otro:'English', aOtro:'Switch to English' }
};
function idioma(){
  try{
    return localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
           localStorage.getItem('fc-lang') ||
           ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en');
  }catch(e){ return 'es' }
}
var b = document.getElementById('hamb'),
    m = document.getElementById('menu'),
    l = document.getElementById('langBtn') || document.getElementById('lang');
if (!b || !m) return;

function pintar(){
  var t = ROTULOS[idioma()] || ROTULOS.es;
  m.querySelectorAll('[data-m]').forEach(function(a){
    a.textContent = t[a.getAttribute('data-m')] || a.textContent;
  });
  b.setAttribute('aria-label', t.menu);
  /* El botón del idioma lo pinta la propia página, cada una a su
     manera. Aquí sólo se corrige si se quedó con las dos letras
     viejas, para que ninguna página diga «EN» mientras las demás
     dicen «English». */
  if (l && /^(EN|ES)$/.test((l.textContent||'').trim())) {
    l.textContent = t.otro;
    l.setAttribute('aria-label', t.aOtro);
  }
}
function pon(abierto){
  m.classList.toggle('abierto', abierto);
  b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
}
b.addEventListener('click', function(){
  pon(b.getAttribute('aria-expanded') !== 'true');
});
m.addEventListener('click', function(e){ if (e.target.closest('a')) pon(false) });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') {
    pon(false); b.focus();
  }
});
/* Al pulsar el idioma, la página repinta lo suyo; el menú repinta
   lo suyo detrás, con un turno de espera para que el valor nuevo ya
   esté guardado cuando se lea. */
if (l) l.addEventListener('click', function(){ setTimeout(pintar, 0) });
pintar();
})();
</script>
