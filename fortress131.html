<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Fortress 1-3-1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:Arial,sans-serif;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}

#screen-intro{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;
  /* Starting at the top rather than centring — with the demo and the
     instructions the intro is taller than a phone screen, and a
     centred flex column pushes its own top past the padding. */
  justify-content:flex-start;
  background:#000;z-index:100;
  overflow-y:auto;overflow-x:hidden;
  padding:84px 16px 34px;
}
.vrr-sub{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:#22D3EE;margin-bottom:8px;text-align:center}
.vrr-title{font-size:2.4rem;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 40px rgba(12,127,196,.7);margin-bottom:16px;text-align:center}
.vrr-title span{color:#22D3EE}
.rule-t{font-size:.9rem;color:#c9b8a8;line-height:1.55;max-width:420px;margin-bottom:22px;text-align:center}
.rule-t b{color:#fff}
.big-btn{width:100%;max-width:420px;height:68px;border:none;border-radius:20px;background:linear-gradient(135deg,#0C7FC4,#22D3EE);color:#fff;font-size:1.2rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 40px rgba(12,127,196,.7);margin-bottom:14px}
.big-btn:hover{transform:scale(1.03)}
.big-btn.official{background:linear-gradient(135deg,#38BDF8,#0C7FC4);color:#04121A;box-shadow:0 0 40px rgba(56,189,248,.6)}
/* ---- the demonstration and the instructions, intro screen only ---- */
.demo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:14px 0 20px}
.demo-label{
  font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  background:#050A12;border:1px solid rgba(34,211,238,.35);color:#22D3EE;
  padding:7px 16px;border-radius:999px;white-space:nowrap;transition:color .2s,border-color .2s;
}
.demo-label.turn{color:#7DD3FC;border-color:rgba(56,189,248,.5)}
.demo-label.good{color:#00D9A5;border-color:rgba(0,217,165,.5)}

/* The same five positions the game uses, on a panel the same shape
   as the real one — so what a student learns here is what they see. */
/* the same 5x5 court as the game, drawn with gradients rather than
   twenty-five elements */
.demo-panel{
  position:relative;width:min(220px,62vw);aspect-ratio:1;
  background:#0D1826;
  border:2px solid rgba(255,122,24,.4);border-radius:12px;
}
.demo-dot{
  position:absolute;transform:translate(-50%,-50%);
  width:17%;aspect-ratio:1;border-radius:50%;
  transition:all .14s;
}
.demo-dot.lit{filter:brightness(1.4);box-shadow:0 0 22px rgba(255,255,255,.35);transform:translate(-50%,-50%) scale(1.14)}
.demo-dot.ok{box-shadow:0 0 0 3px #00D9A5,0 0 18px rgba(0,217,165,.8)}
.demo-panel.pulse{animation:demoPulse .5s ease-out}
@keyframes demoPulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}60%{box-shadow:0 0 22px 7px rgba(34,211,238,.22)}100%{box-shadow:none}}

.htp{width:100%;max-width:420px;margin:0 0 16px}
.htp-toggle{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:12px 16px;border-radius:12px;cursor:pointer;font-family:inherit;
  background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.25);
}
.htp-toggle-text{font-size:.82rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#22D3EE}
.htp-arrow{color:#22D3EE;font-size:.7rem;transition:transform .3s}
.htp-toggle.open .htp-arrow{transform:rotate(180deg)}
.htp-body{max-height:0;overflow:hidden;transition:max-height .45s ease-out}
.htp-body.open{max-height:900px}
.htp-card{background:#0D1826;border:1px solid #1E3550;border-radius:12px;padding:15px;margin-top:10px;text-align:left}
.htp-card-title{font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#22D3EE;margin-bottom:11px}
.htp-step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.htp-step:last-child{margin-bottom:0}
.htp-step .n{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:#22D3EE;color:#04121A;font-size:.72rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.htp-step .tx{font-size:.8rem;color:#CFE3F2;line-height:1.5}
.htp-step .tx b{color:#7DD3FC}
.htp-tip{background:rgba(56,189,248,.07);border-left:3px solid #38BDF8;padding:10px 12px;border-radius:0 8px 8px 0;margin-top:12px}
.htp-tip-title{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#38BDF8;margin-bottom:4px}
.htp-tip-text{font-size:.75rem;color:#8AA4BD;line-height:1.45}

.name-input{width:100%;max-width:420px;padding:14px;border-radius:14px;border:2px solid rgba(12,127,196,.4);background:rgba(255,255,255,.05);color:#fff;font-family:Arial,sans-serif;font-size:1rem;text-align:center;margin-bottom:14px}
.name-input:focus{outline:none;border-color:#22D3EE;box-shadow:0 0 20px rgba(12,127,196,.35)}
.box-open-btn{width:100%;max-width:420px;height:52px;border:2px solid rgba(34,211,238,.5);background:rgba(34,211,238,.1);border-radius:14px;color:#7DD3FC;font-size:.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:6px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.best-line{margin-top:16px;font-size:.85rem;color:#a7adba}
.best-line b{color:#22D3EE}
.lang-btn{position:fixed;top:16px;right:16px;padding:8px 14px;border:2px solid rgba(34,211,238,.45);background:rgba(0,0,0,.5);color:#7DD3FC;font-size:.72rem;font-weight:900;letter-spacing:.08em;border-radius:999px;cursor:pointer;z-index:60}
.intro-back{position:fixed;top:16px;left:16px;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;text-decoration:none;z-index:60}

.official-banner{
  max-width:420px;width:100%;padding:14px 16px;border-radius:14px;
  border:2px solid rgba(56,189,248,.45);background:rgba(56,189,248,.08);
  margin-bottom:18px;text-align:center;
}
.official-banner .ob-kick{font-size:.6rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#38BDF8;margin-bottom:5px}
.official-banner .ob-name{font-size:1.05rem;font-weight:900;color:#fff}
.official-banner .ob-note{font-size:.78rem;color:#c9b8a8;margin-top:6px;line-height:1.45}

#countdown{position:fixed;inset:0;z-index:56;display:none;align-items:center;justify-content:center;background:#000}
#bigCount{font-size:8rem;font-weight:900;color:#22D3EE;text-shadow:0 0 60px rgba(12,127,196,.9)}

#screen-end{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;padding:20px;overflow-y:auto}
.final-num{font-size:6rem;font-weight:900;color:#22D3EE;line-height:1;text-shadow:0 0 60px rgba(12,127,196,.9)}
.final-label{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#a7adba;margin-top:10px}
.next-player-btn{margin-top:28px;height:64px;padding:0 40px;border:none;border-radius:16px;background:linear-gradient(120deg,#0C7FC4,#22D3EE);color:#fff;font-size:1.15rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(12,127,196,.6)}

.final-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px;margin:18px auto}
.final-stat-cell{border-radius:12px;border:2px solid rgba(12,127,196,.35);background:rgba(12,127,196,.06);padding:12px 4px;text-align:center}
.final-stat-label{font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#7DD3FC;margin-bottom:4px}
.final-stat-val{font-size:1.3rem;font-weight:900;color:#fff}
.points-cell{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.08)}
.points-cell .final-stat-label{color:#38BDF8}
.save-status{font-size:.78rem;font-weight:700;margin-top:14px;min-height:18px}

#screen-game{position:fixed;inset:0;display:none;flex-direction:column;background:#000;overflow:hidden}
.topbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:10px 10px 4px;flex-shrink:0}
.top-box{background:rgba(12,127,196,.08);border:1px solid rgba(12,127,196,.3);border-radius:10px;padding:5px 14px;text-align:center;min-width:70px}
.top-box.official{border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.08)}
.top-label{font-size:.55rem;color:#a7adba;text-transform:uppercase;letter-spacing:.06em}
.top-val{font-size:1.3rem;font-weight:900}
#hLevel{color:#fff}#hPoints{color:#38BDF8}#hTime{color:#38BDF8}

#msg{text-align:center;padding:6px;font-size:1.15rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0}
#msg.watch{color:#22D3EE}#msg.go{color:#38BDF8}#msg.miss{color:#ff1e3c}

.court-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
/* The ball layer is fixed to the viewport, so it must not be left
   sitting over other screens' buttons once a run is over. */

.fortress-ball{position:absolute;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%) scale(1);transition:filter .12s,box-shadow .12s,transform .12s;pointer-events:none;opacity:1;display:grid;place-content:center}
/* The dollar sign rides on top of the ball art. Its own size is set
   in JS alongside the ball's, so it scales with the court rather than
   being fixed. */
/* The dollar sign is drawn as SVG rather than set as a character.
   A heavy text outline was closing the gaps around the vertical bar
   and turning it into an S — here the bar is its own shape, so it
   cannot be lost at any size. */

.fortress-ball.ready{pointer-events:all}
.fortress-ball.lit{filter:brightness(1.45) saturate(1.25);box-shadow:0 0 46px currentColor,0 0 92px currentColor;transform:translate(-50%,-50%) scale(1.14)}
.fortress-ball.wrong{filter:grayscale(1) brightness(.5)}
.ripple{position:fixed;border-radius:50%;border:3px solid #22D3EE;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:14;animation:rippleOut .5s ease-out forwards}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .1s}

#controls{display:flex;justify-content:center;gap:10px;padding:8px 16px 14px;flex-shrink:0}
.ctrl-btn{height:46px;flex:0 1 170px;max-width:200px;border:2px solid rgba(12,127,196,.5);background:rgba(0,0,0,.4);border-radius:12px;color:#fff;font-size:.92rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}

/* The court, exactly as The Recall builds it: a square 5x5 grid of
   real cells. The 1-3-1 occupies five of them; the other twenty stay
   empty, which is what makes the formation read. */
.court-area{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.court{
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
  gap:2.2%;padding:2.2%;
  border:2px solid rgba(255,122,24,.4);border-radius:16px;
  background:#0D1826;
  box-shadow:0 0 60px rgba(255,122,24,.18),inset 0 0 40px rgba(255,122,24,.05),0 20px 60px rgba(0,0,0,.8);
}
.court .cell{
  border-radius:10px;background:rgba(255,255,255,.03);border:2px solid rgba(255,255,255,.07);
}
/* the five that are in play */
.court .spot{
  border-radius:50%;border:none;background-size:100% 100%;cursor:pointer;
  transition:filter .12s,box-shadow .12s,transform .12s;
  transform:scale(1);
}
.court .spot.lit{
  filter:brightness(1.45) saturate(1.25);
  box-shadow:0 0 34px currentColor,0 0 70px currentColor;
  transform:scale(1.08);
}
.court .spot.correct{box-shadow:0 0 0 4px #00D9A5,0 0 22px rgba(0,217,165,.8)}
.court .spot.wrong{box-shadow:0 0 0 4px #FF1493,0 0 22px rgba(255,20,147,.8)}
</style>
</head>
<body>

<!-- INTRO -->
<div id="screen-intro">
  <a class="intro-back" href="index.html" id="introBack">← Back</a>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">ES</button>
  <div class="vrr-sub">1-3-1 zone</div>
  <div class="vrr-title">THE <span>FORTRESS 1-3-1</span></div>

  <div class="official-banner" id="officialBanner" style="display:none;">
    <div class="ob-kick" id="obKick">Official Run</div>
    <div class="ob-name" id="obPlayer">—</div>
    <div class="ob-note" id="obNote">This run counts. Your sponsors pay on the points you score, and you only get one.</div>
  </div>

  <!-- A running demonstration, so a student who has never seen this
       understands it before reading a word. It loops until they start
       a run, and stops the moment they do. -->
  <div class="demo-wrap">
    <div class="demo-label" id="demoLabel">👀 Watch…</div>
    <div class="demo-panel" id="demoPanel"></div>
  </div>

  <div class="htp">
    <button class="htp-toggle" id="htpToggle" onclick="toggleHtp()">
      <span>📖</span>
      <span class="htp-toggle-text" id="htpText">How to play</span>
      <span class="htp-arrow" id="htpArrow">▼</span>
    </button>
    <div class="htp-body" id="htpBody">
      <div class="htp-card">
        <div class="htp-card-title" id="cObjective">🎯 What to do</div>
        <div class="htp-step"><span class="n">1</span><span class="tx" id="cs1"></span></div>
        <div class="htp-step"><span class="n">2</span><span class="tx" id="cs2"></span></div>
        <div class="htp-step"><span class="n">3</span><span class="tx" id="cs3"></span></div>
      </div>
      <div class="htp-card">
        <div class="htp-card-title" id="cScoring">⭐ Chain scoring</div>
        <div class="htp-step"><span class="n">→</span><span class="tx" id="cp1"></span></div>
        <div class="htp-step"><span class="n">→</span><span class="tx" id="cp2"></span></div>
        <div class="htp-step"><span class="n">→</span><span class="tx" id="cp3"></span></div>
        <div class="htp-tip">
          <div class="htp-tip-title" id="cTipTitle">💡 Tip</div>
          <div class="htp-tip-text" id="cTip"></div>
        </div>
      </div>
    </div>
  </div>
  <button class="big-btn" id="bigStart" onclick="handleStartClick()">▶ START</button>
  <div class="best-line" id="bestLine"></div>
</div>

<!-- COUNTDOWN -->
<div id="countdown"><div id="bigCount">3</div></div>

<!-- GAMEPLAY -->
<div id="screen-game">
  <div id="flash"></div>
  <div class="topbar">
    <div class="top-box"><div class="top-label" id="lblLevel">Level</div><div class="top-val" id="hLevel">0</div></div>
    <div class="top-box official"><div class="top-label" id="lblPoints">Points</div><div class="top-val" id="hPoints">0</div></div>
    <div class="top-box"><div class="top-label" id="lblTime">Time</div><div class="top-val" id="hTime">0.0</div></div>
  </div>
  <div id="msg" class="watch"></div>
  <div class="court-area">
    <div class="court" id="court"></div>
  </div>
  <div id="controls">
    <a class="ctrl-btn" href="index.html" id="homeBtn">← Home</a>
  </div>
</div>

<!-- END -->
<div id="screen-end">
  <div class="final-num" id="endNum">0</div>
  <div class="final-label" id="endLabel">Longest Chain Held</div>

  <div class="final-stats">
    <div class="final-stat-cell points-cell"><div class="final-stat-label" id="statPointsLbl">Points</div><div class="final-stat-val" id="endPoints">0</div></div>
    <div class="final-stat-cell"><div class="final-stat-label" id="statTimeLbl">Time</div><div class="final-stat-val" id="endTime">0.0s</div></div>
  </div>

  <div class="save-status" id="saveStatus"></div>

  <button class="next-player-btn" id="againBtn">▶ PLAY AGAIN</button>
  <a class="box-open-btn" id="backToPledge" href="index.html" style="max-width:300px;margin:14px auto 0;">← Back</a>
</div>

function recordTryout(finalLevel, status){
  if (TRYOUT_PRACTICE) return recordCompetitionPractice(finalLevel, status);
  var base = SB_URL + '/rest/v1/campaign_tryouts';
  var headers = {
    'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json', 'Prefer': 'return=representation'
  };
  var filter = '?campaign_id=eq.' + encodeURIComponent(TRYOUT)
             + '&player_id=eq.' + encodeURIComponent(PLAYER_ID)
             + '&game=eq.' + GAME;

    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  })
  .then(function(r){ return r.json(); })

    if (rows && rows.length){
      var row = rows[0];
      if (TRYOUT_ONCE){
        // A score already exists and only one attempt is allowed, so
        // nothing is written — the first run is the result.
        status.style.color = '#ffd35a';
        status.textContent = T('tryoutAlready');
        return;
      }
      return fetch(base + filter, { method:'PATCH', headers:headers, body:JSON.stringify({
        best_level: Math.max(row.best_level || 0, finalLevel),
        runs: (row.runs || 0) + 1,
        updated_at: new Date().toISOString()
      })});

      campaign_id: TRYOUT, player_id: PLAYER_ID, game: GAME,

}

        '<path d="M84,8 Q60,50 84,92"/>' +

}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}


// Positions and colors are chosen once per run and then held. Every

// The court is square and sized to the space left over once the top

function resizeCourt(){
  var area = document.querySelector('.court-area');
  var court = $('court');
  if (!area || !court) return;
  var size = Math.min(area.clientWidth, area.clientHeight);
  if (size < 80) { requestAnimationFrame(resizeCourt); return; }
  court.style.width = size + 'px';
  court.style.height = size + 'px';
}
window.addEventListener('resize', resizeCourt);
window.addEventListener('orientationchange', function(){ setTimeout(resizeCourt, 220); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCourt);

function buildBoard(){
  var court = $('court');
  if (!court) return;

  // Twenty-five cells, five of them in play. The grid does the
  // arranging, so there is nothing to measure and nothing to position
  // by hand — which is why this cannot land in the wrong place while
  // the page is still settling.
  court.innerHTML = '';
  targetEls = [];

  if(!boardColors) newBoardArrangement();
  var colors = boardColors;

  for (var c = 0; c < 25; c++){
    var el = document.createElement('div');
    var t = SPOTS.indexOf(c);

    if (t === -1){
      el.className = 'cell';
    } else {
      el.className = 'spot';
      el.style.backgroundImage = ballArt(colors[t]);
      el.style.color = colors[t];
      (function(idx){
        el.addEventListener('pointerdown', function(e){
          e.preventDefault();
          handleTargetTap(idx);
        });
      })(t);
      targetEls[t] = el;
    }
    court.appendChild(el);
  }


  // Restore whatever the run was in the middle of.
  targetEls.forEach(function(el){el.classList.toggle('ready',isReady)});
  resizeCourt();
}

  var now=audioCtx.currentTime;
  var osc=audioCtx.createOscillator();
  var oscGain=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(130,now);
  osc.frequency.exponentialRampToValueAtTime(46,now+0.1);
  oscGain.gain.setValueAtTime(.001,now);
  oscGain.gain.exponentialRampToValueAtTime(.85,now+0.006);
  oscGain.gain.exponentialRampToValueAtTime(.001,now+0.16);
  osc.connect(oscGain);oscGain.connect(audioCtx.destination);
  osc.start(now);osc.stop(now+0.17);

  var bufSize=Math.floor(audioCtx.sampleRate*0.035);
  var buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  var data=buf.getChannelData(0);
  for(var i=0;i<bufSize;i++){data[i]=(Math.random()*2-1)*(1-i/bufSize)}
  var noise=audioCtx.createBufferSource();
  noise.buffer=buf;
  var noiseFilter=audioCtx.createBiquadFilter();
  noiseFilter.type='lowpass';
  noiseFilter.frequency.value=900;
  var noiseGain=audioCtx.createGain();
  noiseGain.gain.setValueAtTime(.22,now);
  noiseGain.gain.exponentialRampToValueAtTime(.001,now+0.035);
  noise.connect(noiseFilter);noiseFilter.connect(noiseGain);noiseGain.connect(audioCtx.destination);
  noise.start(now);
}

function lightTarget(idx){targetEls[idx].classList.add('lit');playThump()}
function unlightTarget(idx){targetEls[idx].classList.remove('lit')}

// Whether the balls are currently accepting taps. Kept as state
// rather than only as a class, because re-measuring the court rebuilds
// the ball elements — and a rebuild landing during the player's turn
// used to silently drop their ability to tap.
var isReady=false;
function setReady(on){
  isReady=on;
  targetEls.forEach(function(el){el.classList.toggle('ready',on)});
}

function startDrill(){
  if(phase==='running')return;
  stopDemo();
  ensureAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); } }catch(e){}
  $('screen-intro').style.display='none';
  $('screen-end').style.display='none';
  $('screen-game').style.display='flex';

  // Two frames, so the game screen is genuinely laid out before the
  // court is measured. The countdown then gives another 2.4 seconds
  // for fullscreen to settle, and buildBoard runs again at the end of
  // it against the final box.
  newBoardArrangement();

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      buildBoard();
      showCountdownThen(function(){ buildBoard(); runDrill(); });
    });
  });
}

function showCountdownThen(cb){
  $('countdown').style.display='flex';
  var n=3;$('bigCount').textContent=n;
  var iv=setInterval(function(){
    n--;
    if(n<=0){clearInterval(iv);$('countdown').style.display='none';cb()}
    else{$('bigCount').textContent=n}
  },800);
}

function runDrill(){
  phase='running';sequence=[];playerIdx=0;level=0;
  runStartTime=performance.now();
  $('hLevel').textContent='0';$('hPoints').textContent='0';$('hTime').textContent='0.0';
  msg(T('getReady'),'go');
  timers.push(setTimeout(startLevel,900));
  requestAnimationFrame(updateTimerDisplay);
}
function updateTimerDisplay(){
  if(phase!=='running')return;
  $('hTime').textContent=((performance.now()-runStartTime)/1000).toFixed(1);
  requestAnimationFrame(updateTimerDisplay);
}

function startLevel(){
  if(phase!=='running')return;
  playerIdx=0;
  sequence.push(Math.floor(Math.random()*NUM_TARGETS));
  level=sequence.length;
  $('hLevel').textContent=level;
  setReady(false);
  msg(T('watch'),'watch');
  playSequence(0);
}

function playSequence(i){
  if(phase!=='running')return;
  if(i>=sequence.length){
    setReady(true);
    msg(T('yourTurn'),'go');
    return;
  }
  var idx=sequence[i];
  lightTarget(idx);
  timers.push(setTimeout(function(){
    unlightTarget(idx);
    timers.push(setTimeout(function(){playSequence(i+1)},GAP_MS));
  },LIGHT_MS));
}

function handleTargetTap(idx){
  if(phase!=='running')return;
  if(!targetEls[idx].classList.contains('ready'))return;

  var rect=targetEls[idx].getBoundingClientRect();
  ripple(rect.left+rect.width/2,rect.top+rect.height/2);flash();

  if(idx===sequence[playerIdx]){
    lightTarget(idx);
    setTimeout(function(){unlightTarget(idx)},220);
    playerIdx++;
    if(playerIdx>=sequence.length){
      setReady(false);
      // Points only bank on a level actually held to the end.
      $('hPoints').textContent = pointsFor(level);
      msg(T('held'),'go');
      timers.push(setTimeout(startLevel,LEVEL_PAUSE_MS));
    }
  }else{
    targetEls[idx].classList.add('wrong');
    endDrill();
  }
}

function endDrill(){
  if(phase==='done')return;
  phase='done';clrT();setReady(false);
  var court=$('court');
  if(court) court.style.pointerEvents='none';

  // The level being attempted when the run ended was never completed,
  // so the score is the last level actually held. Same rule for
  // practice and official, so a kid's practice number means something.
  var finalLevel = Math.max(0, level - 1);
  var finalTime=(performance.now()-runStartTime)/1000;

  msg(T('broken'),'miss');
  timers.push(setTimeout(function(){
    showFinalScore(finalLevel,finalTime);
  },700));
}

function showFinalScore(finalLevel,finalTime){
  var points = pointsFor(finalLevel);

  if(finalLevel>best){best=finalLevel;saveBest()}

  $('endNum').textContent=finalLevel;
  $('endPoints').textContent=points;
  $('endTime').textContent=finalTime.toFixed(1)+'s';
  $('screen-game').style.display='none';
  $('screen-end').style.display='flex';

  var status=$('saveStatus');

  if(TRYOUT && PLAYER_ID){
    $('endLabel').textContent=T('labelPractice');
    status.style.color='#a7adba';
    recordTryout(finalLevel, status);
    return;
  }

  if(!IS_OFFICIAL){
    $('endLabel').textContent=T('labelPractice');
    status.style.color='#7d8ba3';

    // Somebody playing from the site has just seen a number. This is
    // the moment it means something — what that same run would have
    // raised for a program.
    if (isDemoPlay() && points > 0){
      status.innerHTML = T('worthFree')
        .split('{P}').join(points)
        .split('{M}').join('$' + (points * 0.25).toFixed(2))
        .split('{T}').join('$' + (points * 0.25 * 10).toFixed(2));
    } else {
      status.textContent=T('practiceOnly');
    }

    // A practice best is shown to sponsors on the pledge page, so it
    // is kept per challenge and only ever moves upward. Free play
    // outside a challenge records nothing at all.
    if (CHALLENGE_ID && PLAYER_ID) recordPractice(finalLevel);
    return;
  }

  $('endLabel').textContent=T('labelOfficial');
  status.style.color='#a7adba';
  status.textContent=T('recording');

  // The run key is checked inside the database, so holding the public
  // sponsor link is not enough to end anyone's official run.
  fetch(SB_URL+'/rest/v1/rpc/record_official_run',{
    method:'POST',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      p_challenge:CHALLENGE_ID,
      p_player:PLAYER_ID,
      p_key:RUN_KEY,
      p_level:finalLevel,
      p_points:points,
      p_time:Number(finalTime.toFixed(2)),
      // which challenge this run belongs to — a student takes one run
      // in each, and the three add up to their score
      p_game:GAME
    })
  })
  .then(function(r){
    if(!r.ok) throw new Error('request failed');
    return r.json();
  })
  .then(function(out){
    if(out && out.ok){
      status.style.color='#00D9A5';
      status.textContent=T('recorded', { P: points });
      IS_OFFICIAL=false;
      return;
    }
    if(out && out.reason==='already'){
      status.style.color='#38BDF8';
      status.textContent=T('wasAlready');
      IS_OFFICIAL=false;
      return;
    }
    status.style.color='#ff6b35';
    status.textContent=T('wrongLink');
  })
  .catch(function(e){
    status.style.color='#ff6b35';
    status.textContent=T('noServer');
    console.error('Challenge run write — network error:',e);
  });
}

// Keeps the highest practice level for this player in this
// challenge. Upserts, then only overwrites when the new run is
// actually better — so a bad run never lowers a posted best.
function recordPractice(finalLevel){
  var base = SB_URL + '/rest/v1/challenge_practice';
  var headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
  var filter = '?challenge_id=eq.' + encodeURIComponent(CHALLENGE_ID)
             + '&player_id=eq.' + encodeURIComponent(PLAYER_ID);

  fetch(base + filter + '&select=best_level,runs', {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    if (rows && rows.length){
      var row = rows[0];
      return fetch(base + filter, {
        method: 'PATCH',
        headers: headers,
        body: JSON.stringify({
          best_level: Math.max(row.best_level || 0, finalLevel),
          runs: (row.runs || 0) + 1,
          updated_at: new Date().toISOString()
        })
      });
    }
    return fetch(base, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
        challenge_id: CHALLENGE_ID,
        player_id: PLAYER_ID,
        best_level: finalLevel,
        runs: 1
      })
    });
  })
  .catch(function(e){ console.error('Practice record:', e); });
}

function loadBest(){
  best=0;
  try{best=parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0}catch(e){}
  $('bestLine').innerHTML = best>0 ? T('bestLine', { L: best, P: pointsFor(best) }) : '';
}
function saveBest(){try{localStorage.setItem(BEST_KEY,String(best))}catch(e){}}


function handleStartClick(){
  if (TRYOUT_ONCE && !confirm(T('confirmOnce'))) return;
  if(IS_OFFICIAL){
    if(!confirm(T('confirmOfficial'))) return;
    startDrill();
    return;
  }
  if (isDemoPlay()){
    if (demoRunsLeft() <= 0){ showDemoEnd(); return; }
    noteDemoRun();
  }
  // The name comes from the student's own page when they arrive
  // from it, and is simply not needed for free play.
  startDrill();
}

$('againBtn').addEventListener('click',function(){
  phase='idle';
  $('screen-end').style.display='none';
  $('screen-intro').style.display='flex';
  loadBest();
  startDemo();
});

applyLang();
loadBest();
startDemo();
</script>
