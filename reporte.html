     a propósito: WhatsApp y los demás no resuelven rutas
     relativas, y con una relativa la vista previa sale en
     blanco igual que sin imagen. -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<meta property="og:site_name" content="Cada Punto Cuenta">

<style>
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(880px,calc(100% - 40px));margin:0 auto}
.hide{display:none !important}

header{flex:0 0 auto;background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
/* La marca pasó de una palabra a tres el 22 de octubre de 2026, y
   en la barra de 320px ya no cabía: con la hamburguesa y el botón
   de acción al lado pedía 339px de los 320 que hay.

   Se arregla por el ESPACIADO antes que por el tamaño. Dieciocho
   letras a .07em son casi veinte píxeles de aire, que es justo lo
   que sobraba; quitando casi todo ese aire la marca cabe sin tener
   que encogerla hasta que no se lea. El tamaño baja un poco también,
   pero poco. */
@media(max-width:380px){ .mark{font-size:.92rem} }
@media(max-width:430px){ .mark{font-size:.84rem;letter-spacing:.015em} }
.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.langb:hover{border-color:var(--orange);color:var(--orange)}

main{flex:1 1 auto}
main .wrap{padding:38px 0 46px}
h1{font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1.12;letter-spacing:-.04em;margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 24px;max-width:58ch}

/* ── La puerta ──────────────────────────────────────────────────── */
.gate{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:clamp(22px,5vw,32px);box-shadow:0 8px 25px #17243808}
label{display:block;font-weight:700;font-size:.9rem;margin:16px 0 6px}
label:first-of-type{margin-top:0}
input[type=text],select{width:100%;padding:13px 14px;border:1px solid #d6d9d6;
  border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:1.02rem}
input:focus,select:focus{outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,122,24,.18)}
.help{color:var(--muted);font-size:.86rem;margin:5px 0 0}
.btn{display:inline-block;border:0;border-radius:9px;padding:14px 22px;
  background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;text-decoration:none;text-align:center}
.btn.go{background:var(--orange);color:#111a24;width:100%;margin-top:18px}
.btn.line{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn.line:hover{background:var(--navy);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:12px 0 0;font-weight:700;font-size:.9rem;min-height:1.2em}
.msg.bad{color:var(--bad)}

/* ── La portada del reporte ─────────────────────────────────────── */
.rtop{margin:0 0 24px;padding-bottom:18px;border-bottom:3px solid var(--navy)}
.kick{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--orange);margin:0 0 8px}
.rtop h2{font-size:clamp(1.4rem,4vw,2rem);letter-spacing:-.035em;margin:0 0 6px}
.rtop .sub{color:var(--muted);margin:0;font-size:.9rem}

/* ── Los tres números ───────────────────────────────────────────── */
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 10px}
.tal{background:#fff;border:1px solid var(--linea);border-radius:13px;
  padding:15px 12px;text-align:center;box-shadow:0 8px 25px #17243806}
.tal b{display:block;font-size:1.6rem;font-weight:900;letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums}
.tal span{display:block;color:var(--muted);font-size:.68rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.tal.plata b{color:var(--orange)}
@media(max-width:460px){ .tally{grid-template-columns:1fr} }

.nota{margin:12px 0 0;color:var(--muted);font-size:.86rem;max-width:62ch}

h3{font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:34px 0 10px}

/* ── Las tablas ─────────────────────────────────────────────────── */
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;
  overflow:hidden;box-shadow:0 8px 25px #17243808}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--linea)}
thead th{border-top:none;background:var(--cream);font-size:.68rem;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{font-weight:700}
td.nm small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
/* Los dos avisos de una promesa. Una corrección y un correo que
   rebotó no son el mismo problema: el primero ya está resuelto y sólo
   hay que saberlo, el segundo necesita una llamada. Se ven distintos
   porque se hacen cosas distintas con ellos. */
small.ojo,.nota.ojo{color:#8a4b00}
small.malo,.nota.malo{color:#a8323f}
tbody tr.cero td{color:var(--muted)}
tfoot td{border-top:2px solid var(--navy);font-weight:900;background:var(--cream)}
.vacio{padding:22px;text-align:center;color:var(--muted)}

.acc{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 0}

/* El aviso lleva borde naranja y no gris como las otras tarjetas: lo
   que hay dentro manda correos a gente de verdad y no se puede
   deshacer, así que no debe parecerse a imprimir ni a bajar un CSV. */
.aviso{border-left:3px solid var(--orange)}
.aviso p{margin:0 0 12px;padding:0 18px}
.aviso p:first-child{padding-top:18px}
.aviso-n{font-size:1.05rem}
.aviso-ojo{color:var(--muted);font-size:.9rem}
.aviso-acc{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 18px}
.aviso .msg{padding:0 18px 18px;margin:0}
.acc .btn{flex:1 1 170px}

footer{flex:0 0 auto;background:#0a1420;color:#aeb9c6;
  padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
footer .f-dot{padding:0 8px;opacity:.45}

/* ── Impreso ──────────────────────────────────────────────────────
   Un entrenador lo imprime y lo archiva, o lo lleva a una reunión.
   En papel: blanco, sin sombras, y con la dirección al pie para que
   una foto de la hoja lleve a algún sitio. */
.pie-print{display:none}
@media print{
  header,footer,.langb,.acc,.gate,.aviso{display:none !important}
  /* El aviso no se imprime: es un botón, y en papel un botón es
     una mancha de tinta que confunde. */
  html,body{background:#fff;color:#000}
  main .wrap{width:100%;padding:0}
  .kick,h3{color:#000}
  .tal,.card{box-shadow:none;border:1px solid #000;background:#fff}
  .tal b,.tal.plata b{color:#000}
  thead th,tfoot td{background:#fff}
  .nota{color:#000}
  table{font-size:.86rem}
  tr,.tal{break-inside:avoid}
  .pie-print{display:block;margin-top:20px;padding-top:10px;border-top:2px solid #000;
    font-size:.8rem;text-align:center;break-inside:avoid}
}

/* ══ La barra, el menú y el idioma ══════════════════════════════════
   Puesto al final de la hoja a propósito: lo que haya escrito arriba
   sobre header, .bar o .langb queda debajo de esto.

   --barra tiene que ser la MISMA altura en los dos sitios donde se
   usa: el hueco que deja scroll-padding para que un ancla no quede
   detrás de la cabecera, y el punto donde arranca el panel. */
:root{--barra:66px}
html{scroll-padding-top:calc(var(--barra) + 10px)}
/* overflow-x en el body y no sólo en html: en Safari de iOS, html
   solo no lo sujeta y basta un elemento ancho para arrastrar la
   página de lado. */
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:100;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{min-height:var(--barra);padding:0;gap:10px}
/* El botón del idioma dice el idioma AL QUE lleva, no el que está
   puesto. Por eso necesita sitio para una palabra y no para dos
   letras, y nowrap para que «Español» no se parta en dos líneas. */
.langb,#lang{white-space:nowrap;min-height:40px;font-size:.85rem;
  padding:0 12px;border-radius:9px;font-family:inherit}
.barra-dcha{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Las rayas se pintan con currentColor, no con blanco: prometer.html
   tiene la barra en crema con la marca en navy, y unas rayas
   blancas ahí no se ven. Heredando el color de la barra valen para
   las dos, y para la próxima página que cambie de fondo. Lo
   encontró una captura, no la prueba: la prueba miraba que el botón
   estuviera, no que se viera. */
/* El color de las rayas sale de la barra, y la barra de estas
   páginas no declaraba ninguno: heredaban la tinta del cuerpo
   —navy sobre navy— y el botón se veía con 1.2:1 de contraste,
   que es no verse. Barra navy, tinta blanca. */
header{color:#fff}
.hamb{display:none;width:44px;height:44px;flex:0 0 44px;color:inherit;
  border:1px solid currentColor;background:transparent;border-radius:9px;
  cursor:pointer;padding:0;align-items:center;justify-content:center}
@supports (border-color: color-mix(in srgb, currentColor 45%, transparent)){
  .hamb{border-color: color-mix(in srgb, currentColor 45%, transparent)}
}
.hamb:hover{border-color:var(--orange);color:var(--orange)}
/* color:inherit en la propia raya y no sólo en el botón: privacy
   y terms traen un `strong,b{color:var(--ink)}` para el texto, y
   currentColor dentro de un <b> resuelve al color DEL <b>, no al
   del padre. Las rayas salían navy sobre navy. */
.hamb b{display:block;width:20px;height:2px;color:inherit;
  background:currentColor;border-radius:2px;
  position:relative;transition:background .18s ease}
.hamb b::before,.hamb b::after{content:'';position:absolute;left:0;
  width:20px;height:2px;background:currentColor;border-radius:2px;transition:transform .18s ease}
.hamb b::before{top:-6px}
.hamb b::after{top:6px}
.hamb[aria-expanded="true"] b{background:transparent}
.hamb[aria-expanded="true"] b::before{transform:translateY(6px) rotate(45deg)}
.hamb[aria-expanded="true"] b::after{transform:translateY(-6px) rotate(-45deg)}

.menu{position:absolute;left:0;right:0;top:100%;
  display:flex;flex-direction:column;align-items:stretch;
  background:var(--navy);border-bottom:1px solid #ffffff22;
  /* Cerrado con max-height para que tenga transición, y con
     visibility para que el teclado no se meta dentro: max-height
     sola deja los enlaces tabulables en un panel invisible. */
  max-height:0;visibility:hidden;overflow:hidden;
  transition:max-height .22s ease,visibility .22s}
.menu.abierto{max-height:80vh;visibility:visible;overflow:auto}
.menu a{display:flex;align-items:center;min-height:52px;
  padding:0 max(20px,calc((100vw - 900px)/2 + 20px));
  color:#fff;text-decoration:none;font-weight:600;font-size:1rem;
  border-top:1px solid #ffffff14}
.menu a:first-child{border-top:0}
.menu a:hover{color:var(--orange)}
.menu a.cta{margin:14px 20px 18px;justify-content:center;border-top:0;
  background:var(--orange);color:#111a24;font-weight:800;border-radius:9px}
.menu a.cta:hover{color:#111a24}
/* Las rayas se ven siempre: estas páginas no tienen enlaces en la
   barra en ningún tamaño, así que el menú es la única puerta y
   esconderlo en escritorio dejaría la página sin salida otra vez. */
.hamb{display:flex}
@media(max-width:430px){
:root{--barra:60px}
.langb,#lang{padding:0 10px;font-size:.8rem}
}
</style>

<script>
var SB='https://sdaphocueugzfvjovuxd.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

function rpc(fn, args){
  return fetch(SB+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  }).then(function(r){
    if (r.ok) return r.json();
    /* El cuerpo de un error de PostgREST trae el porqué —message,
       hint, details— y tirarlo era lo que convertía cada fallo en
       una visita al editor de SQL: la página sabía exactamente qué
       había pasado y enseñaba "no se pudo". Se lee antes de lanzar. */
    return r.text().then(function(t){
      var d = {}; try { d = JSON.parse(t) } catch(x){}
      var e = new Error(d.message || d.hint || t || ('rpc ' + r.status));
      e.detalle = d.details || d.hint || '';
      e.codigo  = d.code || r.status;
      throw e;
    });
  });

/* El porqué, cuando lo hay. Un mensaje amable que no dice nada manda
   a alguien a buscar en la base; el mismo mensaje con la razón
   detrás se arregla solo. Se recorta: esto es una línea de aviso, no
   un registro. */
function porque(x){
  if (!x) return '';
  var r = (typeof x === 'string') ? x
        : (x.why || x.error || x.message || x.hint || x.detalle || '');
  return r ? ' — ' + String(r).slice(0, 160) : '';
}
}

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
            localStorage.getItem('fc-lang') ||
            ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function T(k,v){
  var s=(S[LANG]&&S[LANG][k])||S.es[k]||'';
  /* El piso entra solo, sin que nadie lo pida. Las frases que lo
     nombran son cuatro y están en dos idiomas, y basta con que una
     se escriba a mano para que la página le prometa al entrenador un
     número que el servidor no respeta. Ya pasó: decían cincuenta
     centavos mientras PISO_CENTS valía quinientos, y la cuenta de
     "a cuántos voy a escribir" contaba promesas que no se cobraban. */
  s = s.split('{P}').join(money(PISO_CENTS/100));
  if(v) Object.keys(v).forEach(function(x){ s=s.split('{'+x+'}').join(v[x]) });
  return s;
}
function $(id){ return document.getElementById(id) }
function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function money(n){ return '$'+Number(n||0).toFixed(2) }
/* UN DÍA DE CALENDARIO NO ES UN INSTANTE, y tratarlo como tal le
   restaba un día a todas las fechas.

   `plays_on` es un `date` de PostgreSQL: llega como "2026-11-07", sin
   hora. new Date("2026-11-07") lo lee como medianoche UTC, y Puerto
   Rico va cuatro horas por detrás — así que al pintarlo en hora local
   salía el 6. El juego del viernes aparecía el jueves en el reporte
   que el entrenador imprime y reparte.

   Una fecha sin hora se parte a mano y se construye en hora local, que
   es donde vive. Lo que sí trae hora —un timestamptz, como el sello de
   abajo— se deja pasar por el camino de siempre, porque ahí el
   instante es real y convertirlo es lo correcto. */
function fecha(iso){
  if(!iso) return '';
  try{
    var d;
    var solo = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    if (solo) d = new Date(+solo[1], +solo[2] - 1, +solo[3]);
    else      d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString(LANG==='es'?'es-PR':'en-US',
      {day:'numeric',month:'long',year:'numeric'});
  }catch(e){ return '' }
}

var CODE=null, RETOS=[], REP=null, RETO=null;

/* El resultado del último envío. Vive aquí fuera porque después de
   mandar se vuelve a pedir el reporte —para que los estados salgan
   al día— y eso repinta la página entera; si el mensaje viviera en el
   DOM, el repintado se lo llevaría justo cuando hace falta leerlo. */
var AVISO=null;

/* Los avisos los manda el servidor, no la página: hace falta la clave
   de Resend y la de servicio, y ninguna de las dos puede estar en un
   fichero que se descarga.

   Y los manda el servidor DE CADA PUNTO CUENTA. Esta línea apuntaba al
   compartido, que es el de los otros productos: el entrenador
   pulsaba «avisar» desde aquí y la llamada se iba a un servidor que
   no tiene la licencia, así que los avisos salían y la factura no
   se creaba nunca. El botón del admin sí apuntaba bien, y por eso
   no se notaba. */
var SERVER='https://hooporia-server.onrender.com';

/* El piso de la promesa. Tiene que ser el MISMO número que
   PISO_CENTS en server.js y que el $5 que prometer.html le dice al
   padrino en los dos idiomas. Estaba en 50 aquí y el servidor
   también, mientras la página prometía $5: la cuenta que veía el
   entrenador antes de pulsar incluía promesas que luego no se
   cobraban. */
var PISO_CENTS = 500;

/* Dos pasos con el mismo botón: primero el código trae los retos,
   después el reto escogido trae el reporte. Un paso menos que
   pedirle al entrenador que aprete dos veces para lo mismo. */
function seguir(){
  var m=$('gm'); m.className='msg'; m.textContent='';
  if(RETOS.length) return verReporte();

  var k=($('code').value||'').trim();
  if(!k) return;
  $('tGo').disabled=true;

  rpc('juegos_del_codigo',{p_code:k}).then(function(r){
    $('tGo').disabled=false;
    if(!r||!r.ok) throw new Error('bad');
    CODE=k;
    RETOS=r.juegos||[];
    if(!RETOS.length) throw new Error('none');
    llenarRetos();
    $('pick').classList.remove('hide');
    $('tGo').textContent=T('go');
  }).catch(function(e){
    $('tGo').disabled=false;
    m.className='msg bad';
    m.textContent = (e&&e.message==='none') ? T('errNone')
                  : (e&&e.message==='bad')  ? T('errCode') : T('errGen');
  });
}

/* El desplegable lleva el marcador cuando lo hay. Un entrenador con
   tres juegos el mismo fin de semana los distingue por el resultado
   antes que por la fecha, y «sin jugar» le dice por qué uno de ellos
   todavía no tiene reporte que mirar. */
function llenarRetos(){
  $('reto').innerHTML = RETOS.map(function(x){
    var f = fecha(x.fecha);
    var marca = x.jugado
      ? (x.puntos + (x.rival_puntos!=null ? '–'+x.rival_puntos : ''))
      : T('sinJugar');
    var n = (x.promesas||0) + ' ' + T('nPromesas');
    return '<option value="'+esc(x.game_id)+'">'+
             esc(x.juego)+(x.rival?' · '+esc(x.rival):'')+
             (f?' · '+esc(f):'')+' · '+esc(marca)+' · '+esc(n)+
           '</option>';
  }).join('');
}

function verReporte(){
  var id=$('reto').value;
  if(!id) return;
  $('tGo').disabled=true;
  rpc('juego_reporte_cobro',{p_code:CODE,p_game:id}).then(function(r){
    $('tGo').disabled=false;
    if(!r||!r.ok) throw new Error('rep');
    REP=r; RETO=id;
    $('gate').classList.add('hide');
    $('out').classList.remove('hide');
    pintar();
    try{ window.scrollTo(0,0) }catch(e){}
  }).catch(function(){
    $('tGo').disabled=false;
    var m=$('gm'); m.className='msg bad'; m.textContent=T('errGen');
  });
}

function pintar(){
  var r=REP, ps=r.pledges||[], res=r.resumen||{};

  /* Cuántos recibirían algo si se pulsa ahora. La cuenta de verdad la
     hace el servidor, que es el único que escribe en la base; ésta es
     para que el entrenador sepa a cuánta gente va a escribir ANTES de
     pulsar. Si alguna vez las dos no coinciden, manda la del servidor
     y lo que se corrige es esta línea. */
  /* LO DICE LA BASE, no esta página.
     Esto contaba «los que deben algo y no han sido avisados», y por
     eso un marcador RETIRADO salía sin nadie a quien escribir: con el
     resultado fuera, todos deben cero. Pero a quien ya se le dijo
     $14.50 hay que decirle que ahora no debe nada, y ésa es
     exactamente la gente que este cálculo dejaba fuera. */
  var porAvisar = Number(res.por_avisar || 0);

  /* ESTADO POR PROMESA. Es la columna que convierte una lista en algo
     con lo que se puede cobrar: sin ella, el que no debe nada y el que
     debe y no se enteró se ven exactamente igual, y son dos problemas
     muy distintos — el segundo lo arregla una llamada de teléfono. */
  function estado(p){
    if (p.no_entregable)
      return '<small class="malo">'+esc(T('eMuerto'))+
             (p.fallo?' · '+esc(String(p.fallo).slice(0,60)):'')+'</small>';
    if (p.bajo_minimo)
      return '<small>'+esc(T('eBajo'))+'</small>';
    if (p.corregido)
      return '<small class="ojo">'+esc(T('eCorregido',{V:money(p.dijimos)}))+'</small>';
    if (!p.avisado)
      return '<small class="ojo">'+esc(T('eSinAvisar'))+'</small>';
    return '<small>'+esc(T('eAvisado'))+'</small>';
  }

  var fP = ps.length ? ps.map(function(p){
    return '<tr'+(!(p.total>0)?' class="cero"':'')+'>'+
      '<td class="nm">'+esc(p.padrino)+estado(p)+'</td>'+
      '<td>'+esc(p.correo||'')+'</td>'+
      '<td class="num">'+money(p.tarifa)+'</td>'+
      '<td class="num">'+(p.tope!=null?money(p.tope):T('sinTope'))+'</td>'+
      '<td class="num">'+money(p.total)+'</td>'+
    '</tr>';
  }).join('') : '';

  var marca = r.jugado
    ? (r.puntos + (r.rival_puntos!=null ? '–'+r.rival_puntos : ''))
    : T('sinJugar');

  /* Lo que hay que mirar antes de cobrar, dicho en una línea cada
     cosa y sólo cuando la hay. */
  var avisos = [];
  if (res.bajo_minimo)
    avisos.push('<p class="nota">'+esc(T('resumenBajo',{N:res.bajo_minimo}))+'</p>');
  if (res.corregidos)
    avisos.push('<p class="nota ojo">'+esc(T('resumenCorr',{N:res.corregidos}))+'</p>');
  if (res.no_entregables)
    avisos.push('<p class="nota malo">'+esc(T('resumenMuerto',{N:res.no_entregables}))+'</p>');

  $('out').innerHTML =
    '<div class="rtop">'+
      '<p class="kick">'+esc(T('kick'))+'</p>'+
      '<h2>'+esc(r.juego||'')+'</h2>'+
      '<p class="sub">'+esc(r.campana||'')+
        (r.fecha?' · '+esc(fecha(r.fecha)):'')+'</p>'+
      (r.es_prueba
        ? '<p class="nota malo"><b>'+esc(T('esPrueba'))+'</b></p>' : '')+
    '</div>'+

    '<div class="tally">'+
      '<div class="tal plata"><b>'+money(res.prometido)+'</b><span>'+
        esc(T('nPrometido'))+'</span></div>'+
      '<div class="tal"><b>'+(res.promesas||0)+'</b><span>'+
        esc(T('nPromesas'))+'</span></div>'+
      '<div class="tal"><b>'+esc(marca)+'</b><span>'+
        esc(T('marcador'))+'</span></div>'+
    '</div>'+
    '<p class="nota">'+esc(T('nota'))+'</p>'+
    avisos.join('')+

    '<h3>'+esc(T('hPromesas'))+'</h3>'+
    '<div class="card">'+ (fP ?
      '<table><thead><tr>'+
        '<th>'+esc(T('thPadrino'))+'</th>'+
        '<th>'+esc(T('thCorreo'))+'</th>'+
        '<th class="num">'+esc(T('thTarifa'))+'</th>'+
        '<th class="num">'+esc(T('thTope'))+'</th>'+
        '<th class="num">'+esc(T('thTotal'))+'</th>'+
      '</tr></thead><tbody>'+fP+'</tbody>'+
      '<tfoot><tr><td colspan="4">'+esc(T('totalFila'))+'</td>'+
        '<td class="num">'+money(res.prometido)+'</td></tr></tfoot></table>'
      : '<p class="vacio">'+esc(T('sinPromesas'))+'</p>') +
    '</div>'+

    /* El aviso va DESPUÉS de la tabla a propósito: el entrenador tiene
       que haber pasado por los números antes de llegar al botón que
       los manda. */
    '<h3>'+esc(T('hAviso'))+'</h3>'+
    '<div class="card aviso">'+
      '<p>'+esc(T('avisoQue'))+'</p>'+
      /* Sin marcador Y sin nadie a quien corregir, no hay nada que
         hacer. Sin marcador PERO con gente que lleva una cifra
         nuestra encima, hay mucho que hacer. */
      (!r.jugado && !porAvisar
        ? '<p class="vacio">'+esc(T('avisoSinJugar'))+'</p>'
        : (porAvisar
            ? '<p class="aviso-n"><b>'+
              esc(!r.jugado ? T('avisoRetirar',{N:porAvisar})
                            : T('avisoCuantos',{N:porAvisar}))+'</b></p>'+
              '<p class="aviso-ojo">'+esc(T('avisoRevisa'))+'</p>'+
              '<div class="aviso-acc" id="avisoAcc">'+
                '<button class="btn" onclick="pedirConfirma()">'+esc(T('avisoBoton'))+'</button>'+
              '</div>'
            : '<p class="vacio">'+esc(T('avisoNinguno'))+'</p>'))+
      '<p class="msg'+(AVISO&&AVISO.mal?' bad':'')+'" id="avisoMsg">'+
        esc(AVISO?AVISO.texto:'')+'</p>'+
    '</div>'+

    '<div class="acc">'+
      '<button class="btn" onclick="window.print()">'+esc(T('imprimir'))+'</button>'+
      '<button class="btn line" onclick="bajarCSV()">'+esc(T('csv'))+'</button>'+
      '<button class="btn line" onclick="volver()">'+esc(T('otro'))+'</button>'+
      '<a class="btn line" href="mi-equipo.html">'+esc(T('aMiEquipo'))+'</a>'+
    '</div>'+

    '<p class="pie-print">'+esc(T('sello',{D:fecha(new Date().toISOString())}))+'</p>';
}

/* ══════════════════════════════════════════════════════════════════
   MANDAR LOS AVISOS

   Dos pulsaciones, no una. La primera enseña a cuánta gente se le va
   a escribir y pide confirmación; la segunda manda. Un correo no se
   retira, y el botón está al lado de «Imprimir» y «Bajar CSV», que no
   hacen daño: sin el paso de confirmar, el que viene a imprimir se
   lleva cincuenta correos por delante.

   El servidor decide qué sale y qué no. Esta página sólo pide,
   cuenta lo que pasó, y vuelve a pedir el reporte para que los
   estados que se vean sean los de la base y no los que había antes.
   ══════════════════════════════════════════════════════════════════ */
function pedirConfirma(){
  var n=$('avisoAcc'); if(!n) return;
  var cuantos = Number((REP&&REP.resumen&&REP.resumen.por_avisar) || 0);
  n.innerHTML =
    '<button class="btn" onclick="mandarAvisos()">'+esc(T('avisoConfirma',{N:cuantos}))+'</button>'+
    '<button class="btn line" onclick="pintar()">'+esc(T('avisoCancela'))+'</button>';
}

function mandarAvisos(){
  var n=$('avisoAcc'), m=$('avisoMsg');
  if(!n||!CODE||!RETO) return;
  n.innerHTML='<button class="btn" disabled>'+esc(T('avisoMandando'))+'</button>';
  if(m){ m.className='msg'; m.textContent=T('avisoMandando') }

  fetch(SERVER+'/game-notices',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:CODE,game_id:RETO})
  }).then(function(res){
    /* 403 es el código rechazado y se dice aparte: «no se pudo hablar
       con el servidor» mandaría al entrenador a mirar su internet
       cuando lo que pasa es que su código no abre ese reto. */
    if(res.status===403) throw new Error('code');
    if(!res.ok) throw new Error('server');
    return res.json();
  }).then(function(d){
    if(!d||!d.ok) throw new Error('server');

    /* Una corrección no es un aviso nuevo y se cuenta aparte: para el
       entrenador no es lo mismo «salieron doce avisos» que «salieron
       doce correcciones», que quiere decir que a doce personas se les
       había dicho otra cifra. */
    var partes=[];
    if(d.sent)          partes.push(T('avisoHecho',{N:d.sent}));
    if(d.corrected)     partes.push(T('avisoCorr',{N:d.corrected}));
    if(!d.sent && !d.corrected) partes.push(T('avisoNada'));
    if(d.zero)          partes.push(T('avisoCero',{N:d.zero}));
    if(d.skipped)       partes.push(T('avisoYa',{N:d.skipped}));
    if(d.undeliverable) partes.push(T('avisoMuerto',{N:d.undeliverable}));
    if(d.failed)        partes.push(T('avisoFallo',{N:d.failed}));

    AVISO={texto:partes.join(' '), mal:!!(d.failed||d.undeliverable)};

    /* Volver a pedir el reporte: los estados acaban de cambiar en la
       base y la página tiene que enseñar ésos, no los de hace un
       minuto. Si la recarga fallara, el mensaje se pinta igual —el
       envío ya pasó y eso es lo que hay que contar. */
    return rpc('juego_reporte_cobro',{p_code:CODE,p_game:RETO})
      .then(function(r){ if(r&&r.ok) REP=r; pintar(); })
      .catch(function(){ pintar() });
  }).catch(function(e){
    AVISO={texto:(e&&e.message==='code')?T('avisoErrCodigo'):T('avisoErrServidor'), mal:true};
    pintar();
  });
}

function volver(){
  REP=null; RETO=null; AVISO=null;
  $('out').classList.add('hide');
  $('out').innerHTML='';
  $('gate').classList.remove('hide');
  $('gm').textContent='';
}

/* El CSV se arma aquí, en el navegador: no hace falta un servidor
   para pegar comas, y así la lista no sale de la máquina del
   entrenador para volver convertida. */
function bajarCSV(){
  var r=REP; if(!r) return;
  function q(v){ return '"'+String(v==null?'':v).split('"').join('""')+'"' }

  /* La columna de estado va también en la hoja. Es donde el
     entrenador va a trabajar de verdad —ordenar, filtrar, tachar— y
     sin ella tendría que volver a la pantalla para saber a quién no
     se le pudo avisar. */
  var filas=[[T('thPadrino'),T('thCorreo'),T('thTarifa'),T('thTope'),
              T('thPuntos'),T('thTotal'),T('thEstado')].map(q).join(',')];
  (r.pledges||[]).forEach(function(p){
    var est = p.no_entregable ? T('eMuerto')
            : p.bajo_minimo   ? T('eBajo')
            : p.corregido     ? T('eCorregido',{V:money(p.dijimos)})
            : !p.avisado      ? T('eSinAvisar')
            : T('eAvisado');
    filas.push([p.padrino,p.correo,
                Number(p.tarifa||0).toFixed(2),
                p.tope!=null?Number(p.tope).toFixed(2):'',
                p.puntos||0,
                Number(p.total||0).toFixed(2),
                est].map(q).join(','));
  });
  filas.push('');
  filas.push([T('totalFila'),'','','','',
              Number((r.resumen&&r.resumen.prometido)||0).toFixed(2),''].map(q).join(','));

  /* El nombre del fichero sin acentos ni eñes: "Canóvanas" salía
     "canvanas" en algunos sistemas, porque la tilde se cae y se lleva
     la letra. Se descomponen y se tiran las marcas. */
  var nom=(r.juego||r.campana||'reporte')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').toLowerCase();

  /* El BOM va delante a propósito: sin él Excel abre un CSV en UTF-8
     y enseña "CanÃ³vanas". */
  var blob=new Blob(['﻿'+filas.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cadapunto-'+(nom||'reporte')+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() },0);
}

$('code').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); seguir() }
});

estatico();
</script>

<script>
/* ══ El menú de la barra ════════════════════════════════════════════
   Vive aparte del sistema de idioma de cada página a propósito: son
   doce páginas con cuatro formas distintas de pintar sus textos, y
   engancharse a cada una sería cuatro maneras de romperse. Esto lee
   el idioma de donde lo deja todo el mundo —localStorage— y pinta
   sus seis enlaces y nada más. */
(function(){
var ROTULOS = {
  en: { inicio:'Home', como:'How it works', precio:'What it costs',
        ayuda:'Questions', mia:'My program', alta:'Sign up a program',
        menu:'Menu', otro:'Español', aOtro:'Cambiar a español' },
  es: { inicio:'Inicio', como:'Cómo funciona', precio:'Cuánto cuesta',
        ayuda:'Preguntas', mia:'Mi programa', alta:'Registra un programa',
        menu:'Menú', otro:'English', aOtro:'Switch to English' }
};
function idioma(){
  try{
    return localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
           localStorage.getItem('fc-lang') ||
           ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en');
  }catch(e){ return 'es' }
}
var b = document.getElementById('hamb'),
    m = document.getElementById('menu'),
    l = document.getElementById('langBtn') || document.getElementById('lang');
if (!b || !m) return;

function pintar(){
  var t = ROTULOS[idioma()] || ROTULOS.es;
  m.querySelectorAll('[data-m]').forEach(function(a){
    a.textContent = t[a.getAttribute('data-m')] || a.textContent;
  });
  b.setAttribute('aria-label', t.menu);
  /* El botón del idioma lo pinta la propia página, cada una a su
     manera. Aquí sólo se corrige si se quedó con las dos letras
     viejas, para que ninguna página diga «EN» mientras las demás
     dicen «English». */
  if (l && /^(EN|ES)$/.test((l.textContent||'').trim())) {
    l.textContent = t.otro;
    l.setAttribute('aria-label', t.aOtro);
  }
}
function pon(abierto){
  m.classList.toggle('abierto', abierto);
  b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
}
b.addEventListener('click', function(){
  pon(b.getAttribute('aria-expanded') !== 'true');
});
m.addEventListener('click', function(e){ if (e.target.closest('a')) pon(false) });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') {
    pon(false); b.focus();
  }
});
/* Al pulsar el idioma, la página repinta lo suyo; el menú repinta
   lo suyo detrás, con un turno de espera para que el valor nuevo ya
   esté guardado cuando se lea. */
if (l) l.addEventListener('click', function(){ setTimeout(pintar, 0) });
pintar();
})();
</script>
</body>
</html>
