<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El enlace del juego — Cada Punto Cuenta</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cada Punto Cuenta">
<meta property="og:title" content="El enlace del juego — Cada Punto Cuenta">
<meta property="og:image" content="https://cadapunto.com/compartir.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- ══════════════════════════════════════════════════════════════
     ESTA PÁGINA ERA «MI ENLACE».

     Del producto por alumno: cada jugador tenía su propio enlace y
     sus padrinos prometían por SUS puntos. Eso se retiró: ahora se
     promete por los puntos del EQUIPO en un juego, y el enlace del
     juego es el mismo para todas las familias.

     No se borra porque dos páginas siguen apuntando aquí —padrinos
     y el tablero del entrenador— y un enlace roto no le explica
     nada a nadie. Lo que había debajo eran casi ochocientas líneas
     de un flujo que ya no existe. Esto dice la verdad en diez
     segundos y manda a la persona a donde sí hay algo que hacer.
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --navy:#101c2a; --orange:#ff7a18; --cream:#faf8f4;
  --ink:#1b2937; --muted:#617083; --linea:#e7e6e2;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{width:min(620px,calc(100% - 40px));margin:0 auto}
header{background:var(--navy);color:#fff;padding:16px 0}
.mark{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:.06em;font-size:.95rem}
.mark span{color:var(--orange)}
main{padding:44px 0 70px}
.kick{color:var(--orange);font-size:.72rem;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(1.5rem,5vw,2rem);letter-spacing:-.03em;margin:0 0 14px;font-weight:900}
p{margin:0 0 16px;max-width:52ch}
.sub{color:var(--muted)}
.caja{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:22px 24px;margin:26px 0;box-shadow:0 8px 25px #17243808}
.caja h2{font-size:1rem;font-weight:800;margin:0 0 8px}
.caja p{font-size:.95rem;margin:0 0 10px}
.btn{display:inline-block;background:var(--orange);color:#111a24;font-weight:800;
  border-radius:11px;padding:13px 22px;text-decoration:none;margin:4px 8px 4px 0}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--linea)}
footer{background:var(--navy);color:#9fb0c2;padding:20px 0;font-size:.85rem}
footer a{color:#cfdae6}
.lang{float:right;background:transparent;color:#fff;border:1px solid #ffffff44;
  border-radius:8px;padding:5px 11px;font:inherit;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>

<header><div class="wrap">
  <button class="lang" id="lang">English</button>
  <span class="mark">CADA PUNTO CUENTA<span>.</span></span>
</div></header>

<main><div class="wrap">
  <p class="kick" id="kick"></p>
  <h1 id="h1"></h1>
  <p class="sub" id="p1"></p>

  <div class="caja">
    <h2 id="h2a"></h2>
    <p id="p2"></p>
    <a class="btn" href="index.html" id="bInicio"></a>
  </div>

  <div class="caja">
    <h2 id="h2b"></h2>
    <p id="p3"></p>
    <a class="btn line" href="mi-equipo.html" id="bEquipo"></a>
    <a class="btn line" href="equipo.html" id="bAlta"></a>
  </div>
</div></main>

<footer><div class="wrap">
  <a href="index.html">Cada Punto Cuenta</a> ·
  <a href="ayuda.html" id="fAyuda">Ayuda</a> ·
  <a href="custodia.html" id="fDinero">Dinero</a>
</div></footer>

<script>
var S = {
 es:{
  kick:'Esta página cambió',
  h1:'Ahora se promete por juego, no por jugador',
  p1:'Antes cada jugador tenía su propio enlace y sus padrinos prometían por sus puntos. Eso se retiró. Hoy se promete por los puntos que anota el EQUIPO en un juego, y el enlace de ese juego es el mismo para todas las familias.',
  h2a:'¿Vas a prometer?',
  p2:'Pídele al entrenador el enlace del próximo juego. Es un enlace por juego: lo abres, escoges cuántos centavos por punto, y ya está. No hace falta cuenta ni se cobra nada ahí.',
  bInicio:'Cómo funciona',
  h2b:'¿Eres el entrenador?',
  p3:'Tus juegos y sus enlaces están en tu página. Si tu programa todavía no está dado de alta, se hace en un minuto.',
  bEquipo:'Mis juegos',
  bAlta:'Inscribir mi programa',
  lang:'English', fAyuda:'Ayuda', fDinero:'Dinero'
 },
 en:{
  kick:'This page has changed',
  h1:'Pledging is by the game now, not by the player',
  p1:'Each player used to have their own link and their padrinos pledged on that player’s points. That is retired. Today you pledge on the points the TEAM scores in a game, and that game’s link is the same one for every family.',
  h2a:'Here to pledge?',
  p2:'Ask the coach for the next game’s link. It is one link per game: open it, pick how many cents a point, and that is it. No account, and nothing is charged there.',
  bInicio:'How it works',
  h2b:'Are you the coach?',
  p3:'Your games and their links are on your own page. If your program is not signed up yet, it takes a minute.',
  bEquipo:'My games',
  bAlta:'Sign up my program',
  lang:'Español', fAyuda:'Help', fDinero:'The money'
 }
};

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
            localStorage.getItem('fc-lang') ||
            ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function pintar(){
  var T = S[LANG] || S.es;
  document.documentElement.lang = LANG;
  ['kick','h1','p1','h2a','p2','bInicio','h2b','p3','bEquipo','bAlta',
   'fAyuda','fDinero'].forEach(function(k){
    var e = document.getElementById(k);
    if (e) e.textContent = T[k];
  });
  document.getElementById('lang').textContent = T.lang;
}

document.getElementById('lang').onclick = function(){
  LANG = LANG === 'es' ? 'en' : 'es';
  try{ localStorage.setItem('cfh_lang',LANG); localStorage.setItem('cp-lang',LANG);
       localStorage.setItem('fc-lang',LANG); }catch(e){}
  pintar();
};

pintar();
</script>
</body>
</html>
