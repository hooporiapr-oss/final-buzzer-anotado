/* ── El look nuevo: crema, navy y naranja ─────────────────────────
   El mismo del resto del sitio. Antes esta pagina llevaba tres hojas
   de estilo apiladas una encima de otra; ahora es una sola. El
   marcado y el guion no se tocaron.

   Se imprime: un entrenador la cuelga en la pared del gimnasio, asi
   que al final hay reglas de @media print. */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{width:min(720px,calc(100% - 40px));margin:0 auto}

header{flex:0 0 auto;background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
@media(max-width:380px){ .mark{font-size:.92rem} }
.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.langb:hover{border-color:var(--orange);color:var(--orange)}

main{flex:1 1 auto;overflow-x:hidden}
main .wrap{padding:40px 0 50px}

/* ── La portada del documento ─────────────────────────────────── */
.rtop{border-bottom:3px solid var(--navy);padding-bottom:20px;margin:0 0 28px}
.kick{color:var(--orange);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  font-size:.74rem;margin:0 0 10px}
.rtop h1{font-size:clamp(1.9rem,5.4vw,2.9rem);line-height:1.08;letter-spacing:-.045em;margin:0 0 8px}
.rtop .sub{color:var(--muted);margin:0;font-size:.92rem}
.lede{color:var(--muted);margin:0 0 30px;max-width:58ch;font-size:1.06rem}

/* ── El por qué: la caja que explica el modelo entero ─────────── */
.porque{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--orange);
  border-radius:16px;padding:26px 28px;margin:0 0 34px;box-shadow:0 8px 25px #17243808}
.porque h2{margin:0 0 14px;font-size:1.22rem;font-weight:900;letter-spacing:-.025em}
.porque p{margin:0 0 13px;color:var(--muted);font-size:1rem}
.porque p:last-child{margin-bottom:0}
.porque .golpe{color:var(--ink);font-size:1.16rem;font-weight:800;letter-spacing:-.02em}
.porque .cierre{margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}

/* ── Las cláusulas, numeradas para poder citarlas ─────────────── */
.sec{margin:0 0 30px}
.sec h2{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;
  font-size:1.16rem;letter-spacing:-.025em}
.sec h2 .n{flex:0 0 auto;color:var(--orange);font-weight:900}
.sec .cab{color:var(--muted);margin:0 0 12px;font-size:.95rem}
.sec ol,.sec ul{margin:0;padding:0;list-style:none;background:#fff;
  border:1px solid var(--linea);border-radius:14px;box-shadow:0 8px 25px #17243806}
.sec li{position:relative;padding:14px 20px 14px 58px;border-top:1px solid var(--linea);
  font-size:.97rem;color:var(--muted)}
.sec li:first-child{border-top:none}
.sec li::before{content:attr(data-n);position:absolute;left:20px;top:14px;
  font-weight:800;font-size:.8rem;color:var(--navy);font-variant-numeric:tabular-nums}
.sec .cierre{margin:12px 0 0;font-size:.96rem;font-weight:750}

/* ── Lo que acepta el programa ────────────────────────────────── */
.ackbox{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--navy);
  border-radius:16px;padding:22px 24px;margin:36px 0 0;box-shadow:0 8px 25px #17243808}
.ackbox h2{margin:0 0 8px;font-size:1.1rem;letter-spacing:-.02em}
.ackbox p{margin:0;color:var(--muted);font-size:.96rem}
.ackbox a{color:var(--navy);font-weight:800;text-decoration:none;
  display:inline-block;margin:14px 20px 0 0;font-size:.92rem;
  border-bottom:2px solid var(--orange);padding-bottom:2px}
.ackbox a:hover{color:var(--orange)}

/* ── El pie del documento ─────────────────────────────────────── */
.pie{display:flex;gap:11px;flex-wrap:wrap;margin-top:32px}
.pie a,.pie button{flex:1 1 180px;padding:14px 18px;border-radius:9px;
  border:1px solid var(--navy);background:transparent;color:var(--navy);
  font:inherit;font-weight:800;font-size:.95rem;text-align:center;
  text-decoration:none;cursor:pointer}
.pie a:hover,.pie button:hover{background:var(--navy);color:#fff}
.pie a.solid{background:var(--navy);color:#fff}

footer{flex:0 0 auto;background:#0a1420;color:#aeb9c6;
  padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
.f-co{color:#fff;font-weight:700;margin:0 0 7px}
.f-what{margin:7px auto 0;font-size:.78rem;line-height:1.5;opacity:.75;max-width:54ch}
.f-legal{margin:9px 0 0;font-size:.82rem}
.f-dot{padding:0 8px;opacity:.45}

/* ── Impresa ──────────────────────────────────────────────────────
   La hoja pegada en la pared tiene que decir de donde salio: alguien
   le saca una foto, y sin la direccion esa foto no lleva a ningun
   sitio. */
.pie-print{display:none}
@media print{
  header,footer,.pie,.langb{display:none !important}
  html,body{background:#fff;color:#000}
  main .wrap{width:100%;padding:0}
  .porque,.sec ol,.sec ul,.ackbox{box-shadow:none;background:#fff}
  .porque,.ackbox{border-color:#000}
  .sec{break-inside:avoid;page-break-inside:avoid}
  .porque{break-inside:avoid}
  .rtop{border-bottom:2px solid #000}
  .porque p,.sec li,.ackbox p,.lede{color:#000}
  a{text-decoration:none;color:#000}
  .pie-print{display:block;margin-top:24px;padding-top:12px;
    border-top:2px solid #000;font-size:.86rem;font-weight:700;
    text-align:center;break-inside:avoid}
  .pie-print span{display:block;font-weight:400;font-size:.8rem;margin-top:3px}
}

/* ══ La barra, el menú y el idioma ══════════════════════════════════
   Puesto al final de la hoja a propósito: lo que haya escrito arriba
   sobre header, .bar o .langb queda debajo de esto.

   --barra tiene que ser la MISMA altura en los dos sitios donde se
   usa: el hueco que deja scroll-padding para que un ancla no quede
   detrás de la cabecera, y el punto donde arranca el panel. */
:root{--barra:66px}
html{scroll-padding-top:calc(var(--barra) + 10px)}
/* overflow-x en el body y no sólo en html: en Safari de iOS, html
   solo no lo sujeta y basta un elemento ancho para arrastrar la
   página de lado. */
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:100;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{min-height:var(--barra);padding:0;gap:10px}
/* El botón del idioma dice el idioma AL QUE lleva, no el que está
   puesto. Por eso necesita sitio para una palabra y no para dos
   letras, y nowrap para que «Español» no se parta en dos líneas. */
.langb,#lang{white-space:nowrap;min-height:40px;font-size:.85rem;
  padding:0 12px;border-radius:9px;font-family:inherit}
.barra-dcha{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Las rayas se pintan con currentColor, no con blanco: prometer.html
   tiene la barra en crema con la marca en navy, y unas rayas
   blancas ahí no se ven. Heredando el color de la barra valen para
   las dos, y para la próxima página que cambie de fondo. Lo
   encontró una captura, no la prueba: la prueba miraba que el botón
   estuviera, no que se viera. */
/* El color de las rayas sale de la barra, y la barra de estas
   páginas no declaraba ninguno: heredaban la tinta del cuerpo
   —navy sobre navy— y el botón se veía con 1.2:1 de contraste,
   que es no verse. Barra navy, tinta blanca. */
header{color:#fff}
.hamb{display:none;width:44px;height:44px;flex:0 0 44px;color:inherit;
  border:1px solid currentColor;background:transparent;border-radius:9px;
  cursor:pointer;padding:0;align-items:center;justify-content:center}
@supports (border-color: color-mix(in srgb, currentColor 45%, transparent)){
  .hamb{border-color: color-mix(in srgb, currentColor 45%, transparent)}
}
.hamb:hover{border-color:var(--orange);color:var(--orange)}
/* color:inherit en la propia raya y no sólo en el botón: privacy
   y terms traen un `strong,b{color:var(--ink)}` para el texto, y
   currentColor dentro de un <b> resuelve al color DEL <b>, no al
   del padre. Las rayas salían navy sobre navy. */
.hamb b{display:block;width:20px;height:2px;color:inherit;
  background:currentColor;border-radius:2px;
  position:relative;transition:background .18s ease}
.hamb b::before,.hamb b::after{content:'';position:absolute;left:0;
  width:20px;height:2px;background:currentColor;border-radius:2px;transition:transform .18s ease}
.hamb b::before{top:-6px}
.hamb b::after{top:6px}
.hamb[aria-expanded="true"] b{background:transparent}
.hamb[aria-expanded="true"] b::before{transform:translateY(6px) rotate(45deg)}
.hamb[aria-expanded="true"] b::after{transform:translateY(-6px) rotate(-45deg)}

.menu{position:absolute;left:0;right:0;top:100%;
  display:flex;flex-direction:column;align-items:stretch;
  background:var(--navy);border-bottom:1px solid #ffffff22;
  /* Cerrado con max-height para que tenga transición, y con
     visibility para que el teclado no se meta dentro: max-height
     sola deja los enlaces tabulables en un panel invisible. */
  max-height:0;visibility:hidden;overflow:hidden;
  transition:max-height .22s ease,visibility .22s}
.menu.abierto{max-height:80vh;visibility:visible;overflow:auto}
.menu a{display:flex;align-items:center;min-height:52px;
  padding:0 max(20px,calc((100vw - 900px)/2 + 20px));
  color:#fff;text-decoration:none;font-weight:600;font-size:1rem;
  border-top:1px solid #ffffff14}
.menu a:first-child{border-top:0}
.menu a:hover{color:var(--orange)}
.menu a.cta{margin:14px 20px 18px;justify-content:center;border-top:0;
  background:var(--orange);color:#111a24;font-weight:800;border-radius:9px}
.menu a.cta:hover{color:#111a24}
/* Las rayas se ven siempre: estas páginas no tienen enlaces en la
   barra en ningún tamaño, así que el menú es la única puerta y
   esconderlo en escritorio dejaría la página sin salida otra vez. */
.hamb{display:flex}
@media(max-width:430px){
:root{--barra:60px}
.langb,#lang{padding:0 10px;font-size:.8rem}
}

he padrino’s name, the cents per point, and the cap if one was set.", "When the game records a player’s points, works out what each of his pledges comes to, his total, and the team’s total pledged.", "Shows that total and lets it be printed or downloaded, for the program to work with as it likes."], "s3h": "What we do not do", "s3c": "Said plainly, so nobody is confused.", "s3": ["We do not process payments and we do not bill anyone.", "We do not verify payments. We do not know who paid, and the system has nowhere to record it.", "We keep no receivables and we chase no padrino. When the event closes we send each padrino a notice with the points and what their pledge came to — a notice, and nothing more: no payment link and no reminders.", "We handle no payment disputes, no chargebacks, and no refunds."], "s4h": "If there is a disagreement", "s4c": "A pledge is between the padrino and the program.", "s4": ["If a padrino says he did not pledge, or pledged something else, that is settled between him and the program. We show what was recorded, and that is as far as it goes.", "If the program does not receive a payment, there is nothing for us to withhold, deduct or claim: we never had that money.", "We are not a party to any payment arrangement and we do not guarantee that a pledge will be paid."], "s5h": "What the program can see", "s5c": "What was pledged, up to date. Nothing we do not know.", "s5": ["The panel shows every pledge, its amount, each player’s total and the team’s total.", "The score is recorded by the game. Each player’s points are written as he plays, and the run key is checked inside the database: holding the public link is not enough to end somebody else’s run. Nobody enters a score by hand.", "The list prints and downloads at any time. It belongs to the program.", "There is no paid column, no outstanding column, no collected column. The system does not know."], "s6h": "Taxes", "s6c": "Each program is responsible for its own tax position.", "s6": ["We make no representation about how a pledge or a payment is treated for tax purposes.", "We do not issue tax receipts and we do not say a pledge is deductible.", "What a program tells its padrinos about taxes is the program’s own, and the program answers for it."], "s7h": "The license and the data", "s7c": "The platform is licensed. The pledge list belongs to the program.", "s7": ["The platform is licensed per event: a fixed fee set by the size of the roster, from $29 for the smallest squad to $599 for the largest, with anything above that agreed beforehand. The scale is published in full at hooporia.com.", "Nothing is paid up front. The fee is invoiced when the event closes and is due within seven days: the report exists first, the bill comes after.", "If an event records no pledges at all, nothing is invoiced for it. The fee is for the pledge results, and where there are none there is nothing to pay.", "The program can print or download its report at any time.", "If the fee is not paid, that event’s license lapses and its pledge data is removed from the platform. We pursue it no further."], "ackH": "What the program accepts", "ackP": "When signing a team up, the program ticks that it has read and accepts this disclosure, along with the Terms of Use and the Privacy Policy. If any of this does not work for your program, do not sign up — write to us and we will talk it through first.", "verT": "Terms of Use →", "verP": "Privacy Policy →", "print": "Print", "back": "← Hooporia", "pieP": "gostardigital@gmail.com", "pieS": "The money does not pass through us · Hooporia · Gostar Digital LLC, Puerto Rico"}};
function T(k){ return (S[LANG] && S[LANG][k]) !== undefined ? S[LANG][k] : (S.en[k]||''); }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toggleLang(){
  LANG = (LANG === 'es') ? 'en' : 'es';
  try{ localStorage.setItem('cfh_lang', LANG), localStorage.setItem('cp-lang', LANG),
       localStorage.setItem('fc-lang', LANG); }catch(e){}
  paint();
}
function reglas(n, items){
  var h = '<ol>';
  for (var i=0;i<items.length;i++) h += '<li data-n="' + n + '.' + (i+1) + '">' + esc(items[i]) + '</li>';
  return h + '</ol>';
}
function seccion(n){
  return '<section class="sec">' +
    '<h2><span class="n">' + n + '.</span> ' + esc(T('s'+n+'h')) + '</h2>' +
    '<p class="cab">' + esc(T('s'+n+'c')) + '</p>' +
    reglas(n, T('s'+n)) + '</section>';
}
function paint(){
  document.documentElement.lang = LANG;
  document.getElementById('langBtn').textContent = (LANG === 'es') ? 'English' : 'Español';
  document.title = (LANG === 'es') ? 'El dinero no pasa por nosotros \u2014 Hooporia'
                                   : 'The money does not pass through us \u2014 Hooporia';
  var out =
    '<div class="rtop">' +
      '<p class="kick">' + esc(T('kick')) + '</p>' +
      '<h1>' + esc(T('h1')) + '</h1>' +
      '<p class="sub">' + esc(T('sub')) + '</p>' +
    '</div>' +
    '<p class="lede">' + esc(T('lede')) + '</p>' +
    /* El por que, antes del como. Las siete clausulas de abajo dicen
       lo que hacemos y lo que no; esto dice por que el dinero lo
       maneja el programa y no nosotros, que es la primera pregunta
       que hace cualquiera al oir "manejo de promesas". Sin esta
       parte, la pagina niega una custodia sin explicar el modelo. */
    '<div class="porque">' +
      '<h2>' + esc(T('porqueH')) + '</h2>' +
      '<p class="golpe">' + esc(T('porque1')) + '</p>' +
      '<p>' + esc(T('porque2')) + '</p>' +
      '<p>' + esc(T('porque3')) + '</p>' +
      '<p>' + esc(T('porque4')) + '</p>' +
      '<p>' + esc(T('porque5')) + '</p>' +
      '<p class="golpe cierre">' + esc(T('porqueCierre')) + '</p>' +
    '</div>';
  for (var n=1; n<=7; n++) out += seccion(n);
  out +=
    '<div class="ackbox">' +
      '<h2>' + esc(T('ackH')) + '</h2>' +
      '<p>' + esc(T('ackP')) + '</p>' +
      '<a href="terms.html">' + esc(T('verT')) + '</a>' +
      '<a href="privacy.html">' + esc(T('verP')) + '</a>' +
    '</div>' +
    '<div class="pie">' +
      '<button type="button" onclick="window.print()">' + esc(T('print')) + '</button>' +
      '<a href="index.html">' + esc(T('back')) + '</a>' +
    '</div>' +
    '<p class="pie-print">' + esc(T('pieP')) + '<span>' + esc(T('pieS')) + '</span></p>';
  document.getElementById('app').innerHTML = out;
}
paint();
</script>

<script>
/* ══ El menú de la barra ════════════════════════════════════════════
   Vive aparte del sistema de idioma de cada página a propósito: son
   doce páginas con cuatro formas distintas de pintar sus textos, y
   engancharse a cada una sería cuatro maneras de romperse. Esto lee
   el idioma de donde lo deja todo el mundo —localStorage— y pinta
   sus seis enlaces y nada más. */
(function(){
var ROTULOS = {
  en: { inicio:'Home', como:'How it works', precio:'What it costs',
        ayuda:'Questions', mia:'My team', alta:'Sign up a team',
        menu:'Menu', otro:'Español', aOtro:'Cambiar a español' },
  es: { inicio:'Inicio', como:'Cómo funciona', precio:'Cuánto cuesta',
        ayuda:'Preguntas', mia:'Mi equipo', alta:'Registra un equipo',
        menu:'Menú', otro:'English', aOtro:'Switch to English' }
};
function idioma(){
  try{
    return localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
           localStorage.getItem('fc-lang') ||
           ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en');
  }catch(e){ return 'es' }
}
var b = document.getElementById('hamb'),
    m = document.getElementById('menu'),
    l = document.getElementById('langBtn') || document.getElementById('lang');
if (!b || !m) return;

function pintar(){
  var t = ROTULOS[idioma()] || ROTULOS.es;
  m.querySelectorAll('[data-m]').forEach(function(a){
    a.textContent = t[a.getAttribute('data-m')] || a.textContent;
  });
  b.setAttribute('aria-label', t.menu);
  /* El botón del idioma lo pinta la propia página, cada una a su
     manera. Aquí sólo se corrige si se quedó con las dos letras
     viejas, para que ninguna página diga «EN» mientras las demás
     dicen «English». */
  if (l && /^(EN|ES)$/.test((l.textContent||'').trim())) {
    l.textContent = t.otro;
    l.setAttribute('aria-label', t.aOtro);
  }
}
function pon(abierto){
  m.classList.toggle('abierto', abierto);
  b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
}
b.addEventListener('click', function(){
  pon(b.getAttribute('aria-expanded') !== 'true');
});
m.addEventListener('click', function(e){ if (e.target.closest('a')) pon(false) });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') {
    pon(false); b.focus();
  }
});
/* Al pulsar el idioma, la página repinta lo suyo; el menú repinta
   lo suyo detrás, con un turno de espera para que el valor nuevo ya
   esté guardado cuando se lea. */
if (l) l.addEventListener('click', function(){ setTimeout(pintar, 0) });
pintar();
})();
</script>
