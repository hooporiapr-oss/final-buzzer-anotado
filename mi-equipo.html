<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin — Cada Punto Cuenta</title>
<meta name="robots" content="noindex,nofollow">

<!-- El icono y la imagen de compartir. og:image va en absoluto
     a propósito: WhatsApp y los demás no resuelven rutas
     relativas, y con una relativa la vista previa sale en
     blanco igual que sin imagen. -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cada Punto Cuenta">
<meta property="og:image" content="https://cadapunto.com/compartir.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Un nene en una cancha al atardecer, con el brazo en alto, y su puntuación subiendo: 1, 3, 6, 10, 15, 21">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ── El look nuevo: crema, navy y naranja ─────────────────────────
   El mismo de la portada. Antes esta pagina era la cancha de noche;
   lo que cambia es la piel, no lo que hace: el marcado y el guion se
   quedaron como estaban. */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(720px,calc(100% - 40px));margin:0 auto}
/* Dos campos por línea cuando caben. En el teléfono, uno debajo de
   otro: un entrenador apunta esto de pie al lado de la cancha. */
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fila2 input{width:100%}
/* Los campos de «Añadir un juego» y las casillas del marcador, con el
   mismo vestido que el campo del código. Sin esto salían pelados: el
   estilo de arriba sólo alcanza a input[type=text], y éstos no lo
   dicen. */
.fila2 input,.fila2 select,.lin .pts{padding:12px 13px;border:1px solid #d6d9d6;border-radius:10px;
  font:inherit;font-size:1rem;background:#fff;color:inherit}
.fila2 select{width:100%}
.fila2 input:focus,.fila2 select:focus,.lin .pts:focus{outline:none;border-color:var(--orange)}
/* La línea del enlace y la del marcador. El enlace se lleva el
   espacio que sobre: es lo que hay que poder leer entero antes de
   mandarlo. */
.lin{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lin input[readonly]{flex:1 1 200px;min-width:0;font-size:.8rem}
.lin .pts{width:92px;flex:0 0 auto}
.btn.mini{padding:8px 14px;font-size:.84rem;margin:0;display:inline-block;width:auto}
.btn.mini.line{background:transparent;color:var(--ink);border:1px solid var(--linea)}
@media(max-width:540px){ .fila2{grid-template-columns:1fr} }

/* ── Cabecera ─────────────────────────────────────────────────── */
header{background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
/* La marca pasó de una palabra a tres el 22 de octubre de 2026, y
   en la barra de 320px ya no cabía: con la hamburguesa y el botón
   de acción al lado pedía 339px de los 320 que hay.

   Se arregla por el ESPACIADO antes que por el tamaño. Dieciocho
   letras a .07em son casi veinte píxeles de aire, que es justo lo
   que sobraba; quitando casi todo ese aire la marca cabe sin tener
   que encogerla hasta que no se lea. El tamaño baja un poco también,
   pero poco. */
@media(max-width:380px){ .mark{font-size:.92rem} }
@media(max-width:430px){ .mark{font-size:.84rem;letter-spacing:.015em} }
.hright{display:flex;align-items:center;gap:9px}
/* At 320px the bar ran 5px past the edge. Tighter gaps, and the
   mark may shrink instead of pushing the buttons out. */
@media(max-width:360px){ header .bar{gap:8px} .hright{gap:6px} .mark{min-width:0;overflow:hidden;text-overflow:ellipsis} }
.who{color:#c8d2dd;font-size:.8rem;font-weight:600;max-width:11ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out,.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.out:hover,.langb:hover{border-color:var(--orange);color:var(--orange)}

/* ── Cuerpo ───────────────────────────────────────────────────── */
main .wrap{padding:38px 0 44px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.04em;margin:0 0 12px}
h2{font-size:1.3rem;letter-spacing:-.025em;margin:34px 0 14px}
.lede{color:var(--muted);margin:0 0 24px;max-width:52ch}
.help{color:var(--muted);font-size:.86rem;margin:7px 0 0}
.hide{display:none !important}

/* ── La puerta: tarjeta blanca, como todo lo demas ─────────────── */
.gate{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:clamp(22px,5vw,32px);box-shadow:0 8px 25px #17243808}
label{display:block;font-weight:700;font-size:.9rem;margin:18px 0 6px}
input[type=text]{width:100%;padding:14px 15px;border:1px solid #d6d9d6;border-radius:10px;
  background:#fff;color:var(--ink);font:inherit;font-size:1.05rem;letter-spacing:.04em}
input[type=text]:focus{outline:none;border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,122,24,.18)}
.btn{display:inline-block;border:0;border-radius:9px;padding:14px 22px;
  background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;text-decoration:none;text-align:center}
.btn.go{background:var(--orange);color:#111a24;width:100%;margin-top:20px}
/* A remembered team is offered, never opened on its own: one phone can
   serve two teams, and the code typed always wins. */
.seguir{display:block;width:100%;margin:6px 0 18px;padding:14px;border-radius:9px;border:2px solid var(--navy,#101c2a);
  background:#fff;color:var(--navy,#101c2a);font:inherit;font-weight:800;cursor:pointer}
.seguir[hidden]{display:none}
.tusEq{font-weight:800;font-size:.85rem;color:var(--muted,#5a6b7c);margin:10px 0 6px}
.tusEq[hidden]{display:none}
.mTop{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.mTop .depChip{margin:0}
.cambiar{margin-left:auto;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1.5px solid var(--navy,#101c2a);background:#fff;
  color:var(--navy,#101c2a);font:inherit;font-weight:800;font-size:.78rem;cursor:pointer}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:13px 0 0;font-weight:700;font-size:.9rem;min-height:1.2em}
.msg.bad{color:var(--bad)}

/* ── Lo que falta por hacer. Es lo unico de la pagina que cuesta
   dinero si se olvida, asi que es la unica caja naranja. ───────── */
.todo{background:#fff;border:1px solid rgba(255,122,24,.45);border-left:5px solid var(--orange);
  border-radius:16px;padding:22px 24px;margin:0 0 10px;box-shadow:0 8px 25px #17243808}
.todo b{display:block;color:var(--orange);font-size:.72rem;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase}
.todo .big{font-size:1.45rem;font-weight:900;letter-spacing:-.03em;margin:7px 0 4px}
.todo p{color:var(--muted);margin:0;font-size:.95rem}
.todo .btn{width:auto;margin-top:16px}

/* ── Las tarjetas de equipo ───────────────────────────────────── */
.team{background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:22px 24px;margin:0 0 14px;box-shadow:0 8px 25px #17243808}
.team .st{color:var(--muted);font-size:.84rem;margin:2px 0 10px}
/* La fecha y las promesas van DEBAJO del rival, no pegadas a él:
   en línea salía «vs Arecibo2026-11-07». */
.team small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px}
.team > div:first-child b{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.team .nm{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin:0 0 18px}
.nums.uno{grid-template-columns:max-content}
.num{background:var(--cream);border:1px solid var(--linea);border-radius:11px;
  padding:12px 16px;text-align:center}
.num b{display:block;font-size:1.5rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.num span{display:block;color:var(--muted);font-size:.74rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.num.hot b{color:var(--orange)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts a{flex:1 1 150px;text-decoration:none;text-align:center;font-weight:800;font-size:.95rem;
  padding:13px 16px;border-radius:9px;border:1px solid var(--navy);color:var(--navy)}
.acts a:hover{background:var(--navy);color:#fff}
.acts a.fill{background:var(--navy);color:#fff}
.acts a.fill:hover{background:var(--navy2);border-color:var(--navy2)}
.acts a.wide{background:transparent}

.stuck{color:var(--muted);font-size:.88rem;margin:30px 0 0;text-align:center}
.stuck a{color:var(--navy);font-weight:700}

/* ── Pie ──────────────────────────────────────────────────────── */
footer{background:#0a1420;color:#aeb9c6;padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
.f-dot{padding:0 8px;opacity:.45}

/* ══ La barra, el menú y el idioma ══════════════════════════════════
   Puesto al final de la hoja a propósito: lo que haya escrito arriba
   sobre header, .bar o .langb queda debajo de esto.

   --barra tiene que ser la MISMA altura en los dos sitios donde se
   usa: el hueco que deja scroll-padding para que un ancla no quede
   detrás de la cabecera, y el punto donde arranca el panel. */
:root{--barra:66px}
html{scroll-padding-top:calc(var(--barra) + 10px)}
/* overflow-x en el body y no sólo en html: en Safari de iOS, html
   solo no lo sujeta y basta un elemento ancho para arrastrar la
   página de lado. */
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:100;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{min-height:var(--barra);padding:0;gap:10px}
/* El botón del idioma dice el idioma AL QUE lleva, no el que está
   puesto. Por eso necesita sitio para una palabra y no para dos
   letras, y nowrap para que «Español» no se parta en dos líneas. */
.langb,#lang{white-space:nowrap;min-height:40px;font-size:.85rem;
  padding:0 12px;border-radius:9px;font-family:inherit}
.barra-dcha{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Las rayas se pintan con currentColor, no con blanco: prometer.html
   tiene la barra en crema con la marca en navy, y unas rayas
   blancas ahí no se ven. Heredando el color de la barra valen para
   las dos, y para la próxima página que cambie de fondo. Lo
   encontró una captura, no la prueba: la prueba miraba que el botón
   estuviera, no que se viera. */
/* El color de las rayas sale de la barra, y la barra de estas
   páginas no declaraba ninguno: heredaban la tinta del cuerpo
   —navy sobre navy— y el botón se veía con 1.2:1 de contraste,
   que es no verse. Barra navy, tinta blanca. */
header{color:#fff}
.hamb{display:none;width:44px;height:44px;flex:0 0 44px;color:inherit;
  border:1px solid currentColor;background:transparent;border-radius:9px;
  cursor:pointer;padding:0;align-items:center;justify-content:center}
@supports (border-color: color-mix(in srgb, currentColor 45%, transparent)){
  .hamb{border-color: color-mix(in srgb, currentColor 45%, transparent)}
}
.hamb:hover{border-color:var(--orange);color:var(--orange)}
/* color:inherit en la propia raya y no sólo en el botón: privacy
   y terms traen un `strong,b{color:var(--ink)}` para el texto, y
   currentColor dentro de un <b> resuelve al color DEL <b>, no al
   del padre. Las rayas salían navy sobre navy. */
.hamb b{display:block;width:20px;height:2px;color:inherit;
  background:currentColor;border-radius:2px;
  position:relative;transition:background .18s ease}
.hamb b::before,.hamb b::after{content:'';position:absolute;left:0;
  width:20px;height:2px;background:currentColor;border-radius:2px;transition:transform .18s ease}
.hamb b::before{top:-6px}
.hamb b::after{top:6px}
.hamb[aria-expanded="true"] b{background:transparent}
.hamb[aria-expanded="true"] b::before{transform:translateY(6px) rotate(45deg)}
.hamb[aria-expanded="true"] b::after{transform:translateY(-6px) rotate(-45deg)}

.menu{position:absolute;left:0;right:0;top:100%;
  display:flex;flex-direction:column;align-items:stretch;
  background:var(--navy);border-bottom:1px solid #ffffff22;
  /* Cerrado con max-height para que tenga transición, y con
     visibility para que el teclado no se meta dentro: max-height
     sola deja los enlaces tabulables en un panel invisible. */
  max-height:0;visibility:hidden;overflow:hidden;
  transition:max-height .22s ease,visibility .22s}
.menu.abierto{max-height:80vh;visibility:visible;overflow:auto}
.menu a{display:flex;align-items:center;min-height:52px;
  padding:0 max(20px,calc((100vw - 900px)/2 + 20px));
  color:#fff;text-decoration:none;font-weight:600;font-size:1rem;
  border-top:1px solid #ffffff14}
.menu a:first-child{border-top:0}
.menu a:hover{color:var(--orange)}
.menu a.cta{margin:14px 20px 18px;justify-content:center;border-top:0;
  background:var(--orange);color:#111a24;font-weight:800;border-radius:9px}
.menu a.cta:hover{color:#111a24}
/* Las rayas se ven siempre: estas páginas no tienen enlaces en la
   barra en ningún tamaño, así que el menú es la única puerta y
   esconderlo en escritorio dejaría la página sin salida otra vez. */
.hamb{display:flex}
@media(max-width:430px){
:root{--barra:60px}
.langb,#lang{padding:0 10px;font-size:.8rem}
/* EN EL TELÉFONO NO CABEN LAS CINCO COSAS de la barra —marca,
   programa, idioma, menú y salir— y la última se salía fuera de la
   pantalla, arrastrando la página entera hacia los lados. El nombre
   del programa se quita: ya está escrito en grande justo debajo. */
.who{display:none}
}

/* ══ ADMIN = MARCADOR ══════════════════════════════════════════════
   El aspecto de la mesa de Marcador PR, tal cual: la misma barra, la
   misma cabecera de calendario, los mismos días, las mismas filas y
   la misma caja para poner el marcador. */
:root{--m-ink:#12202E;--m-mute:#5A6B7C;--m-line:#D7E0E8;--m-tint:#F7FAFC;--m-accent:#0C6E8C;--m-ball:#FF7A18}
body{font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:var(--m-ink)}
header{background:#12202E!important;border-bottom:3px solid var(--m-ball)!important}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
.mk-m{color:#fff;line-height:1.1;font-weight:900}
.mk-m span{display:block;font-size:.58rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--m-ball)}
.mk-m b{font-size:1.05rem;font-weight:900}
.hright{display:flex;align-items:center;gap:8px}
.by{font-size:.95rem;font-weight:900;letter-spacing:-.02em;color:#fff;text-decoration:none}
@media(max-width:480px){.by{display:none}.hright{gap:6px}.mk-m b{font-size:.95rem}}
.by span{color:var(--m-ball)}
.mh1{font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:-.03em;margin:0 0 4px;font-weight:900}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 16px;color:var(--m-mute);font-size:.86rem}
.stat b{color:var(--m-ink)}
.addg{display:block;width:100%;margin:0 0 14px;padding:13px;border:2px dashed var(--m-ball);border-radius:4px;
  background:#FFF7F0;color:var(--m-ink);font:inherit;font-weight:900;font-size:.95rem;cursor:pointer}
.alta{border:1px solid var(--m-line);border-radius:4px;padding:4px 14px 14px;margin:0 0 14px;background:var(--m-tint)}
.alta.hide{display:none}
.tabs{display:flex;gap:2px;margin:6px 0 8px;overflow-x:auto;border-bottom:2px solid var(--m-line)}
.tabs:empty{display:none}
.tab{flex:0 0 auto;white-space:nowrap;border:0;background:none;cursor:pointer;font:inherit;font-size:.85rem;
  font-weight:800;color:var(--m-mute);padding:10px 14px;margin-bottom:-2px;border-bottom:3px solid transparent}
.tab.on{color:var(--m-ink);border-bottom-color:var(--m-ink)}
.publico .addg,.publico .alta,.publico #mHint,.publico #hout,.publico #quien{display:none!important}
body:not(.publico) #mCoach{display:none}
.vacio{margin:6px 0 20px;padding:18px 16px;border:1px dashed var(--m-line);border-radius:4px;text-align:center;color:var(--m-mute);font-weight:700;font-size:.92rem;background:var(--m-tint)}
.coachin{text-align:center;margin:18px 0 0;font-size:.82rem}
.coachin a{color:var(--m-mute);font-weight:700}
.pubcop{margin:0 0 12px}
/* Back to the pledge page, when the public page was opened from it. */
.depSw{display:inline-flex;border:1.5px solid var(--navy,#101c2a);border-radius:999px;overflow:hidden}
.depSw button{border:0;background:#fff;color:var(--navy,#101c2a);font:inherit;font-weight:800;font-size:.84rem;padding:8px 12px;cursor:pointer;white-space:nowrap}
.depSw button.on{background:var(--navy,#101c2a);color:#fff}
.depSw[hidden]{display:none}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.cats button{border:1.5px solid var(--line,#d9dee5);background:#fff;color:var(--navy,#101c2a);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:.8rem;cursor:pointer}
.cats button.on{border-color:var(--orange,#ff7a18);background:#fff4ea}
.jDep{font-weight:800;margin:14px 0 10px}
#jCat,#jCatNueva{width:100%;padding:12px 13px;border:1px solid #d6d9d6;border-radius:10px;font:inherit;font-size:1rem;background:#fff;color:inherit;margin:0 0 6px}
#jCat:focus,#jCatNueva:focus{outline:none;border-color:var(--orange)}
#jCatNueva[hidden]{display:none}
.depChip{display:inline-block;margin:0 0 8px;padding:4px 10px;border-radius:999px;background:#EEF2F6;color:var(--navy,#101c2a);font-weight:800;font-size:.78rem}
/* display above would otherwise beat the hidden attribute. */
.depChip[hidden],.volverP[hidden]{display:none}
.enota{flex:1 1 100%;font-size:.76rem;color:var(--muted,#5a6b7c);font-weight:600}
.volverP{display:inline-block;margin:0 0 12px;font-weight:800;font-size:.9rem;color:var(--navy,#101c2a);text-decoration:none}
.volverP:hover{color:var(--orange,#ff7a18)}
.pl.prom{background:var(--m-ball);border-color:var(--m-ball);color:#1A0C00}
.pl.prom:hover{background:#e86a0c;color:#1A0C00}
.mhint{margin:0 0 16px;color:var(--m-mute);font-size:.8rem}
.mhint:empty{display:none}
.day{margin-bottom:24px}
.day h2{font-size:1.02rem;font-weight:900;letter-spacing:-.02em;margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--m-ink)}
.day h2 span{float:right;font-size:.7rem;font-weight:800;color:var(--m-mute);letter-spacing:.1em;text-transform:uppercase;padding-top:4px}
.rows{display:grid;gap:4px}
.r{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 10px;border:1px solid var(--m-line);border-radius:4px;font-size:.88rem;cursor:pointer}
.r:hover{border-color:var(--m-ink)}
.r.p{border-color:var(--m-ball);background:rgba(255,122,24,.06)}
.r.done{background:var(--m-tint);border-color:#C3D2DD}
.r .t{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:64px;white-space:nowrap}
.r .m{flex:1 1 180px;min-width:0}
.r .m b{font-weight:800}
.r .m i{font-style:normal;color:var(--m-mute);font-size:.8rem;padding:0 3px}
.r .won{color:#0B7A5A;font-weight:900}.r .won::after{content:' ✓';font-size:.8em}
.r .lost{color:#9AA8B5;font-weight:500}
.r .sc{display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.r .sc .hi{font-size:1.05rem;font-weight:900;color:var(--m-ink)}
.r .sc .lo{font-size:.9rem;font-weight:700;color:#9AA8B5}
.r .sc .d{padding:0 5px;color:#C3D2DD;font-weight:700}
.r .sc b{font-size:1rem;font-weight:800}
.r .sc .pend{font-style:normal;font-size:.74rem;font-weight:700;color:#9AA8B5}
.r .j{color:var(--m-mute);font-size:.72rem;flex:0 0 auto}

function rpc(name,args){
  return fetch(SB+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args||{})
  }).then(function(r){
    if (r.ok) return r.json();
    /* El cuerpo de un error de PostgREST trae el porqué —message,
       hint, details— y tirarlo era lo que convertía cada fallo en
       una visita al editor de SQL: la página sabía exactamente qué
       había pasado y enseñaba "no se pudo". Se lee antes de lanzar. */
    return r.text().then(function(t){
      var d = {}; try { d = JSON.parse(t) } catch(x){}
      var e = new Error(d.message || d.hint || t || ('rpc ' + r.status));
      e.detalle = d.details || d.hint || '';
      e.codigo  = d.code || r.status;
      throw e;
    });
  });

/* El porqué, cuando lo hay. Un mensaje amable que no dice nada manda
   a alguien a buscar en la base; el mismo mensaje con la razón
   detrás se arregla solo. Se recorta: esto es una línea de aviso, no
   un registro. */
function porque(x){
  if (!x) return '';
  var r = (typeof x === 'string') ? x
        : (x.why || x.error || x.message || x.hint || x.detalle || '');
  return r ? ' — ' + String(r).slice(0, 160) : '';
}
}

  [].forEach.call($('tEquipos').querySelectorAll('[data-eq]'), function(b){

}

var CODE=null, PROGRAMA='', EQUIPO='', JUEGOS=[];
var SERVER='https://hooporia-server.onrender.com';

/* Acepta la sesión que ya tenga de cualquiera de las dos páginas
   viejas: el calendario guardaba cp_build y el marcador cp_code. Un
   entrenador que ya entró en una de ellas no vuelve a escribir nada. */
try{ CODE = localStorage.getItem('cp_build') || localStorage.getItem('cp_code') || null; }catch(e){}

/* El código se guarda con las dos llaves que leen las demás páginas.
   Antes la segunda estaba condicionada a una casilla de certificación
   —herencia del marcador de mano, donde el entrenador escribía los
   puntos y tenía que responder por ellos— y aquí esa casilla no tenía
   nada que certificar: el marcador lo anota el juego. */
/* TEAMS ON THIS PHONE (Nov 6, 2026). A coach with a basketball and a
   volleyball team keeps both here and switches with one tap; the one
   in use is also kept in cp_code / cp_build, which the other pages read. */
function equiposGuardados(){
  var l = [];
  try { l = JSON.parse(localStorage.getItem('cp_teams') || '[]') || [] } catch(e){ l = [] }
  if (!Array.isArray(l)) l = [];
  l = l.filter(function(e){ return e && e.k });
  /* A phone signed in before this change: its one code becomes the list. */
  if (!l.length && CODE) l = [{ k: CODE, n: '', d: '' }];
  return l;
}
function guardarEquipos(l){ try { localStorage.setItem('cp_teams', JSON.stringify(l.slice(0, 6))) } catch(e){} }
function recordar(k, nombre, dep){
  try{
    localStorage.setItem('cp_build',k);
    localStorage.setItem('cp_code',k);
  }catch(e){}
  var l = equiposGuardados().filter(function(e){ return e.k !== k });
  l.unshift({ k: k, n: nombre || '', d: dep || '' });
  guardarEquipos(l);
}
/* Forget ONE team on this phone (sign out, or a code that stopped working). */
function olvidar(){
  var k = CODE;
  guardarEquipos(equiposGuardados().filter(function(e){ return e.k !== k }));
  try{ localStorage.removeItem('cp_build'); localStorage.removeItem('cp_code');
       localStorage.removeItem('cp_by'); localStorage.removeItem('cp_who'); }catch(e){}
}
/* Back to the team list without forgetting anything. */
function cambiarEquipo(){
  CODE = null; PUB = false; document.body.classList.remove('publico');
  $('app').className = 'hide'; $('gate').className = 'gate';
  $('hwho').textContent = ''; $('hout').className = 'out hide';   /* no team in use on the list */
  $('code').value = ''; say(''); paintStatic();
  try { window.scrollTo(0, 0) } catch(e){}
}
function salir(){ olvidar(); location.reload(); }

function say(t,c){ var e=$('gm'); if(e){ e.textContent=t||''; e.className='msg '+(c||'') } }

/* EL CÓDIGO COMO LO ESCRIBA. «Canóvanas 15U 4827», «canovanas15u-4827»
   y «CANOVANAS15U4827» son el mismo código: se prueba primero tal
   cual —así los códigos de siempre, con su guion, no se tocan— y si
   no abre, se prueba limpio, sin acentos, espacios ni guiones, que es
   como lo guarda la base. */
function codigoLimpio(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
           .toUpperCase().replace(/[^A-Z0-9]/g, '');
}
function probarCodigo(k){
  return rpc('juegos_del_codigo', { p_code: k }).then(function(r){
    var n = codigoLimpio(k);
    if ((r && r.ok) || n === k || n.length < 4) return { k: k, r: r };
    return rpc('juegos_del_codigo', { p_code: n }).then(function(r2){
      return (r2 && r2.ok) ? { k: n, r: r2 } : { k: k, r: r };
    });
  });
}

function entrar(auto){
  var k = auto ? CODE : ($('code').value||'').trim();
  if(!k || k.length<4) return say(T('bad'),'bad');
  say('…');

  /* UN SOLO VIAJE. Antes se validaba el código con builder_check y
     después se pedían los retos de cada campaña por separado. Lo que
     un entrenador necesita ver es sus JUEGOS, y juegos_del_codigo
     valida y los trae a la vez. */
  probarCodigo(k)
    .then(function(x){
      var r = x.r; k = x.k;
      if(!r||!r.ok){ if(auto){ olvidar(); CODE=null; paintStatic(); } return say(T('bad'),'bad'); }
      CODE=k; JUEGOS=r.juegos||[]; DEPORTE=r.deporte||''; CATS=r.categorias||[]; VER_CAT=''; PROGRAMA=r.campana||''; CAMP_ID=r.campana_id||null; PUB=false;
      document.body.classList.remove('publico');
      EQUIPO=r.equipo||'';
      recordar(k, r.maestro ? '*' : (r.campana || r.equipo || ''), '');
      paintStatic();
      say('');
      $('gate').className='gate hide';
      $('app').className='';
      $('hwho').textContent=PROGRAMA;
      $('hout').className='out';
      pintarJuegos();
    })
    .catch(function(e){ console.error(e); say(T('net') + porque(e), 'bad') });
}

function recargar(){
  if(!CODE) return;
  rpc('juegos_del_codigo',{p_code:CODE})
    .then(function(r){ if(r&&r.ok){ JUEGOS=r.juegos||[]; DEPORTE=r.deporte||DEPORTE; CATS=r.categorias||CATS; PROGRAMA=r.campana||PROGRAMA;
                                    EQUIPO=r.equipo||EQUIPO;
                                    pintarJuegos(); } })
    .catch(function(){});
}

function enlace(id){ return 'https://cadapunto.com/prometer.html?g=' + id }

var FILTRO = '';   // '' todo · 'prox' próximos · 'jug' jugados

/* La hora como la escriba el entrenador («7:00 PM», «19:00», «7pm»),
   en minutos para ordenar el día. Sin hora va al final del día. */
function minutos(t){
  var m = String(t || '').match(/(\d{1,2})(?::(\d{2}))?\s*([ap])?/i);
  if (!m) return 24 * 60;
  var h = parseInt(m[1], 10) % 12, mi = parseInt(m[2] || '0', 10);
  if (m[3] ? /p/i.test(m[3]) : parseInt(m[1], 10) >= 12) h += 12;
  if (!m[3] && parseInt(m[1], 10) === 12) h = 12;
  return h * 60 + mi;
}
function diaLargo(iso){
  var d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso || '';
  var t = d.toLocaleDateString(LANG === 'es' ? 'es-PR' : 'en-US', { weekday:'long', day:'numeric', month:'long' });
  t = t.replace(',', '');
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function diaCorto(iso){
  var d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso || '';
  return d.toLocaleDateString(LANG === 'es' ? 'es-PR' : 'en-US', { day:'numeric', month:'long' });
}
/* El mes una sola vez si es el mismo, como Marcador: «del 7 al 21 de
   noviembre», «Nov 7 to 21». */
function rangoDias(a, b){
  var da = new Date(a + 'T12:00:00'), db = new Date(b + 'T12:00:00');
  if (isNaN(da) || isNaN(db) || da.getMonth() !== db.getMonth() || da.getFullYear() !== db.getFullYear())
    return T('mDel', { A: diaCorto(a), B: diaCorto(b) });
  if (LANG === 'es') return T('mDel', { A: String(da.getDate()), B: diaCorto(b) });
  return T('mDel', { A: diaCorto(a), B: String(db.getDate()) });
}
function rival(g){ return String(g.juego || '').replace(/^(vs|@)\s+/i, '') }
function deVisita(g){ return /^@/.test(String(g.juego || '')) }

function depDe(g){ return g.deporte === 'voleibol' ? 'voleibol' : 'baloncesto' }
function tieneCat(l, c){ c = String(c || '').toLowerCase(); return l.some(function(x){ return String(x).toLowerCase() === c }) }
/* The add form: which sport it goes into, and the category list. */
function pintarAlta(){
  $('jDep').textContent = T('jDep', { D: T(VER_DEP === 'voleibol' ? 'depV' : 'depB') });
  $('tCat').textContent = T('tCat');
  var antes = $('jCat').value;
  var l = CATS.slice();
  JUEGOS.forEach(function(g){ if (g.categoria && !tieneCat(l, g.categoria)) l.push(g.categoria) });
  $('jCat').innerHTML = l.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>' }).join('') +
    '<option value="">' + esc(T('catSin')) + '</option>' +
    '<option value="__nueva">' + esc(T('catNueva')) + '</option>';
  if (VER_CAT && tieneCat(l, VER_CAT)) $('jCat').value = l.filter(function(c){ return c.toLowerCase() === VER_CAT.toLowerCase() })[0];
  else if (antes && [].some.call($('jCat').options, function(o){ return o.value === antes })) $('jCat').value = antes;
  $('jCatNueva').placeholder = T('catNuevaPh');
  $('jCatNueva').hidden = $('jCat').value !== '__nueva';
}

function pintarJuegos(){
  var nos = EQUIPO || PROGRAMA || '';
  $('quien').textContent = PUB ? '' : T('quien').replace('{P}', PROGRAMA || '');
  $('hKick').textContent = PUB ? T('pubKick').toUpperCase() : 'ADMIN';
  $('hwho').textContent = PUB ? (EQUIPO || PROGRAMA) : PROGRAMA;
  /* The team's sport, so pledges and scores are never mixed up. */
  $('mCambiar').style.display = PUB ? 'none' : '';
  /* SPORT SWITCH. The coach always has both (he posts games in either);
     the public sees it only when the program plays both. */
  var hay = { baloncesto: 0, voleibol: 0 };
  JUEGOS.forEach(function(g){ hay[depDe(g)]++ });
  if (VER_DEP !== 'baloncesto' && VER_DEP !== 'voleibol')
    VER_DEP = (hay.voleibol && !hay.baloncesto) ? 'voleibol' : 'baloncesto';
  if (PUB && !hay[VER_DEP] && (hay.baloncesto || hay.voleibol)) VER_DEP = hay.baloncesto ? 'baloncesto' : 'voleibol';
  $('mDepSw').hidden = PUB && !(hay.baloncesto && hay.voleibol);
  $('mDepSw').innerHTML = [['baloncesto', 'depB'], ['voleibol', 'depV']].map(function(d){
    return '<button type="button" data-dep="' + d[0] + '" class="' + (VER_DEP === d[0] ? 'on' : '') + '" aria-pressed="' + (VER_DEP === d[0]) + '">' + esc(T(d[1])) + '</button>';
  }).join('');
  [].forEach.call($('mDepSw').querySelectorAll('button'), function(b){
    b.onclick = function(){ VER_DEP = b.getAttribute('data-dep'); VER_CAT = '';
      if (!PUB) try { localStorage.setItem('cp_dep', VER_DEP) } catch(e){}
      pintarJuegos() };
  });
  pintarAlta();
  $('mPub').textContent = T('copiarPub');
  $('mPub').style.display = (!PUB && CAMP_ID) ? '' : 'none';
  $('mCoach').querySelector('a').textContent = T('coachEntra');
  $('mAdd').textContent = $('mAlta').className.indexOf('hide') >= 0 ? T('mAdd') : T('mAddCerrar');

  /* CATEGORIES of this sport: the program's list plus any a game uses. */
  var delDep = JUEGOS.filter(function(g){ return depDe(g) === VER_DEP });
  var cats = (PUB ? [] : CATS.slice());
  delDep.forEach(function(g){ if (g.categoria && !tieneCat(cats, g.categoria)) cats.push(g.categoria) });
  if (VER_CAT && !tieneCat(cats, VER_CAT)) VER_CAT = '';
  $('mCats').innerHTML = cats.length < (PUB ? 2 : 1) ? '' : [''].concat(cats).map(function(c){
    return '<button type="button" data-cat="' + esc(c) + '" class="' + (VER_CAT.toLowerCase() === c.toLowerCase() ? 'on' : '') + '">' + esc(c || T('catTodas')) + '</button>';
  }).join('');
  [].forEach.call($('mCats').querySelectorAll('button'), function(b){
    b.onclick = function(){ VER_CAT = b.getAttribute('data-cat'); pintarJuegos() };
  });
  var VISTA = delDep.filter(function(g){ return !VER_CAT || String(g.categoria || '').toLowerCase() === VER_CAT.toLowerCase() });

  /* La cabecera, de los juegos: como la de Marcador. */
  var dias = [], jug = 0, prom = 0;
  VISTA.forEach(function(g){
    if (g.fecha && dias.indexOf(g.fecha) < 0) dias.push(g.fecha);
    if (g.jugado) jug++;
    prom += Number(g.promesas || 0);
  });
  dias.sort();
  var n = VISTA.length;
  $('mH1').textContent = !n ? T('h1') :
    T(PUB ? (n === 1 ? 'pJuego' : 'pJuegos') : (n === 1 ? 'mJuego' : 'mJuegos'), { N: n }) +
    (dias.length === 1 ? T('mEl', { A: diaCorto(dias[0]) })
     : dias.length > 1 ? rangoDias(dias[0], dias[dias.length - 1]) : '');
  $('mStat').innerHTML = !n ? '' :
    '<span><b>' + n + '</b> ' + esc(T('sJuegos')) + '</span>' +
    '<span><b>' + jug + '</b> ' + esc(T('sJugados')) + '</span>' +
    (PUB ? '' : '<span><b>' + prom + '</b> ' + esc(T('sPromesas')) + '</span>') +
    '<span><b>' + dias.length + '</b> ' + esc(T('sDias')) + '</span>';

  /* Lo público abre en lo que viene, con dos enlaces: próximos y
     resultados. El coach conserva sus tres. */
  if (PUB && FILTRO === '') FILTRO = 'prox';
  var pestanas = PUB ? [['prox', 'tabPProx'], ['jug', 'tabPRes']] : [['', 'tabTodo'], ['prox', 'tabProx'], ['jug', 'tabJug']];
  $('mTabs').innerHTML = (!n && !PUB) ? '' : pestanas.map(function(t){
    return '<button class="tab' + (FILTRO === t[0] ? ' on' : '') + '" data-f="' + t[0] + '">' + esc(T(t[1])) + '</button>';
  }).join('');
  $('mHint').textContent = (n && !PUB) ? T('mHint') : '';

  if (!n){
    $('teams').innerHTML = '<p class="vacio">' + esc(T(PUB ? 'vacioPub' : 'sinJuegos')) + '</p>';
    if (!PUB) plegarAlta(true);
    [].forEach.call($('mTabs').querySelectorAll('.tab'), function(b){
      b.onclick = function(){ FILTRO = b.getAttribute('data-f'); pintarJuegos() };
    });
    return;
  }

  /* Por día y por hora, como Marcador. */
  var lista = VISTA.filter(function(g){
    return FILTRO === 'jug' ? g.jugado : FILTRO === 'prox' ? !g.jugado : true;
  });
  var porDia = {};
  lista.forEach(function(g){ (porDia[g.fecha || ''] = porDia[g.fecha || ''] || []).push(g) });
  var html = '';
  /* Los resultados, lo más reciente primero; lo que viene, en orden. */
  var claves = Object.keys(porDia).sort();
  if (FILTRO === 'jug') claves.reverse();
  claves.forEach(function(d){
    var l = porDia[d].sort(function(a, b){ return minutos(a.hora) - minutos(b.hora) });
    html += '<section class="day"><h2>' + esc(diaLargo(d)) + ' <span>' +
            esc(l.length === 1 ? T('d1') : T('dN', { N: l.length })) + '</span></h2><div class="rows">';
    /* Master code: every team's games, so each row names its own team. */
    l.forEach(function(g){ html += fila(g, nos || g.campana || '') });
    html += '</div></section>';
  });
  $('teams').innerHTML = html || '<p class="vacio">' + esc(T(
    FILTRO === 'prox' ? (PUB ? 'vacioProx' : 'vacioFiltro') :
    FILTRO === 'jug'  ? (PUB ? 'vacioRes'  : 'vacioFiltro') : 'vacioFiltro')) + '</p>';

  var L = $('teams');
  [].forEach.call($('mTabs').querySelectorAll('.tab'), function(b){
    b.onclick = function(){ FILTRO = b.getAttribute('data-f'); pintarJuegos() };
  });
  if (!PUB) [].forEach.call(L.querySelectorAll('.r'), function(r){
    r.onclick = function(){ tocar(r) };
  });
  [].forEach.call(L.querySelectorAll('[data-cop]'), function(b){
    b.onclick = function(e){ e.stopPropagation(); copiar(b.getAttribute('data-cop'), b) };
  });
  [].forEach.call(L.querySelectorAll('[data-rec]'), function(b){
    b.onclick = function(e){ e.stopPropagation(); recaudar(b.getAttribute('data-rec'), true, b) };
  });
  [].forEach.call(L.querySelectorAll('[data-norec]'), function(b){
    b.onclick = function(e){ e.stopPropagation(); recaudar(b.getAttribute('data-norec'), false, b) };
  });
  [].forEach.call(L.querySelectorAll('a.pl'), function(a){
    a.onclick = function(e){ e.stopPropagation() };
  });
}

/* Una fila de Marcador: hora · cancha · equipos y marcador, y debajo
   lo de Cada Punto. */
function fila(g, nos){
  var r = rival(g), np = Number(g.promesas || 0);
  var a = deVisita(g) ? r : nos, b = deVisita(g) ? nos : r;          // local primero, como en Marcador
  var pa = deVisita(g) ? g.rival_puntos : g.puntos, pb = deVisita(g) ? g.puntos : g.rival_puntos;
  var ca = '', cb = '', sc = '';
  if (g.jugado && pa != null && pb != null){
    if (pa > pb){ ca = ' won'; cb = ' lost'; sc = '<b class="hi">' + pa + '</b><span class="d">–</span><b class="lo">' + pb + '</b>' }
    else if (pb > pa){ cb = ' won'; ca = ' lost'; sc = '<b class="lo">' + pa + '</b><span class="d">–</span><b class="hi">' + pb + '</b>' }
    else sc = '<b>' + pa + '</b><span class="d">–</span><b>' + pb + '</b>';
  }
  var tag = g.es_prueba ? '<span class="k" style="--k:#FF7A18">' + esc(T('kPrueba')) + '</span>'
          : g.recauda === false ? '<span class="k" style="--k:#5A6B7C">' + esc(T('kSolo')) + '</span>'
          : '<span class="k" style="--k:#0C6E8C">' + esc(T('kPad')) + '</span>';
  var prom = np === 0 ? T('sinPromesas') : np === 1 ? T('nPromesa') : T('nPromesas').replace('{N}', np);
  var pls = '';
  if (PUB){
    /* Lo público: el resultado o lo que viene, y Prometer en los juegos
       con padrinos que todavía están abiertos. Nada de cómo recaudar,
       nada de cuentas ni enlaces del coach. */
    if (g.abierto) pls = '<a class="pl prom" href="prometer.html?g=' + encodeURIComponent(g.game_id) + '">' + esc(T('prometer')) + '</a>';
    if (g.recauda === false || g.jugado) tag = '';
    return '<div class="r' + (g.jugado ? ' done' : '') + '" data-id="' + esc(g.game_id) + '">' +
        '<span class="t">' + esc(g.hora || T('sinHora')) + '</span>' +
        '<span class="m"><b class="sa' + ca + '">' + esc(a) + '</b> <i>vs</i> <b class="sb' + cb + '">' + esc(b) + '</b>' +
          '<span class="sc">' + (sc || '<em class="pend">' + esc(T('stPend')) + '</em>') + '</span></span>' +
        '<span class="j">' + esc(g.categoria ? g.categoria + (g.cancha ? ' · ' : '') : '') + esc(g.cancha || '') + (g.jugado ? (g.cancha || g.categoria ? ' · ' : '') + esc(T('stFinal')) : '') + '</span>' +
        tag + '<span class="pls">' + pls + '</span></div>';
  }
  if (g.recauda === false){
    if (!g.jugado) pls += '<button class="pl want" data-rec="' + esc(g.game_id) + '">' + esc(T('abrir')) + '</button>';
  } else {
    pls += '<span class="pl mine"><b>' + esc(prom) + '</b></span>';
    pls += '<button class="pl" data-cop="' + esc(g.game_id) + '">' + esc(T('copiar')) + '</button>';
    if (np === 0 && !g.jugado) pls += '<button class="pl want" data-norec="' + esc(g.game_id) + '">' + esc(T('cerrar')) + '</button>';
  }
  if (g.jugado) pls += '<a class="pl" href="reporte.html">' + esc(T('verReporte')) + '</a>';
  /* Master code sees every team at once: each game says its sport. */
  var depFila = g.categoria ? g.categoria + (g.cancha ? ' · ' : '') : '';
  return '<div class="r live' + (g.jugado ? ' done' : '') + (g.es_prueba ? ' p' : '') + '" data-id="' + esc(g.game_id) + '">' +
      '<span class="t">' + esc(g.hora || T('sinHora')) + '</span>' +
      '<span class="m"><b class="sa' + ca + '">' + esc(a) + '</b> <i>vs</i> <b class="sb' + cb + '">' + esc(b) + '</b>' +
        '<span class="sc">' + (sc || '<em class="pend">' + esc(T('stPend')) + '</em>') + '</span></span>' +
      '<span class="j">' + esc(depFila) + esc(g.cancha || '') + (g.jugado ? (g.cancha || depFila ? ' · ' : '') + esc(T('stFinal')) : '') + '</span>' +
      tag +
      '<span class="pls">' + pls + '</span>' +
    '</div>';
}

/* EL MARCADOR SE PONE TOCANDO EL JUEGO, como en la mesa de Marcador:
   se abren dos casillas ahí mismo, nuestro equipo y el rival, y
   «Publicar» hace lo de siempre — pregunta, publica y manda los
   avisos a los padrinos. «Retirar» quita un marcador ya puesto. */
function tocar(row){
  /* Tocar el juego otra vez lo cierra, y abrir otro cierra el que
     estaba abierto: nunca quedan dos cajas abiertas ni una atascada. */
  var abierta = row.querySelector('.ed');
  [].forEach.call(document.querySelectorAll('.r .ed'), function(e){ e.remove() });
  if (abierta) return;
  var g = JUEGOS.filter(function(x){ return String(x.game_id) === row.getAttribute('data-id') })[0];
  if (!g) return;
  var nos = EQUIPO || PROGRAMA || T('lMios'), r = rival(g) || T('lSuyos');
  /* Las casillas en el mismo orden que la fila: el local primero. De
     visita, la primera es la del rival. */
  var v = deVisita(g);
  var n1 = v ? r : nos, n2 = v ? nos : r;
  var p1 = v ? g.rival_puntos : g.puntos, p2 = v ? g.puntos : g.rival_puntos;
  var ed = document.createElement('span');
  ed.className = 'ed';
  ed.innerHTML =
    '<input class="ep" type="tel" inputmode="numeric" maxlength="3" value="' + (p1 == null ? '' : p1) + '" placeholder="' + esc(n1.slice(0, 9)) + '">' +
    '<span class="edash">–</span>' +
    '<input class="ep" type="tel" inputmode="numeric" maxlength="3" value="' + (p2 == null ? '' : p2) + '" placeholder="' + esc(n2.slice(0, 9)) + '">' +
    '<button class="esave">' + esc(T('eGuardar')) + '</button>' +
    (g.jugado ? '<button class="edel">' + esc(T('eBorrar')) + '</button>' : '') +
    '<button class="eclose">' + esc(T('eCerrar')) + '</button>' +
    (depDe(g) === 'voleibol' ? '<span class="enota">' + esc(T('notaVol')) + '</span>' : '');
  row.appendChild(ed);
  var cajas = ed.querySelectorAll('.ep');
  ed.addEventListener('click', function(e){ e.stopPropagation() });
  cajas[0].addEventListener('input', function(){ if (this.value.length >= 2 && Number(this.value) > 9) cajas[1].focus() });
  [].forEach.call(cajas, function(c){
    c.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); guardar() }
      if (e.key === 'Escape'){ e.preventDefault(); ed.remove() }
    });
  });
  ed.querySelector('.esave').onclick = guardar;
  ed.querySelector('.eclose').onclick = function(){ ed.remove() };
  var del = ed.querySelector('.edel');
  if (del) del.onclick = function(){ marcador(g.game_id, true) };
  cajas[0].focus(); try { cajas[0].select() } catch(e){}
  function guardar(){
    var x = cajas[0].value.trim(), y = cajas[1].value.trim();
    var mios = v ? y : x, suyos = v ? x : y, cajaMia = v ? cajas[1] : cajas[0];
    if (!/^\d+$/.test(mios)){ cajaMia.focus(); return dice(T('errPuntos'), 'bad') }
    if (suyos !== '' && !/^\d+$/.test(suyos)){ (v ? cajas[0] : cajas[1]).focus(); return }
    marcador(g.game_id, false, Number(mios), suyos === '' ? null : Number(suyos));
  }
}

/* Encender o apagar los padrinos de un juego.
   Apagarlo pregunta; encenderlo no, porque encenderlo no le quita
   nada a nadie — igual que mandar un aviso pregunta y copiar un
   enlace no. */
function recaudar(id, on, boton){
  if (!on && !confirm(T('confCerrar'))) return;
  boton.disabled = true;
  dice('…');

  rpc('juego_recaudar', { p_code:CODE, p_game:id, p_recauda:on })
    .then(function(d){
      if(!d || d.ok !== true){
        boton.disabled = false;
        var r = d && d.reason;
        return dice(
          r === 'con-promesas' ? T('errConPromesas').replace('{N}', d.promesas || 0) :
          r === 'ya-jugado'    ? T('errYaJugado') :
          T('errGen'), 'bad');
      }
      dice(on ? T('okAbierto') : T('okCerrado'), 'ok');
      recargar();
    })
    .catch(function(e){ boton.disabled = false; dice(T('errGen')+porque(e), 'bad') });
}

/* Los avisos de un juego. Dos pulsaciones y no una: un correo no se
   retira, y este botón está al lado de «Copiar el enlace», que no
   hace daño ninguno. */
/* Los avisos de un juego, justo después de publicar su marcador.
   Sin pregunta: la pregunta se hizo al publicar. Volver a llamarlo es
   seguro —el servidor sólo manda lo que falta y pone en fila dos
   pasadas del mismo juego—, así que «vuelve a poner el mismo
   marcador» es el reintento del entrenador. */
function enviarAvisos(id){
  dice(T('avisando'), '');

  fetch(SERVER + '/game-notices', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ code: CODE, game_id: id })
  }).then(function(res){
    if (res.status === 403) throw new Error('code');
    if (!res.ok) throw new Error('server');
    return res.json();
  }).then(function(d){
    if (!d || d.ok !== true) throw new Error('server');

    var partes = [];
    if (d.sent)          partes.push(T('aviHechos').replace('{N}', d.sent));
    if (d.corrected)     partes.push(T('aviCorr').replace('{N}', d.corrected));
    if (d.zero)          partes.push(T('aviCero').replace('{N}', d.zero));
    if (d.skipped)       partes.push(T('aviYa').replace('{N}', d.skipped));
    if (d.undeliverable) partes.push(T('aviMuerto').replace('{N}', d.undeliverable));
    if (d.failed)        partes.push(T('aviFallo').replace('{N}', d.failed));
    if (!partes.length)  partes.push(T('aviNada'));

    dice(partes.join(' '), (d.failed || d.undeliverable) ? 'bad' : 'ok');
    recargar();
  }).catch(function(e){
    dice((e && e.message === 'code') ? T('aviErrCodigo') : T('aviErrServidor'), 'bad');
  });
}

function copiar(id, boton){
  var url = enlace(id);
  var ok = function(){ var t=boton.textContent; boton.textContent=T('copiado');
                       setTimeout(function(){ boton.textContent=t },1600) };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(url).then(ok).catch(function(){});
  else ok();
}

$('jCat').onchange = function(){
  $('jCatNueva').hidden = this.value !== '__nueva';
  if (!$('jCatNueva').hidden) try { $('jCatNueva').focus() } catch(e){}
};
$('jCrear').onclick = function(){
  var rival=($('jRival').value||'').trim();
  var fecha=($('jFecha').value||'').trim();
  var hora=($('jHora').value||'').trim();
  var cancha=($('jCancha').value||'').trim();
  var casa=$('jCasa').value==='1';
  var rec=$('jRecauda').value==='1';
  var cat = $('jCat').value === '__nueva' ? ($('jCatNueva').value || '').replace(/\s+/g, ' ').trim() : $('jCat').value;
  if ($('jCat').value === '__nueva' && !cat){ $('jCatNueva').focus(); return dice(T('errCat'), 'bad'); }

  if(!rival) return dice(T('errRival'),'bad');
  if(!fecha) return dice(T('errFecha'),'bad');

  dice('…');
  rpc('juego_crear',{p_code:CODE,p_rival:rival,p_fecha:fecha,
                     p_hora:hora||null,p_cancha:cancha||null,p_casa:casa,
                     p_recauda:rec, p_deporte:VER_DEP || 'baloncesto', p_categoria:cat || null})
    .then(function(d){
      if(!d||d.ok!==true){
        var r=d&&d.reason;
        return dice(r==='repetido'?T('errRepetido'):
                    r==='falta-rival'?T('errRival'):
                    r==='falta-fecha'?T('errFecha'):T('errGen'),'bad');
      }
      dice(T('okCreado'),'ok');
      $('jRival').value=''; $('jHora').value=''; $('jCancha').value='';
      if (cat && !tieneCat(CATS, cat)) CATS.push(cat);
      $('jCatNueva').value = ''; if ($('jCat').value === '__nueva') $('jCat').value = cat;
      recargar();
    })
    .catch(function(e){ dice(T('errGen')+porque(e),'bad') });
};

function dice(t,c){ var e=$('jm'); if(e){ e.textContent=t||''; e.className='msg '+(c||'') } }


function marcador(id, retirar, mios, suyos){
  if (retirar) { mios = null; suyos = null; }

  if(!retirar && mios===null) return dice(T('errPuntos'),'bad');
  if(retirar && !confirm(T('confRetirar'))) return;
  if(!retirar && !confirm(T('confPublicar').replace('{M}',
       mios + (suyos!==null ? '–' + suyos : ''))) ) return;

  dice('…');
  rpc('juego_marcador',{p_code:CODE,p_game:id,p_mios:mios,p_suyos:suyos})
    .then(function(d){
      if(!d||d.ok!==true)
        return dice((d&&d.reason)==='puntos'?T('errMarcador'):T('errGen'),'bad');
      if(retirar){ dice(T('okRetirado'),'ok'); recargar(); return; }
      dice(T('okMarcador'),'ok');
      /* Un juego sólo de marcador no tiene padrinos: no hay nada que
         mandar. Cualquier otro manda, aunque la lista diga cero
         promesas: la lista puede ser de hace un rato. */
      var j = JUEGOS.filter(function(x){ return String(x.game_id)===String(id) })[0];
      if (j && j.recauda === false) { recargar(); return; }
      enviarAvisos(id);
    })
    .catch(function(e){ dice(T('errGen')+porque(e),'bad') });
}

$('code').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); entrar(false) }
});

/* ══ LA PÁGINA PÚBLICA ══════════════════════════════════════════════
   El mismo calendario, para cualquiera con el enlace del equipo
   (?e=<id del programa>): resultados, próximos juegos y Prometer en
   los juegos abiertos. El coach entra en la misma página con su
   código. Un teléfono donde el coach ya entró lo abre como Admin. */
var PUB = false, CAMP_ID = null;
/* 'baloncesto' or 'voleibol', from the team. Empty with the master code. */
/* What the page is showing: one sport, and one category or all. The
   program's categories come from its signup; new ones join as games use them. */
var DEPORTE = '', VER_DEP = '', VER_CAT = '', CATS = [];
try { VER_DEP = localStorage.getItem('cp_dep') || '' } catch(e){}
var PUB_ID = (location.search.match(/[?&]e=([0-9a-f-]{36})/i) || [])[1] || null;
/* &t=jug opens the public page on Results (the pledge page links there). */
if (PUB_ID && /[?&]t=jug(&|$)/.test(location.search)) FILTRO = 'jug';
var DESDE_G = PUB_ID ? ((location.search.match(/[?&]g=([0-9a-f-]{36})(&|$)/i) || [])[1] || null) : null;
function abrirPublico(){
  rpc('calendario_publico', { p_campaign: PUB_ID }).then(function(r){
    if (!r || !r.ok){ say(T('pubNo'), 'bad'); return; }
    PUB = true; JUEGOS = r.juegos || []; DEPORTE = r.deporte || ''; CATS = []; VER_CAT = ''; EQUIPO = r.equipo || ''; PROGRAMA = r.equipo || '';
    document.body.classList.add('publico');
    $('gate').className = 'gate hide'; $('app').className = '';
    pintarJuegos();
  }).catch(function(e){ say(T('net') + porque(e), 'bad') });
}
function entrarCoach(){
  PUB = false; document.body.classList.remove('publico');
  $('app').className = 'hide'; $('gate').className = 'gate';
  try { $('code').focus() } catch(e){}
  return false;
}
function copiarPublica(b){
  if (!CAMP_ID) return;
  var url = 'https://cadapunto.com/mi-equipo.html?e=' + CAMP_ID;
  var t = b.textContent;
  var ok = function(){ b.textContent = T('copiado'); setTimeout(function(){ b.textContent = t }, 1600) };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok).catch(function(){});
  else ok();
}

/* EL ENLACE PÚBLICO SIEMPRE ABRE LO PÚBLICO, también en el teléfono
   del coach: es el que se manda al grupo, y el coach tiene que poder
   ver lo mismo que verá un papá. Su Admin está en mi-equipo.html a
   secas, o en «¿Eres el coach?», que entra directo si ya está guardado. */
paintStatic();
/* A remembered code is NOT opened by itself any more: the sign-in
   screen offers it as a button, next to the box for another team's code.
   Two teams on one phone can't land in each other's Admin. */
if (PUB_ID) abrirPublico();
</script>

<script>
/* ══ El menú de la barra ════════════════════════════════════════════
   Vive aparte del sistema de idioma de cada página a propósito: son
   doce páginas con cuatro formas distintas de pintar sus textos, y
   engancharse a cada una sería cuatro maneras de romperse. Esto lee
   el idioma de donde lo deja todo el mundo —localStorage— y pinta
   sus seis enlaces y nada más. */
(function(){
var ROTULOS = {
  en: { inicio:'Home', como:'How it works', precio:'What it costs',
        ayuda:'Questions', mia:'Admin', alta:'Sign up a program',
        menu:'Menu', otro:'Español', aOtro:'Cambiar a español' },
  es: { inicio:'Inicio', como:'Cómo funciona', precio:'Cuánto cuesta',
        ayuda:'Preguntas', mia:'Admin', alta:'Registra un programa',
        menu:'Menú', otro:'English', aOtro:'Switch to English' }
};
function idioma(){
  try{
    return localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
           localStorage.getItem('fc-lang') ||
           'es';
  }catch(e){ return 'es' }
}
var b = document.getElementById('hamb'),
    m = document.getElementById('menu'),
    l = document.getElementById('langBtn') || document.getElementById('lang');
if (!b || !m) return;

function pintar(){
  var t = ROTULOS[idioma()] || ROTULOS.es;
  m.querySelectorAll('[data-m]').forEach(function(a){
    a.textContent = t[a.getAttribute('data-m')] || a.textContent;
  });
  b.setAttribute('aria-label', t.menu);
  /* El botón del idioma lo pinta la propia página, cada una a su
     manera. Aquí sólo se corrige si se quedó con las dos letras
     viejas, para que ninguna página diga «EN» mientras las demás
     dicen «English». */
  if (l && /^(EN|ES)$/.test((l.textContent||'').trim())) {
    l.textContent = t.otro;
    l.setAttribute('aria-label', t.aOtro);
  }
}
function pon(abierto){
  m.classList.toggle('abierto', abierto);
  b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
}
b.addEventListener('click', function(){
  pon(b.getAttribute('aria-expanded') !== 'true');
});
m.addEventListener('click', function(e){ if (e.target.closest('a')) pon(false) });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') {
    pon(false); b.focus();
  }
});
/* Al pulsar el idioma, la página repinta lo suyo; el menú repinta
   lo suyo detrás, con un turno de espera para que el valor nuevo ya
   esté guardado cuando se lea. */
if (l) l.addEventListener('click', function(){ setTimeout(pintar, 0) });
pintar();
})();
</script>
