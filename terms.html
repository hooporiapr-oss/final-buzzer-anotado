   las dos, y para la próxima página que cambie de fondo. Lo
   encontró una captura, no la prueba: la prueba miraba que el botón
   estuviera, no que se viera. */
/* El color de las rayas sale de la barra, y la barra de estas
   páginas no declaraba ninguno: heredaban la tinta del cuerpo
   —navy sobre navy— y el botón se veía con 1.2:1 de contraste,
   que es no verse. Barra navy, tinta blanca. */

.hamb{display:none;width:44px;height:44px;flex:0 0 44px;color:inherit;
  border:1px solid currentColor;background:transparent;border-radius:9px;
  cursor:pointer;padding:0;align-items:center;justify-content:center}
@supports (border-color: color-mix(in srgb, currentColor 45%, transparent)){
  .hamb{border-color: color-mix(in srgb, currentColor 45%, transparent)}
}
.hamb:hover{border-color:var(--orange);color:var(--orange)}
/* color:inherit en la propia raya y no sólo en el botón: privacy
   y terms traen un `strong,b{color:var(--ink)}` para el texto, y
   currentColor dentro de un <b> resuelve al color DEL <b>, no al
   del padre. Las rayas salían navy sobre navy. */

  background:currentColor;border-radius:2px;

.hamb b::after{top:6px}

contribución voluntaria al programa. No es una apuesta, ni un juego de azar, ni una inversión, ni
la compra de bienes o servicios. La cantidad varía con lo que se anote; la contribución se le debe
al programa de todas formas, sea cual sea ese marcador &mdash; y se le debe al programa, nunca a
Gostar Digital LLC.</p>

<h2>Impuestos</h2>
<p>Cada Punto Cuenta lo opera Gostar Digital LLC, una empresa con fines de lucro. No hacemos ninguna
afirmación sobre cómo se trata una promesa o un pago para efectos contributivos, y no emitimos
recibos para impuestos. Nada en este sitio debe leerse como que una promesa es un donativo
caritativo ni que es deducible. El padrino que quiera saber cómo se trata su pago debe
consultarlo con su propio asesor, y cada programa responde por su propia situación
contributiva.</p>

<h2>Lo que hace el programa con lo recaudado</h2>
<p>El dinero recaudado es del programa que el padrino escogió. Lo que ese programa haga
después con él &mdash; incluido compartir parte con su liga, su escuela o el programa que lo
trajo a la plataforma &mdash; es decisión suya y responsabilidad suya. Gostar Digital LLC no
participa en esos acuerdos, no los administra y no cobra nada por ellos.</p>

<h2>Lo que acepta un padrino</h2>
<ul>
  <li>Una promesa es un compromiso de pagarle al programa una vez acabado el juego y publicado el
      marcador final.</li>
  <li>Cada Punto Cuenta no le cobra nada, nunca. El pago se arregla directo con el programa.</li>
  <li>Las promesas de un juego cierran cuando se publica su marcador final. Nadie promete sabiendo
      el marcador.</li>
  <li>El padrino puede poner un máximo. La cantidad nunca se saca por encima de eso, suba lo que
      suba el marcador.</li>
  <li>Un juego que no se juega no da cantidad, y la promesa queda liberada.</li>
  <li>Las cantidades pequeñas se cierran. Si una promesa da menos de cinco dólares una vez puesto el

      de corrección, si un marcador corregido deja por debajo de cinco dólares una cantidad que ya
      se le había dicho al padrino.</li>
</ul>

<h2>Cargos</h2>
<p>Cada Punto Cuenta se licencia por juego: un dólar por cada promesa que cualifica, con un máximo de
$99 por juego. Una promesa cualifica cuando vale cinco dólares o más una vez puesto el marcador final.
Es la misma línea de cinco dólares que cierra las promesas pequeñas: una promesa que da menos no la
debe nadie y nunca cuenta para el cargo. No hay suscripción y no se paga nada por adelantado. No hay mínimo de juegos. Un juego que no recoge
ni una promesa que cualifique no se factura. La tarifa está publicada en cadapunto.com y no cambia
con el tamaño del equipo, ni con lo que recaude el programa, ni con cuántos padrinos traiga un juego.
La paga la organización por el uso del programa. No es una parte de lo que recauda nadie, no sale
de ninguna promesa, y Gostar Digital LLC nunca le cobra nada a un padrino.</p>
<p>El cargo se factura por los juegos que llevaron promesas que cualifican y se paga dentro de siete
días naturales, según lo que dice más abajo en <b>Licencias sin pagar y conservación de datos</b>.
El cargo es por el resultado de las promesas, no por promesas pagadas: una vez que hay promesas que
cualifican y el reporte está hecho, el cargo se debe haya pagado o no haya pagado un padrino.</p>

<h2 id="licencia">Licencias sin pagar y conservación de datos</h2>

<p>Si el pago no se recibe en ese plazo, Gostar Digital LLC puede suspender las funciones de manejo

<p><strong>Una suspensión nunca le quita al programa su información.</strong> Durante una

<p>Al pagarse la licencia pendiente, se restablecen las funciones suspendidas de ese juego.</p>
<p>La suspensión no afecta a los demás juegos con licencia al día.</p>

<script>
var LANG='en';
try{ LANG = localStorage.getItem('cp-lang') ||
  'es'; }catch(e){}
/* EL ENLACE DE LA INSCRIPCIÓN TRAE SU IDIOMA. La casilla de la
   licencia apunta a #licencia desde el formulario en español y a
   #licence desde el inglés; la página se abre en ese idioma, para que
   la sección exista, y baja hasta ella. Las dos versiones llevan la
   sección con id="licencia". */
var ANCLA = (location.hash || '').toLowerCase();
if (ANCLA === '#licencia') LANG = 'es';
if (ANCLA === '#licence')  LANG = 'en';

function draw(){
  document.documentElement.lang = LANG;
  document.getElementById('app').innerHTML = BODY[LANG] || BODY.en;
  document.getElementById('langBtn').textContent = LANG==='en' ? 'Español':'English';
  try{ document.querySelector('main').scrollTop = 0; }catch(e){}
  /* Con #licencia o #licence, a la sección de la licencia. El texto
     se pinta desde aquí, así que el navegador no la encuentra solo. */
  if (ANCLA === '#licencia' || ANCLA === '#licence'){
    var s = document.getElementById('licencia');
    if (s) setTimeout(function(){ s.scrollIntoView(); }, 0);
  }
}
function toggleLang(){
  LANG = LANG==='en' ? 'es':'en';
  try{ localStorage.setItem('cfh_lang', LANG);
      localStorage.setItem('cp-lang', LANG);
      localStorage.setItem('fc-lang', LANG); }catch(e){}
  draw();
}
draw();
</script>

<script>
/* ══ El menú de la barra ════════════════════════════════════════════
   Vive aparte del sistema de idioma de cada página a propósito: son
   doce páginas con cuatro formas distintas de pintar sus textos, y
   engancharse a cada una sería cuatro maneras de romperse. Esto lee
   el idioma de donde lo deja todo el mundo —localStorage— y pinta
   sus seis enlaces y nada más. */
(function(){
var ROTULOS = {
  en: { inicio:'Home', como:'How it works', precio:'What it costs',
        ayuda:'Questions', mia:'Admin', alta:'Sign up a program',
        menu:'Menu', otro:'Español', aOtro:'Cambiar a español' },
  es: { inicio:'Inicio', como:'Cómo funciona', precio:'Cuánto cuesta',
        ayuda:'Preguntas', mia:'Admin', alta:'Registra un programa',
        menu:'Menú', otro:'English', aOtro:'Switch to English' }
};
function idioma(){
  try{
    return localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
           localStorage.getItem('fc-lang') ||
           'es';
  }catch(e){ return 'es' }
}
var b = document.getElementById('hamb'),
    m = document.getElementById('menu'),
    l = document.getElementById('langBtn') || document.getElementById('lang');
if (!b || !m) return;

function pintar(){
  var t = ROTULOS[idioma()] || ROTULOS.es;
  m.querySelectorAll('[data-m]').forEach(function(a){
    a.textContent = t[a.getAttribute('data-m')] || a.textContent;
  });
  b.setAttribute('aria-label', t.menu);
  /* El botón del idioma lo pinta la propia página, cada una a su
     manera. Aquí sólo se corrige si se quedó con las dos letras
     viejas, para que ninguna página diga «EN» mientras las demás
     dicen «English». */
  if (l && /^(EN|ES)$/.test((l.textContent||'').trim())) {
    l.textContent = t.otro;
    l.setAttribute('aria-label', t.aOtro);
  }
}
function pon(abierto){
  m.classList.toggle('abierto', abierto);
  b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
}
b.addEventListener('click', function(){
  pon(b.getAttribute('aria-expanded') !== 'true');
});
m.addEventListener('click', function(e){ if (e.target.closest('a')) pon(false) });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') {
    pon(false); b.focus();
  }
});
/* Al pulsar el idioma, la página repinta lo suyo; el menú repinta
   lo suyo detrás, con un turno de espera para que el valor nuevo ya
   esté guardado cuando se lea. */
if (l) l.addEventListener('click', function(){ setTimeout(pintar, 0) });
pintar();
})();
</script>
