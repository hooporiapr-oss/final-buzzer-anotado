/* ── El look nuevo: crema, navy y naranja ─────────────────────────
   El mismo de la portada y de mi-equipo. Cambia la piel; el marcado
   y el guion se quedaron como estaban. */
:root{
  --navy:#101c2a; --navy2:#192b3d; --orange:#ff7a18;
  --cream:#faf8f4; --ink:#1b2937; --muted:#617083;
  --linea:#e7e6e2; --bad:#b4231c; --good:#0b7a5a;
}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{width:min(720px,calc(100% - 40px));margin:0 auto}

header{background:var(--navy);color:#fff;border-bottom:1px solid #ffffff22;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0}
.mark{font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap}
.mark em{font-style:normal;color:#fff}
.mark i{font-style:normal;color:var(--orange)}
/* La marca pasó de una palabra a tres el 22 de octubre de 2026, y
   en la barra de 320px ya no cabía: con la hamburguesa y el botón
   de acción al lado pedía 339px de los 320 que hay.

   Se arregla por el ESPACIADO antes que por el tamaño. Dieciocho
   letras a .07em son casi veinte píxeles de aire, que es justo lo
   que sobraba; quitando casi todo ese aire la marca cabe sin tener
   que encogerla hasta que no se lea. El tamaño baja un poco también,
   pero poco. */
@media(max-width:380px){ .mark{font-size:.92rem} }
@media(max-width:430px){ .mark{font-size:.84rem;letter-spacing:.015em} }
.langb{border:1px solid #ffffff55;background:transparent;color:#fff;
  padding:8px 11px;border-radius:7px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.langb:hover{border-color:var(--orange);color:var(--orange)}

main .wrap{padding:38px 0 48px}
.kick{color:var(--orange);font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  font-size:.74rem;margin-bottom:10px}
h1{font-size:clamp(1.9rem,5.4vw,2.9rem);line-height:1.08;letter-spacing:-.045em;margin:0 0 14px}
h2{font-size:1.35rem;letter-spacing:-.028em;margin:38px 0 6px}
.lede{color:var(--muted);margin:0 0 26px;max-width:56ch;font-size:1.05rem}
.sub,.nota,.cp,.who{color:var(--muted)}

/* ── Los pasos, en tarjetas blancas ───────────────────────────── */
.how{display:grid;gap:14px;margin:0 0 30px;counter-reset:paso}
.how .s{counter-increment:paso;position:relative;background:#fff;border:1px solid var(--linea);
  border-radius:16px;padding:22px 24px 22px 60px;box-shadow:0 8px 25px #17243808}
.how .s::before{content:counter(paso);position:absolute;left:22px;top:22px;
  width:26px;height:26px;border-radius:50%;background:var(--orange);color:#111a24;
  font-size:.8rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.how .s b{display:block;font-size:1.08rem;font-weight:800;letter-spacing:-.018em;margin-bottom:5px}
.how .s span{color:var(--muted);font-size:.97rem}

/* ── El formulario ────────────────────────────────────────────── */
label{display:block;font-weight:700;font-size:.9rem;margin:18px 0 6px}
input[type=text],input[type=email],input[type=tel]{
  width:100%;padding:14px 15px;border:1px solid #d6d9d6;border-radius:10px;
  background:#fff;color:var(--ink);font:inherit;font-size:1.02rem}
input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,24,.18)}
.hint{color:var(--muted);font-size:.84rem;margin:6px 0 0}
.ok{display:flex;gap:11px;align-items:flex-start;margin:20px 0 0;
  font-size:.9rem;color:var(--muted);line-height:1.45}
.ok input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:var(--orange)}
.ok a{color:var(--navy);font-weight:700}
.ok span{cursor:pointer}

.btn,.cta{display:inline-block;border:0;border-radius:9px;padding:15px 24px;
  background:var(--orange);color:#111a24;font:inherit;font-weight:800;font-size:1.02rem;
  cursor:pointer;text-decoration:none;text-align:center}
.btn.go,.cta{width:100%;margin-top:22px}
.btn.line{background:transparent;color:var(--navy);border:1px solid var(--navy);margin-top:14px}
.btn.line:hover{background:var(--navy);color:#fff}
.btn:hover,.cta:hover{opacity:.92}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:13px 0 0;font-weight:700;font-size:.9rem;min-height:1.2em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--good)}

/* ── La letra chiquita del dinero ─────────────────────────────── */
.fine{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--navy);
  border-radius:16px;padding:20px 22px;margin:30px 0 0;box-shadow:0 8px 25px #17243808}
.fine b{display:block;font-size:.74rem;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.fine p{margin:0;color:var(--muted);font-size:.95rem}

/* ── Lo que se ve al enviar ───────────────────────────────────── */
.done{text-align:center;background:#fff;border:1px solid var(--linea);border-radius:16px;
  padding:clamp(26px,6vw,40px);box-shadow:0 8px 25px #17243808}
.done .tick{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;
  background:var(--orange);color:#111a24;font-size:1.7rem;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.done .lede{margin-left:auto;margin-right:auto}

footer{background:#0a1420;color:#aeb9c6;padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:.86rem}
footer a{color:#aeb9c6;text-decoration:none}
footer a:hover{color:var(--orange)}
.f-co{color:#fff;font-weight:700;margin:0 0 7px}
.f-what{margin:7px auto 0;font-size:.78rem;line-height:1.5;opacity:.75;max-width:54ch}
.f-dot{padding:0 8px;opacity:.45}

/* ══ La barra, el menú y el idioma ══════════════════════════════════
   Puesto al final de la hoja a propósito: lo que haya escrito arriba
   sobre header, .bar o .langb queda debajo de esto.

   --barra tiene que ser la MISMA altura en los dos sitios donde se
   usa: el hueco que deja scroll-padding para que un ancla no quede
   detrás de la cabecera, y el punto donde arranca el panel. */
:root{--barra:66px}
html{scroll-padding-top:calc(var(--barra) + 10px)}
/* overflow-x en el body y no sólo en html: en Safari de iOS, html
   solo no lo sujeta y basta un elemento ancho para arrastrar la
   página de lado. */
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:100;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{min-height:var(--barra);padding:0;gap:10px}
/* El botón del idioma dice el idioma AL QUE lleva, no el que está
   puesto. Por eso necesita sitio para una palabra y no para dos
   letras, y nowrap para que «Español» no se parta en dos líneas. */
.langb,#lang{white-space:nowrap;min-height:40px;font-size:.85rem;
  padding:0 12px;border-radius:9px;font-family:inherit}
.barra-dcha{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Las rayas se pintan con currentColor, no con blanco: prometer.html
   tiene la barra en crema con la marca en navy, y unas rayas
   blancas ahí no se ven. Heredando el color de la barra valen para
   las dos, y para la próxima página que cambie de fondo. Lo
   encontró una captura, no la prueba: la prueba miraba que el botón
   estuviera, no que se viera. */
/* El color de las rayas sale de la barra, y la barra de estas
   páginas no declaraba ninguno: heredaban la tinta del cuerpo
   —navy sobre navy— y el botón se veía con 1.2:1 de contraste,
   que es no verse. Barra navy, tinta blanca. */
header{color:#fff}
.hamb{display:none;width:44px;height:44px;flex:0 0 44px;color:inherit;
  border:1px solid currentColor;background:transparent;border-radius:9px;
  cursor:pointer;padding:0;align-items:center;justify-content:center}
@supports (border-color: color-mix(in srgb, currentColor 45%, transparent)){
  .hamb{border-color: color-mix(in srgb, currentColor 45%, transparent)}
}
.hamb:hover{border-color:var(--orange);color:var(--orange)}
/* color:inherit en la propia raya y no sólo en el botón: privacy
   y terms traen un `strong,b{color:var(--ink)}` para el texto, y
   currentColor dentro de un <b> resuelve al color DEL <b>, no al
   del padre. Las rayas salían navy sobre navy. */
.hamb b{display:block;width:20px;height:2px;color:inherit;
  background:currentColor;border-radius:2px;
  position:relative;transition:background .18s ease}
.hamb b::before,.hamb b::after{content:'';position:absolute;left:0;
  width:20px;height:2px;background:currentColor;border-radius:2px;transition:transform .18s ease}
.hamb b::before{top:-6px}
.hamb b::after{top:6px}
.hamb[aria-expanded="true"] b{background:transparent}
.hamb[aria-expanded="true"] b::before{transform:translateY(6px) rotate(45deg)}
.hamb[aria-expanded="true"] b::after{transform:translateY(-6px) rotate(-45deg)}

.menu{position:absolute;left:0;right:0;top:100%;
  display:flex;flex-direction:column;align-items:stretch;
  background:var(--navy);border-bottom:1px solid #ffffff22;
  /* Cerrado con max-height para que tenga transición, y con
     visibility para que el teclado no se meta dentro: max-height
     sola deja los enlaces tabulables en un panel invisible. */
  max-height:0;visibility:hidden;overflow:hidden;
  transition:max-height .22s ease,visibility .22s}
.menu.abierto{max-height:80vh;visibility:visible;overflow:auto}
.menu a{display:flex;align-items:center;min-height:52px;
  padding:0 max(20px,calc((100vw - 900px)/2 + 20px));
  color:#fff;text-decoration:none;font-weight:600;font-size:1rem;
  border-top:1px solid #ffffff14}
.menu a:first-child{border-top:0}
.menu a:hover{color:var(--orange)}
.menu a.cta{margin:14px 20px 18px;justify-content:center;border-top:0;
  background:var(--orange);color:#111a24;font-weight:800;border-radius:9px}
.menu a.cta:hover{color:#111a24}
/* Las rayas se ven siempre: estas páginas no tienen enlaces en la
   barra en ningún tamaño, así que el menú es la única puerta y
   esconderlo en escritorio dejaría la página sin salida otra vez. */
.hamb{display:flex}
@media(max-width:430px){
:root{--barra:60px}
.langb,#lang{padding:0 10px;font-size:.8rem}
}
</style>

function rpc(name, args){
  return fetch(SB_URL + '/rest/v1/rpc/' + name, {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args || {})
  }).then(function(r){
    if (r.ok) return r.json();
    /* El cuerpo de un error de PostgREST trae el porqué —message,
       hint, details— y tirarlo era lo que convertía cada fallo en
       una visita al editor de SQL: la página sabía exactamente qué
       había pasado y enseñaba "no se pudo". Se lee antes de lanzar. */
    return r.text().then(function(t){
      var d = {}; try { d = JSON.parse(t) } catch(x){}
      var e = new Error(d.message || d.hint || t || ('rpc ' + r.status));
      e.detalle = d.details || d.hint || '';
      e.codigo  = d.code || r.status;
      throw e;
    });
  });

/* El porqué, cuando lo hay. Un mensaje amable que no dice nada manda
   a alguien a buscar en la base; el mismo mensaje con la razón
   detrás se arregla solo. Se recorta: esto es una línea de aviso, no
   un registro. */
function porque(x){
  if (!x) return '';
  var r = (typeof x === 'string') ? x
        : (x.why || x.error || x.message || x.hint || x.detalle || '');
  return r ? ' — ' + String(r).slice(0, 160) : '';
}
}

var LANG='es';
try{ LANG = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') || localStorage.getItem('fc-lang') ||
  ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en'); }catch(e){}

function T(k,v){
  var s = (S[LANG] && S[LANG][k]) || S.es[k] || '';
  if (v) Object.keys(v).forEach(function(x){ s = s.split('{'+x+'}').join(v[x]); });
  return s;
}
function toggleLang(){
  LANG = LANG==='es' ? 'en':'es';
  try{ localStorage.setItem('cfh_lang', LANG), localStorage.setItem('cp-lang', LANG), localStorage.setItem('fc-lang', LANG); }catch(e){}
  document.getElementById('langBtn').textContent = LANG==='es' ? 'English':'Español';
  draw();
}

var app = document.getElementById('app');
var SENT = null;

function esc(s){
  return String(s==null?'':s).replace(/[&<>"\']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function draw(){
  if (SENT){
    app.innerHTML =
      '<div class="done">' +
        '<div class="tick">✓</div>' +
        '<h1>' + T('doneH') + '</h1>' +
        '<p class="lede">' + T('doneP', { E: esc(SENT) }) + '</p>' +
      '</div>';
      /* AQUÍ IBA UN BOTÓN PARA VER UN TABLERO DE EJEMPLO.

         Estaba roto de tres maneras a la vez y daba 404 justo
         después de que alguien se apuntara, que es el peor momento
         para que algo no funcione:

           · apuntaba a scoreboard.html, y esa página no existe en
             este repo — se llama tablero.html
           · llevaba un id de campaña, y tablero.html espera un id de
             RETO: la misma letra 'c' quiere decir cosas distintas
             según la página
           · y ese id era el de la campaña de demostración, que se
             borró esta mañana con el resto de los datos de prueba

         Enseñar un tablero de verdad vale, pero hace falta una
         campaña de demostración permanente que las limpiezas no se
         lleven. Mientras no exista, no hay botón: un enlace roto
         dice más de nosotros que la falta del enlace. */
    return;
  }

  app.innerHTML =
    '<div class="kick">' + T('kick') + '</div>' +
    '<h1>' + T('h1') + '</h1>' +
    '<p class="lede">' + T('lede') + '</p>' +

    '<div class="how">' +
      '<div class="s"><b>' + T('s1b') + '</b><span>' + T('s1') + '</span></div>' +
      '<div class="s"><b>' + T('s2b') + '</b><span>' + T('s2') + '</span></div>' +
      '<div class="s"><b>' + T('s3b') + '</b><span>' + T('s3') + '</span></div>' +
      '<div class="s"><b>' + T('s4b') + '</b><span>' + T('s4') + '</span></div>' +
    '</div>' +

    '<h2>' + T('formH') + '</h2>' +
    '<label for="tm">' + T('teamL') + '</label>' +
    '<input id="tm" type="text" maxlength="60" placeholder="' + T('teamPh') + '" ' +
      'autocapitalize="words" enterkeyhint="next">' +
    '<label for="pg">' + T('progL') + '</label>' +
    '<input id="pg" type="text" maxlength="60" placeholder="' + T('progPh') + '" ' +
      'autocapitalize="words" autocomplete="organization" enterkeyhint="next">' +
    '<label for="nm">' + T('nameL') + '</label>' +
    '<input id="nm" type="text" maxlength="60" placeholder="' + T('namePh') + '" ' +
      'autocomplete="name" autocapitalize="words" enterkeyhint="next">' +
    '<label for="em">' + T('emailL') + '</label>' +
    '<input id="em" type="email" maxlength="80" placeholder="' + T('emailPh') + '" ' +
      'autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="next">' +
    '<label for="ph">' + T('phoneL') + '</label>' +
    '<input id="ph" type="tel" maxlength="25" placeholder="' + T('phonePh') + '" ' +
      'autocomplete="tel" enterkeyhint="done">' +

    '<div class="ok">' +
      '<input id="lc" type="checkbox">' +
      '<span onclick="document.getElementById(\'lc\').click()">' + T('lic') + '</span>' +
    '</div>' +
    '<div class="ok">' +
      '<input id="cu" type="checkbox">' +
      '<span onclick="document.getElementById(\'cu\').click()">' + T('custody') + '</span>' +
    '</div>' +
    '<div class="ok">' +
      '<input id="tc" type="checkbox">' +
      '<span onclick="document.getElementById(\'tc\').click()">' + T('terms') + '</span>' +
    '</div>' +
    '<button class="btn" onclick="send()">' + T('go') + '</button>' +
    '<p class="msg" id="msg"></p>' +

    '<div class="fine"><b>' + T('fineH') + '</b><p>' + T('fineP') + '</p></div>';
}

function say(t,c){
  var el = document.getElementById('msg');
  if (el){ el.textContent = t; el.className = 'msg ' + (c||''); }
}

function send(){
  var team  = (document.getElementById('tm').value || '').trim();
  var prog  = (document.getElementById('pg').value || '').trim();
  var name  = (document.getElementById('nm').value || '').trim();
  var email = (document.getElementById('em').value || '').trim();
  var phone = (document.getElementById('ph').value || '').trim();

  if (!team) return say(T('errTeam'), 'bad');
  if (!prog) return say(T('errProg'), 'bad');
  if (!name || email.indexOf('@') === -1) return say(T('errWho'), 'bad');

  /* La licencia primero: es la unica casilla que lleva un numero
     dentro, y facturarle a alguien que nunca lo vio seria nuestro
     problema, no suyo. */
  var lc = document.getElementById('lc');
  if (!lc || !lc.checked) return say(T('errLic'), 'bad');

  var cu = document.getElementById('cu');
  if (!cu || !cu.checked) return say(T('errCustody'), 'bad');

  var ok = document.getElementById('tc');
  if (!ok || !ok.checked) return say(T('errTerms'), 'bad');

  say('…');
  rpc('bw_request_team', {
    p_team: team, p_program: prog, p_name: name, p_email: email,
    p_phone: phone, p_terms: true, p_custody: true
  })
  .then(function(r){
    if (!r || !r.ok){
      if (r && r.reason === 'taken')   return say(T('errTaken'), 'bad');
      if (r && r.reason === 'pending') return say(T('errPending'), 'bad');
      return say(T('errGen'), 'bad');
    }
    SENT = email;
    draw();

    /* De qué producto es esta solicitud. Los dos productos escriben
       en bw_requests, y sin esto una inscripción de Cada Punto Cuenta le llega
       al admin idéntica a una de Cada Punto Cuenta.

       Va después de draw() y en best-effort a propósito: el
       entrenador ya vio que entró, y si request_product no existe
       todavía en la base —el SQL es anotado-producto.sql— lo único
       que pasa es que la etiqueta no se pone. La inscripción no se
       cae por esto. */
    rpc('request_product', { p_email: email, p_product: 'anotado' })
      .catch(function(e){ console.error('request_product', e) });

    /* El acuse de la licencia, guardado. Va aparte y despues de que
       la solicitud entro: si esto falla, el equipo ya quedo inscrito
       igual. El correo al admin lo lleva tambien, asi que el acuse
       existe en dos sitios y no en ninguno. */
    rpc('license_record', { p_email: email, p_by: name, p_terms: T('lic') })
      .catch(function(e){ console.error('license_record', e) });

    fetch(SERVER + '/team-signup', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ team: team, program: prog, coach: name,
                             email: email, phone: phone,
                             /* Quien acepto la licencia, cuando, y
                                que decia exactamente la version que
                                vio. Si algun dia se discute una
                                factura, esto es lo que hay. */
                             license: { accepted: true, by: name,
                                        at: new Date().toISOString(),
                                        terms: T('lic') } })
    }).catch(function(e){ console.error('notice', e); });
    try{ var _m = document.querySelector('main'); if (_m) _m.scrollTop = 0; window.scrollTo(0, 0); }catch(e){}
  })
  .catch(function(e){ console.error(e); say(T('errGen') + porque(e), 'bad'); });
}

document.getElementById('langBtn').textContent = LANG==='es' ? 'English':'Español';
draw();
</script>
<script>
/* El <html lang> no se tocaba en esta página: un lector de
   pantalla leía el español con fonemas ingleses. */
(function(){ try{
  var k = localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang')
        || localStorage.getItem('fc-lang');
  if (k) document.documentElement.lang = k;
}catch(e){} })();

<script>
/* ══ El menú de la barra ════════════════════════════════════════════
   Vive aparte del sistema de idioma de cada página a propósito: son
   doce páginas con cuatro formas distintas de pintar sus textos, y
   engancharse a cada una sería cuatro maneras de romperse. Esto lee
   el idioma de donde lo deja todo el mundo —localStorage— y pinta
   sus seis enlaces y nada más. */
(function(){
var ROTULOS = {
  en: { inicio:'Home', como:'How it works', precio:'What it costs',
        ayuda:'Questions', mia:'My program', alta:'Sign up a program',
        menu:'Menu', otro:'Español', aOtro:'Cambiar a español' },
  es: { inicio:'Inicio', como:'Cómo funciona', precio:'Cuánto cuesta',
        ayuda:'Preguntas', mia:'Mi programa', alta:'Registra un programa',
        menu:'Menú', otro:'English', aOtro:'Switch to English' }
};
function idioma(){
  try{
    return localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
           localStorage.getItem('fc-lang') ||
           ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en');
  }catch(e){ return 'es' }
}
var b = document.getElementById('hamb'),
    m = document.getElementById('menu'),
    l = document.getElementById('langBtn') || document.getElementById('lang');
if (!b || !m) return;

function pintar(){
  var t = ROTULOS[idioma()] || ROTULOS.es;
  m.querySelectorAll('[data-m]').forEach(function(a){
    a.textContent = t[a.getAttribute('data-m')] || a.textContent;
  });
  b.setAttribute('aria-label', t.menu);
  /* El botón del idioma lo pinta la propia página, cada una a su
     manera. Aquí sólo se corrige si se quedó con las dos letras
     viejas, para que ninguna página diga «EN» mientras las demás
     dicen «English». */
  if (l && /^(EN|ES)$/.test((l.textContent||'').trim())) {
    l.textContent = t.otro;
    l.setAttribute('aria-label', t.aOtro);
  }
}
function pon(abierto){
  m.classList.toggle('abierto', abierto);
  b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
}
b.addEventListener('click', function(){
  pon(b.getAttribute('aria-expanded') !== 'true');
});
m.addEventListener('click', function(e){ if (e.target.closest('a')) pon(false) });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') {
    pon(false); b.focus();
  }
});
/* Al pulsar el idioma, la página repinta lo suyo; el menú repinta
   lo suyo detrás, con un turno de espera para que el valor nuevo ya
   esté guardado cuando se lea. */
if (l) l.addEventListener('click', function(){ setTimeout(pintar, 0) });
pintar();
})();
</script>
