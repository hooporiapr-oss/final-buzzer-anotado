<style>
/* ══════════════════════════════════════════════════════════════════
   FORTRESS EN LA CANCHA — CASCO, TELÉFONO Y COMPUTADORA

   Esta página ocupa el sitio de la primera fortress-vr, la que
   intentaba entrar en VR de verdad. Aquélla se quedó por el camino, y
   lo que valía de ella está aquí: el piso, las líneas, el aro, las
   cinco bolas del 2-1-2 puestas de pie delante de uno, y la medida de
   la cabeza. Donde abajo dice "la vieja", es ésa.

   El juego es el de fortress.html nota por nota — la misma rotación, las mismas
   cornetas, los mismos puntos triangulares — para que una cadena de 7
   signifique lo mismo aquí, en el casco y en el juego de tocar.

   Lo que NO lleva, y es a propósito:

   · Nada de WebXR. Ya sabemos lo que da el casco y no es eso.
   · Nada de giroscopio ni de medir la cabeza. Aquí hay un dedo y hay
     un ratón: son mejores que la cabeza y no hay que calibrar nada.
   · Nada de aguantar la vista. Se toca la bola y ya. Lo de aguantar
     existe en el casco porque allí no hay dedo; traerlo aquí sería
     hacer el juego más lento a cambio de nada.
   · Nada de punto de mira. En el teléfono apuntas con el dedo y en la
     computadora ya hay un cursor dibujado por el sistema.
   · Nada de panel dentro de la escena. Eso era para leerlo con el
     casco puesto. Aquí el marcador es HTML encima del lienzo: se lee
     mejor, y de paso desaparece el problema que tumbaba a salida.html
     — repintar una textura en cada cuadro freía la tarjeta del
     teléfono.

   LA CÁMARA NO SE MUEVE, y eso es la decisión que hace que esto
   funcione en cualquier pantalla. Las cinco bolas no van a
   coordenadas fijas: se colocan calculando por dónde pasa el rayo de
   cada esquina de la pantalla de ESTE aparato. En un teléfono de pie
   la zona se cierra, en una computadora ancha se abre, y las cinco
   quedan siempre a la vista y siempre alcanzables. En el casco hay
   que girar la cabeza porque allí la cabeza es el mando; aquí girar
   no aporta nada y, si alguien gira y se pierde, se queda trancado.
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
/* Esto no es adorno. 'hidden' esconde una cosa poniéndole
   display:none desde el navegador, y CUALQUIER regla nuestra que diga
   display gana por encima de eso. #hud dice display:flex y #mira
   también, así que esconderlos no escondía nada: el marcador se
   quedaba asomando por detrás de la pantalla del final y el punto de
   mira vivía pegado a la esquina aunque se jugara con el dedo. Las
   pruebas no lo vieron porque preguntaban si la propiedad estaba
   puesta, y lo estaba — lo que no pasaba es que se viera. */
[hidden]{display:none !important}
html,body{height:100%;overflow:hidden;background:#0B1724;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;
  touch-action:manipulation}

/* ── El marcador. Encima del lienzo y sin robar toques. ─────────── */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;color:#fff}
#hud .col{text-align:center;min-width:72px}
#hud .n{display:block;font-weight:900;font-size:clamp(1.5rem,6vw,2.2rem);
  line-height:1;letter-spacing:-.02em}
#hud .k{display:block;font-size:.62rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:#7F93A6;margin-top:3px}
#hud .centro{display:flex;flex-direction:column;align-items:center;gap:7px;
  flex:0 1 auto;min-width:0}
/* El reloj de la tanda. Cifras de ancho fijo: si no, el marcador
   tiembla de un segundo a otro y no hay nada que distraiga más. */
#reloj{font-weight:900;font-size:clamp(1.5rem,6vw,2.2rem);line-height:1;
  letter-spacing:.01em;font-variant-numeric:tabular-nums;color:#fff}
#reloj.poco{color:#FFC247}
#reloj.nada{color:#FF5A4A}
#estado{font-weight:900;font-size:clamp(.78rem,3.2vw,1.05rem);letter-spacing:.09em;
  padding:8px 14px;border-radius:999px;background:rgba(5,14,24,.72);
  color:#FFC247;text-align:center;white-space:nowrap}
#estado.tu{color:#6FD83C}
#estado.listo{color:#6FD83C;background:rgba(5,14,24,.9)}

/* Un teléfono acostado deja 390 puntos de alto y el marcador se come
   el tablero. Se encoge y deja de estorbar. */
@media (max-height:470px){
  #hud{padding-top:6px}
  #hud .n{font-size:1.25rem}
  #hud .k{font-size:.56rem}
  #estado{font-size:.72rem;padding:5px 10px}
  #reloj{font-size:1.25rem}
  #hud .centro{gap:4px}
}
/* El padding no es adorno: con left:0;right:0 a secas la línea llega
   hasta el filo del cristal, y desde que lleva delante el nombre de
   la zona es larga de verdad — en un teléfono de pie parte en dos y
   la primera mitad acaba tocando el borde. */
#pista{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));
  z-index:5;pointer-events:none;text-align:center;color:#5E7488;
  padding:0 16px;font-size:.72rem;font-weight:800;letter-spacing:.04em}

/* ── La portada y el final. Mismo molde. ────────────────────────── */
.capa{position:fixed;inset:0;z-index:10;background:rgba(11,23,36,.94);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:13px}
.capa h1{font-size:clamp(1.7rem,7vw,2.9rem);font-weight:900;letter-spacing:-.02em}
.capa h1 em{font-style:normal;color:#FF7A18}
.capa p{color:#C8D6E2;font-size:.98rem;max-width:36ch;line-height:1.55}
.capa small{color:#7F93A6;font-size:.78rem;max-width:34ch;line-height:1.5}
/* Los tres tienen que parecer botones. Dos de ellos eran un borde
   fino sobre el fondo y, puestos debajo de un párrafo, se leían como
   una línea más de texto: nadie los tocaba porque no parecían tocables.
   Ahora los tres llevan fondo propio, el mismo ancho y la misma
   altura — se ven como un juego de tres cosas que se pueden apretar,
   y el color dice cuál es cuál. */
.capa button{background:#FF7A18;color:#0B1724;border:2px solid #FF7A18;border-radius:8px;
  font:inherit;font-weight:900;font-size:1.05rem;padding:15px 24px;cursor:pointer;
  min-width:min(320px,82vw);line-height:1.25;
  box-shadow:0 8px 22px rgba(0,0,0,.38);transition:transform .08s ease}
.capa button:active{transform:translateY(1px)}
.marca{font-size:1.6rem;font-weight:900;line-height:1;color:#6FD83C}
.grande{font-size:clamp(3.4rem,18vw,6rem);font-weight:900;line-height:.95;
  color:#FF7A18;letter-spacing:-.03em}
.capa button.otro{background:#16293F;color:#EAF4FB;border-color:#3C566F;font-size:1rem}
.capa button.casco{border-color:#8A6A2A;color:#F0E2C6}
/* Cada botón dice debajo para qué aparato es, porque "Empezar" a secas
   en una página que se llama VR se lee como "empezar el casco". El
   aviso va pegado al botón y encima de la explicación: ahí se lee
   antes de apretar, y no después. */
.capa .req{color:#FFC247;font-size:.72rem;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;margin-top:-4px}
.capa .req.mod{color:#8EA3B5}
#cuenta{color:#6FD83C;font-weight:900;font-size:.95rem;letter-spacing:.06em;min-height:1.2em}

/* ── La caja de cuartos ─────────────────────────────────────────────
   Q1 Q2 Q3 Q4 y el total, como un marcador de verdad. Un padrino que
   mira esto entiende el juego sin que nadie se lo explique, y el nene
   ve de un vistazo cuál tiene que superar. */
.caja{display:flex;gap:2px;justify-content:center;margin:4px 0 2px}
.caja div{min-width:54px;padding:7px 4px;background:rgba(255,255,255,.05);
  border-radius:4px;text-align:center}
.caja div.tot{background:rgba(255,122,24,.16)}
.caja div.vivo{background:rgba(111,216,60,.18)}
.caja b{display:block;font-size:.58rem;font-weight:900;letter-spacing:.1em;
  color:#7F93A6;text-transform:uppercase}
.caja span{display:block;font-size:1.15rem;font-weight:900;line-height:1.25;
  font-variant-numeric:tabular-nums;color:#fff}
.caja div.tot span{color:#FF7A18}
.caja div.cero span{color:#5A6B7C}
#tanda{color:#7F93A6;font-weight:800;font-size:.82rem;letter-spacing:.06em}

/* ── El punto de mira ───────────────────────────────────────────────
   Un aro fino siempre visible que dice dónde está la cabeza apuntando,
   y dentro un disco que se llena mientras aguantas la vista: el tiempo
   que falta para que la bola cuente. Sin esto el modo cabeza parece
   muerto — mirar no deja rastro, y el que juega no sabe si el juego
   lo está viendo. */
#mira{position:fixed;left:0;top:0;z-index:6;pointer-events:none;
  width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  border:2px solid rgba(255,255,255,.8);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .12s linear}
#mira.sobre{border-color:#fff;transform:scale(1.25)}
#mira i{display:block;width:16px;height:16px;border-radius:50%;background:#6FD83C;
  transform:scale(0)}
#crudo{position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));
  z-index:6;pointer-events:none;font:700 .62rem/1.4 monospace;
  color:#3E5468;letter-spacing:.04em}
#lang{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:12;
  border:1px solid #33465A;background:rgba(11,23,36,.6);color:#C8D6E2;border-radius:999px;
  padding:7px 14px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}
/* Volver a la portada. Enfrente del botón de idioma, con su misma
   pinta, y sólo se ve cuando hay algo que leer: en la portada y en
   la pantalla de final. Mientras se juega no está, que un toque sin
   querer en una esquina no se lleve una corrida oficial. */
#atras{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:12;
  border:1px solid #33465A;background:rgba(11,23,36,.6);color:#C8D6E2;border-radius:999px;
  padding:7px 14px;font:inherit;font-size:.72rem;font-weight:800;text-decoration:none}
/* Y el de abajo, el que no sale del tablero: devuelve a la portada
   de ESTA página, que es de donde salen los dos juegos. Centrado
   abajo, que es donde la mano ya está. */
#volver{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(9px + env(safe-area-inset-bottom,0px));z-index:12;
  border:1px solid #33465A;background:rgba(11,23,36,.82);color:#C8D6E2;
  border-radius:999px;padding:9px 18px;font:inherit;font-size:.72rem;
  font-weight:800;cursor:pointer}
/* Con el botón puesto, la pista sube: si no, el texto de "tu mejor"
   le queda justo debajo y se leen como una sola cosa. */
body.conVolver #pista{bottom:calc(50px + env(safe-area-inset-bottom,0px))}
/* La foto de la marca, arriba de la portada.

   El height:auto no es relleno: el atributo height="630" del <img>
   llega como alto fijo, y aspect-ratio sólo manda cuando uno de los
   dos lados es auto. Sin él la caja sale de 630 de alto y el
   object-fit:cover recorta por arriba — justo donde está el 21.

   Y se va sola en pantalla baja: en un teléfono tumbado o dentro del
   casco lo que hace falta es el botón de empezar, y una foto que lo
   empuja fuera de la vista es peor que no tener foto. */
#tapaFoto{width:100%;max-width:520px;height:auto;aspect-ratio:1200/630;
  object-fit:cover;border-radius:14px;display:block;background:#1b2937;
  border:1px solid #ffffff1f;box-shadow:0 18px 50px #0006;margin-bottom:4px}
@media (max-height:640px){ #tapaFoto{display:none} }
</style>
</head>

<a id="atras" href="index.html">&larr; Inicio</a>
<button id="lang">EN</button>

<div id="hud" hidden>
  <div class="col"><span class="n" id="hNivel">0</span><span class="k" id="kNivel">cadena</span></div>
  <div class="centro">
    <div id="reloj">5:00</div>
    <div id="estado">MIRA</div>
  </div>
  <div class="col"><span class="n" id="hPts">0</span><span class="k" id="kPts">puntos</span></div>
</div>
<div id="pista" hidden></div>

<!-- El punto de mira del modo cabeza. Va en HTML y no dentro de la
     escena: es un círculo, y un círculo de CSS no cuesta ni un cuadro
     de pintado. -->
<div id="mira" hidden><i></i></div>
<div id="crudo" hidden></div>
<button id="volver" hidden></button>

<div class="capa" id="tapa">
  <img id="tapaFoto" src="hooporia-share.jpg" width="1200" height="630"
       loading="eager" decoding="async"
       alt="Un nene tira al aro al atardecer y su puntuación sube: 1, 3, 6, 10, 15, 21">
  <h1>Fortress <em>en la cancha</em></h1>
  <div class="marca" id="tapaQuien" hidden></div>
  <p id="tapaP"></p>
  <div class="caja" id="cajaTapa" hidden></div>

  <button id="go"></button>
  <button id="goAmistoso" class="otro"></button>

<div class="capa" id="medida" hidden>

<div class="capa" id="fin" hidden>

  <p id="finP"></p>
  <button id="otra"></button>
  <button id="practicar" class="otro" hidden></button>
  <div id="cuenta"></div>
  <div id="tanda"></div>
  <small id="finS"></small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* Cuánto dura la tanda, dicho en palabras. Estaba escrito a mano —
   "tus 5 minutos" — y con ?min=3 la página mentía. */
function cuantoDura(){
  /* Lo que dura DE VERDAD esta tanda, que en demostración es un
     minuto y no cinco. Leía SESION_MS a secas y la portada prometía
     cinco minutos antes de un cuarto de uno. */
  var ms=duracionSesion();
  var min=ms/60000;
  if(min>=1 && min===Math.round(min))
    return T(min===1?'minuto1':'minutos').replace('{N}',min);
  var seg=Math.round(ms/1000);
  if(seg<60) return T('segundos').replace('{N}',seg);
  return Math.floor(seg/60)+':'+('0'+(seg%60)).slice(-2);
}

/* ── Los dos botones de volver, y cuándo se ve cada uno ───────────
   Son dos cosas distintas en dos momentos distintos.

   · #atras, arriba, SALE del tablero: se va a la portada del sitio.
     Se ve cuando hay algo que leer —la portada de este tablero o la
     pantalla de final— y no se ve jugando.

   · #volver, abajo, NO sale a ningún sitio: devuelve a la portada
     de esta misma página, que es de donde salen los dos juegos (la
     práctica y el scrimmage). Y por eso no es un enlace: recargar
     la página sería volver a bajar three.js y perder la tanda. Se
     ve justo al revés que el otro, mientras se juega.

   Jugando, pero sólo en esos dos juegos abiertos. En una corrida
   oficial no está: esa corrida es una sola en la vida de ese reto y
   un toque en una esquina no se la puede llevar. Con el casco
   puesto tampoco, que ahí no hay dónde tocar.

   Los dos se atan al estado de las capas en vez de apagarse a mano
   en cada sitio: la portada, el final y el marcador se encienden y
   se apagan en una docena de puntos del fichero, y el que se olvide
   de uno deja un botón encima del juego. Así no hay nada que
   recordar. */
(function botonesVolver(){
  var atras=$('atras'), volver=$('volver'),
      tapa=$('tapa'), fin=$('fin'), hud=$('hud');
  function ver(){
    atras.style.display=(!tapa.hidden||!fin.hidden)?'':'none';
    var jugando=!hud.hidden && MODO!=='cabeza' && !JUEGO;
    volver.hidden=!jugando;
    document.body.classList.toggle('conVolver', jugando);
  }
  if(window.MutationObserver){
    var o=new MutationObserver(ver);
    [tapa,fin,hud].forEach(function(el){
      o.observe(el,{attributes:true,attributeFilter:['hidden']});
    });
  }
  volver.onclick=function(){
    volverAPortada();
    /* El de idioma se esconde al arrancar la tanda. Si vuelve la
       portada, vuelve él: es la única pantalla donde se usa. */
    $('lang').style.display='';
    ver();
  };
  ver();
})();

//  LA ZONA SE MUEVE COMO SE MUEVE DE VERDAD
//
//  El balón pasa al de al lado o al del medio; lo único que no pasa
//  nunca es el salto en diagonal. Y la primera bola sale por donde
//  sube el balón.
//
//  El mapa de pases ya no vive aquí: vive en cada zona, arriba en
//  ZONAS, porque cada una tiene el suyo. Lo que sí vive aquí es la
//  regla de que se lee de la zona que se está jugando y de ninguna
//  otra — mismo mapa que fortress.html, zona por zona, porque si la
//  rotación fuera distinta una cadena de 7 no significaría lo mismo
//  en los dos sitios y el padrino pagaría por un número que cambia
//  de tablero.
// ══════════════════════════════════════════════════════════════════
function nextInRotation(prev){
  var z=zona();
  if(prev===undefined||prev===null)
    return z.entrada[Math.floor(Math.random()*z.entrada.length)];
  var opts=z.pases[prev]||[0,1,2,3,4];
  return opts[Math.floor(Math.random()*opts.length)];
}

// Puntos triangulares: llegar a 7 vale mucho más que siete veces 1.
function pointsFor(level){ return level>0 ? (level*(level+1))/2 : 0 }

/* Las notas de corneta. La posición manda, no el color: una esquina
   canta siempre la misma nota, y eso es lo que convierte un patrón en
   una tonada que se queda. 110 × 2,3,4,5,6 — serie armónica. */
var TONES=[220,330,440,550,660];
var audioCtx=null;
function abrirAudio(){
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)() }catch(e){}
}
function playTone(i){
  if(!audioCtx)return;
  var f=TONES[i%TONES.length], now=audioCtx.currentTime;
  try{
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(f,now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(.3,now+0.012);
    g.gain.exponentialRampToValueAtTime(.0001,now+0.30);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(now);o.stop(now+0.32);
  }catch(e){}
}
function playThump(){
  if(!audioCtx)return;
  var now=audioCtx.currentTime;
  try{
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(90,now);
    o.frequency.exponentialRampToValueAtTime(42,now+0.13);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(.45,now+0.008);
    g.gain.exponentialRampToValueAtTime(.0001,now+0.16);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(now);o.stop(now+0.18);
  }catch(e){}
}
