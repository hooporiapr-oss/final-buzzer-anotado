var scene,camera,renderer,raycaster;
var balls=[];
var OJO=1.55;              // altura de los ojos, de pie
var RADIO_GEO=0.36;        // el radio con que se hace la esfera; la
                           // escala la ajusta luego a la pantalla

/* ══════════════════════════════════════════════════════════════════
   DÓNDE VAN LAS CINCO BOLAS

   No en coordenadas fijas. En la vieja lo eran porque allí se giraba
   la cabeza para alcanzarlas, y con eso el ancho de la pantalla daba
   igual. Aquí la cámara está clavada, así que coordenadas fijas
   significan que en un teléfono de pie dos bolas quedan fuera del
   borde — y una bola fuera del borde no es difícil, es imposible.

   Así que la zona se describe en ÁNGULOS desde el ojo, y el ancho de
   esos ángulos lo decide la pantalla de este aparato: en un teléfono
   de pie la zona se cierra, en un monitor ancho se abre, y las cinco
   quedan siempre dentro del borde.

   Con un tope, que es lo que enseñó la primera prueba: dejando que la
   zona se abriera hasta llenar el monitor, las bolas de los lados
   salían estiradas en óvalos contra el borde — una esfera mirada de
   muy reojo se proyecta así, y parecían otra cosa. 23 grados es hasta
   donde una bola sigue pareciendo una bola. Pasado eso la zona no se
   abre más y queda centrada.

   ──────────────────────────────────────────────────────────────────
   CUATRO ZONAS, UNA POR CUARTO

   Antes había una sola: el 2-1-2, los cuatro cuartos. Jugándolo se
   nota — la mano aprende dónde están las cinco en el primer cuarto y
   los otros tres son el mismo cuarto otra vez.

   Ahora cada cuarto se juega en una zona distinta: Q1 el 2-1-2, Q2 el
   1-3-1, Q3 el 2-3, Q4 el 3-2. Son cuatro zonas de verdad, de las que
   un entrenador reconoce de un vistazo. Lo que aprendiste en Q1 no te
   sirve en Q2, y ahí se acaba la monotonía.

   LO QUE NO PUEDE CAMBIAR, Y ES TODO EL ASUNTO: lo que vale una
   cadena. Un padrino promete por punto, así que si una zona fuera más
   fácil que otra, el mismo esfuerzo valdría distinto dinero según el
   cuarto. Las cuatro están construidas con la MISMA dificultad, y eso
   no es una opinión — son tres números iguales en las cuatro:

     · ramificación {3,3,3,3,4} — cada bola puede pasar a tres, menos
       la del centro que ayuda a las cuatro
     · dos parejas excluidas, siempre las diagonales largas
     · dos bolas de entrada, por donde sube el balón

   Y EL ORDEN ES FIJO, el mismo para todo el mundo. Sorteadas, un nene
   le tocaría una tanda más fácil que a otro y sus padrinos pagarían
   más por lo mismo. Fijas es como cuatro cuartos de un partido: a
   todos les toca la misma cancha.

   ──────────────────────────────────────────────────────────────────
   Y DOS FORMAS DE CRECER — `nueva`

   Dos cuartos CRECEN (nueva:false). La cadena de la ronda es la de la
   ronda anterior más un destello al final. Es lo que hacía siempre:
   cada ronda tienes una sola cosa nueva que aprender y las anteriores
   te las han repetido una vez por ronda.

   Dos cuartos SE RENUEVAN (nueva:true). La cadena crece igual —en la
   ronda 7 son siete— pero es OTRA cadena entera, trazada de nuevo por
   la zona. No te repiten nada: cada ronda es un recuerdo en frío.

   Q1 crece · Q2 renueva · Q3 crece · Q4 renueva. Alternando, ningún
   cuarto se parece al anterior, y el último del partido es de los
   duros, que es como se acaban los partidos.

   ESTO SÍ MUEVE EL DINERO, y hay que decirlo claro: una cadena en
   frío llega menos lejos que una que te han repetido seis veces. Los
   cuartos que renuevan van a puntuar más bajo que los que crecen, y
   como el padrino promete por punto, una corrida con dos cuartos así
   recauda menos que una de cuatro que crecen. No es injusto —a todo
   el mundo le tocan los mismos cuatro cuartos— pero es otro precio.
   Si los números salen demasiado bajos jugándolo, la compensación de
   una línea es enseñar la cadena DOS VECES en los cuartos que
   renuevan: sigue siendo nueva cada ronda y vuelve a ser recordable.

   prueba-demo.js comprueba los tres números en las cuatro. Si alguien
   añade una quinta zona y le sale la ramificación torcida, la prueba
   lo para antes de que repique un precio.
   ══════════════════════════════════════════════════════════════════ */
var TOPE_GIRO=23, TOPE_ALTO=16;   // grados
var ZONAS=[
  /* ── Q1 · EL 2-1-2 ──────────────────────────────────────────────
             0       1
                 2
           3           4
     Dos arriba, uno en el medio, dos abajo. Es la de siempre, sin
     tocarle una coma: los números de abajo son los que estaban. */
  { nombre:'2-1-2', nueva:false,
    abanico:[ [-0.66, 1.00], [ 0.66, 1.00], [ 0.00, 0.07],
              [-1.00,-0.90], [ 1.00,-0.90] ],
    pases:{ 0:[1,2,3], 1:[0,2,4], 2:[0,1,3,4], 3:[0,2,4], 4:[1,2,3] },
    entrada:[0,1],          // el balón sube por arriba
    centro:2,
    fila:[3,0,2,1,4] },

  /* ── Q2 · EL 1-3-1 ──────────────────────────────────────────────
                 0
           1     2     3
                 4
     El punto arriba, tres cruzados en el medio, uno en la línea de
     fondo. Las diagonales que no pasan nunca: el punto con el de
     fondo (0-4), y ala con ala sin pasar por el medio (1-3).
     El balón entra por las alas: se sube por un lado y el ala lo
     recoge. Dos entradas, las mismas que el 2-1-2 — si entrara sólo
     por el punto, el primer destello sería siempre el mismo y habría
     un bit menos que recordar que en los otros tres cuartos. */
  { nombre:'1-3-1', nueva:true,
    abanico:[ [ 0.00, 1.00], [-1.00, 0.07], [ 0.00, 0.07],
              [ 1.00, 0.07], [ 0.00,-0.90] ],
    pases:{ 0:[1,2,3], 1:[0,2,4], 2:[0,1,3,4], 3:[0,2,4], 4:[1,2,3] },
    entrada:[1,3],
    centro:2,
    fila:[1,0,2,3,4] },

  /* ── Q3 · EL 2-3 ────────────────────────────────────────────────
             0       1
           2     3     4
     Dos arriba y tres atrás. El que ayuda a los cuatro lados es el
     del fondo del medio, el 3 — en un 2-3 ése es el que no para.
     Diagonales excluidas: 0-4 y 1-2. */
  { nombre:'2-3', nueva:false,
    abanico:[ [-0.70, 0.95], [ 0.70, 0.95], [-1.00,-0.75],
              [ 0.00,-0.95], [ 1.00,-0.75] ],
    pases:{ 0:[1,2,3], 1:[0,3,4], 2:[0,3,4], 3:[0,1,2,4], 4:[1,2,3] },
    entrada:[0,1],
    centro:3,
    fila:[2,0,3,1,4] },

  /* ── Q4 · EL 3-2 ────────────────────────────────────────────────
           0     1     2
             3       4
     Tres arriba y dos atrás. Aquí el que ayuda a todos es el de
     arriba en el medio, el 1. El balón entra por las puntas de
     arriba (0 y 2), no por el del medio. Diagonales: 0-4 y 2-3. */
  { nombre:'3-2', nueva:true,
    abanico:[ [-1.00, 0.95], [ 0.00, 1.00], [ 1.00, 0.95],
              [-0.75,-0.90], [ 0.75,-0.90] ],
    pases:{ 0:[1,2,3], 1:[0,2,3,4], 2:[0,1,4], 3:[0,1,4], 4:[1,2,3] },
    entrada:[0,2],
    centro:1,
    fila:[3,0,1,2,4] }
];

/* LA MISMA ZONA EN UNA SOLA FILA, para el casco que publica el giro y
   nada más. Sin cabeceo no hay arriba ni abajo y nunca lo habrá: tres
   bolas quedarían fuera de alcance para siempre. Entonces se cambia
   la cancha, no la cabeza.

   Y aquí está la pega de verdad de las cuatro zonas: una fila no
   tiene forma. En el 1-3-1 el punto, el del medio y el de fondo están
   los tres en x=0 — proyectados a una fila se montan uno encima de
   otro. Así que la fila no se proyecta: se DECLARA, y cada zona
   declara la suya como un camino que recorre las cinco pasando sólo
   por pases legales (3-0-2-1-4 en el 2-1-2, que es la que ya había).
   De ese modo, en el casco, el balón sigue yendo al de al lado — y el
   nene que juega en fila sigue aprendiendo la misma rotación.

   La altura sale de la zona de verdad, no del sitio en la fila: una
   pizca para que la forma se insinúe, tan poca que el punto de mira
   —que en ese caso va siempre plano— las sigue tocando todas. Con el
   2-1-2 esto devuelve exactamente la tabla que estaba escrita a mano
   antes de que hubiera cuatro zonas. */
var FILA_X=[-1.00,-0.50,0.00,0.50,1.00];
ZONAS.forEach(function(z){
  var t=[0,0,0,0,0];
  z.fila.forEach(function(bola,puesto){
    var alto=z.abanico[bola][1];
    t[bola]=[ FILA_X[puesto], alto>0.5 ? 0.12 : (alto<-0.5 ? -0.12 : 0.00) ];
  });
  z.abanicoFila=t;
});

/* Cuál se está jugando. Se elige al armar la tanda y no se mueve
   hasta la siguiente. */
var ZONA=0;
function zona(){ return ZONAS[ZONA] }
function centroZona(){ return ZONAS[ZONA].centro }

var MARGEN=7;                     // grados de aire contra el borde
var DISTANCIA=4.2;                // metros desde el ojo
var FRACCION=0.075;               // radio de la bola, en fracción de media pantalla

var ojoVec=new THREE.Vector3(0,0,0);
var dirAux=new THREE.Vector3();
function colocarBolas(){
  if(!camera||!balls.length) return;
  ojoVec.set(0,OJO,0);
  var G=Math.PI/180;
  var medioAlto=Math.atan(Math.tan(camera.fov*G/2))/G;              // = fov/2
  var medioAncho=Math.atan(Math.tan(camera.fov*G/2)*camera.aspect)/G;
  var giroMax =Math.max(6, Math.min(medioAncho-MARGEN, TOPE_GIRO));
  var altoMax =Math.max(6, Math.min(medioAlto -MARGEN, TOPE_ALTO));
  /* Todas a la misma distancia, así que todas se ven del mismo tamaño
     y el diagrama se lee plano, como en el juego de tocar. El radio
     sale de la pantalla y no al revés: una bola es siempre el 15% del
     alto, en el teléfono y en el monitor. */
  /* Sin cabeceo, las cinco en fila y un poco más grandes: el punto de
     mira va plano y tiene que alcanzarlas todas sin rozar. */
  var fila = (MODO==='cabeza' && !hayCabeceo);
  var tabla = fila ? zona().abanicoFila : zona().abanico;
  var radio=(fila?0.095:FRACCION)*Math.tan(camera.fov*G/2)*DISTANCIA;

  /* Primero DÓNDE van las cinco, y sólo después de cuánto son.

     Porque el tamaño no siempre cabe. La fila del casco mete las
     cinco en el giro y nada más, y en un teléfono de pie ese giro
     son once grados: a bola y media de ancho cada una, se montan
     unas sobre otras. Eso pasaba ya antes de que hubiera cuatro
     zonas —la fila del 2-1-2 se solapaba en vertical y nadie lo
     vio, porque la fila sólo sale con el casco puesto y el casco
     va apaisado, donde sobra sitio— y con zonas nuevas pasaría en
     más sitios.

     Así que el radio se recorta a lo que quepa: nunca más de la
     mitad de la distancia a la bola más cercana, con un pelo de
     aire. En el casco no recorta nada (sobra giro) y en el abanico
     tampoco; muerde sólo donde de verdad no cabe, y entonces es
     preferible una bola más chica que dos pegadas. */
  var i, j, pos=[];
  for(i=0;i<balls.length;i++){
    var gir=tabla[i][0]*giroMax*G, alt=tabla[i][1]*altoMax*G;
    dirAux.set(Math.sin(gir)*Math.cos(alt), Math.sin(alt), -Math.cos(gir)*Math.cos(alt));
    balls[i].position.copy(dirAux).multiplyScalar(DISTANCIA).add(ojoVec);
    pos.push(balls[i].position.clone());
  }
  var masCerca=Infinity;
  for(i=0;i<pos.length;i++) for(j=i+1;j<pos.length;j++)
    masCerca=Math.min(masCerca, pos[i].distanceTo(pos[j]));
  if(isFinite(masCerca)) radio=Math.min(radio, masCerca*0.46);

  for(i=0;i<balls.length;i++){
    balls[i].userData.base=radio/RADIO_GEO;
    balls[i].scale.setScalar(balls[i].userData.base);
  }
}

/* El ángulo de la cámara también depende de la pantalla. Un teléfono
   de pie necesita abrir mucho para que quepan arriba y abajo; un
   monitor ancho con ese mismo ángulo se llena de piso vacío y estira
   todo contra los bordes. */
function anguloDeVista(){ return (innerWidth/innerHeight) >= 1 ? 56 : 68 }

function construir(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0B1724);
  /* La niebla llega hasta más lejos que el piso, a propósito: así el
     borde del piso no se ve nunca como una raya recta cruzando la
     pantalla, sino como el fondo tragándose la cancha. */
  scene.fog=new THREE.Fog(0x0B1724, 10, 26);

  camera=new THREE.PerspectiveCamera(anguloDeVista(), innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0,OJO,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  /* Tope de 2: en un teléfono con pantalla de 3x, pintar a 3x es
     triplicar el trabajo para una diferencia que nadie ve a un palmo
     de la cara, y es justo lo que calienta el aparato. */
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  /* Luz de cielo bajita y foco un poco más fuerte. Con el cielo a
     tope, el piso — que mira justo hacia arriba — se ponía azul
     brillante y se comía media pantalla; las bolas, que miran a todos
     lados, casi no lo notan. */
  scene.add(new THREE.HemisphereLight(0xbfe3ff,0x16222f,0.72));
  var key=new THREE.DirectionalLight(0xffffff,0.68);
  key.position.set(2,6,1); scene.add(key);

  dibujarCancha();

  /* Las bolas. Naranja Hooporia; la luz propia (emissive) es la que
     sube cuando se encienden, así que empieza apagada. */
  var geo=new THREE.SphereGeometry(RADIO_GEO,28,20);
  for(var i=0;i<5;i++){
    var mat=new THREE.MeshStandardMaterial({
      color:0xFF7A18, roughness:.45, metalness:.05, emissive:0x000000
    });
    var m=new THREE.Mesh(geo,mat);
    m.userData.i=i; m.userData.base=1;
    scene.add(m); balls.push(m);
  }
  colocarBolas();

  raycaster=new THREE.Raycaster();

  addEventListener('resize',alCambiarTamano);
  addEventListener('orientationchange',alCambiarTamano);
}

/* Girar el teléfono cambia el ancho y con él la zona: hay que volver
   a colocar las cinco, o media zona se sale del borde. */
function alCambiarTamano(){
  if(!renderer) return;
  camera.aspect=innerWidth/innerHeight;
  camera.fov=anguloDeVista();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  colocarBolas();
}

/* Algo debajo y detrás, para que las bolas estén EN un sitio. Sin
   esto son cinco puntos flotando en negro y se pierde la idea de la
   zona: el piso y las líneas son la mitad de lo que se entrena. */
function dibujarCancha(){
  /* El piso, oscuro y muy cerca del color del fondo. La primera
     versión era azul claro y, como el horizonte cae justo en el medio
     de la pantalla, media pantalla quedaba de una losa azul lisa: no
     parecía una cancha, parecía agua. Lo que hace cancha son las
     líneas, así que el piso se apaga y las líneas se encienden. */
  var suelo=new THREE.Mesh(
    new THREE.PlaneGeometry(60,60),
    new THREE.MeshStandardMaterial({color:0x0B1E2E, roughness:.95})
  );
  suelo.rotation.x=-Math.PI/2;
  scene.add(suelo);

  var tinta=new THREE.LineBasicMaterial({color:0x4C85B0});
  function linea(pts,alto){
    var y=(alto===undefined)?0.02:alto;
    var g=new THREE.BufferGeometry().setFromPoints(
      pts.map(function(p){ return new THREE.Vector3(p[0],y,p[1]) }));
    scene.add(new THREE.Line(g,tinta));
  }
  // La botella y el fondo, lo justo para leer dónde estás parado.
  linea([[-2.45,-7.6],[2.45,-7.6],[2.45,-2.2],[-2.45,-2.2],[-2.45,-7.6]]);
  linea([[-7.5,-7.6],[7.5,-7.6]]);
  // El semicírculo del tiro libre.
  var arco=[];
  for(var a=0;a<=Math.PI;a+=Math.PI/24) arco.push([Math.cos(a)*1.8,-2.2+Math.sin(a)*1.8]);
  linea(arco);
  /* El triple. Es la línea que más cerca pasa de donde uno está
     parado, y por eso es la que de verdad dice "esto es una cancha":
     las otras quedan lejos y se aplastan contra el horizonte. */
  var tres=[[-6.6,0.4],[-6.6,-2.0]];
  for(var b=Math.PI;b>=0;b-=Math.PI/30) tres.push([Math.cos(b)*6.6,-2.0-Math.sin(b)*2.2]);
  tres.push([6.6,0.4]);
  linea(tres);

  /* El aro, detrás y arriba: da el "hacia dónde" que convierte cinco
     posiciones en una zona con frente y fondo. */
  var aro=new THREE.Mesh(
    new THREE.TorusGeometry(0.52,0.045,10,36),
    new THREE.MeshStandardMaterial({color:0xE8622A, roughness:.5,
      emissive:0x3A1405})
  );
  aro.rotation.x=Math.PI/2;
  aro.position.set(0,4.75,-9.1);
  scene.add(aro);
  /* El tablero, dibujado y no rellenado. Relleno era un rectángulo
     gris translúcido flotando entre las dos bolas de arriba, y no
     parecía un tablero: parecía un fallo de pintado. */
  function tableroLinea(pts){
    var g=new THREE.BufferGeometry().setFromPoints(
      pts.map(function(p){ return new THREE.Vector3(p[0],p[1],-9.45) }));
    scene.add(new THREE.Line(g,tinta));
  }
  tableroLinea([[-1.1,4.45],[1.1,4.45],[1.1,5.75],[-1.1,5.75],[-1.1,4.45]]);
  tableroLinea([[-0.42,4.62],[0.42,4.62],[0.42,5.22],[-0.42,5.22],[-0.42,4.62]]);
}

// ══════════════════════════════════════════════════════════════════
//  EL JUEGO
//
//  Igual que fortress.html, nota por nota: la cadena crece de una en
//  una, se repite, un fallo acaba la tirada, y la puntuación es el
//  último nivel que se aguantó COMPLETO — el que se estaba intentando
//  cuando se rompió no cuenta.
// ══════════════════════════════════════════════════════════════════
var LIGHT_MS=333, GAP_MS=167, LEVEL_PAUSE_MS=800;

var fase='tapa';          // tapa | mirando | turno | roto | fin
var cadena=[], nivel=0, voy=0;
var temporizadores=[];

/* La mejor cadena se guarda aquí y SÓLO aquí. fortress.html manda la
   suya a la base, porque allí el nene juega con su código y el padrino
   la ve en la página del pledge. Esta página es práctica suelta: sin
   código, sin campaña, sin nada que mandar. Llave propia para que
   practicar no infle el número que ven los padrinos. */
var LLAVE='f3d-best', mejor=0;
try{ mejor=parseInt(localStorage.getItem(LLAVE)||'0',10)||0 }catch(e){}

function limpiarT(){ temporizadores.forEach(clearTimeout); temporizadores=[] }
function apagarTodas(){
  balls.forEach(function(b){
    b.material.emissive.setHex(0x000000);
    b.scale.setScalar(b.userData.base);
  });
}
function encender(i){
  balls[i].material.emissive.setHex(0xFFF1D6);
  balls[i].scale.setScalar(balls[i].userData.base*1.18);
  playThump(); playTone(i);
}
function apagar(i){
  balls[i].material.emissive.setHex(0x000000);
  balls[i].scale.setScalar(balls[i].userData.base);
}

/* ══════════════════════════════════════════════════════════════════
   EL RELOJ DE LA TANDA

   Cinco minutos por jugador, y es TIEMPO CORRIDO. No se compite
   contra el reloj: dentro de esos cinco minutos caben las tiradas
   que quepan, se rompa la cadena las veces que se rompa. El reloj no
   para nunca — tampoco mientras se enseña la puntuación y corre la
   cuenta para la tirada siguiente. Como en el juego: el cronómetro
   sigue andando, y lo que termina la cosa es la chicharra.

   Eso es lo que hace que el casco se pueda pasar de mano en mano sin
   que nadie lleve la cuenta: cada uno tiene su turno de cinco
   minutos y la chicharra se lo dice.
   ══════════════════════════════════════════════════════════════════ */
var SESION_MS=5*60*1000;
/* EL CUARTO DE UN SCRIMMAGE DURA UN MINUTO.

   Cinco minutos por cuarto son veinte minutos de juego, y eso lo
   aguanta quien tiene padrinos esperando el número. Un scrimmage no
   tiene a nadie esperando: se juega para probarlo, para enseñarlo en
   una banda, o para que un nene sepa a qué se va a enfrentar. Veinte
   minutos para eso es una reunión, no una prueba.

   Se acorta el RELOJ y no el juego: el cuarto sigue teniendo varias
   tiradas, sigue contando la mejor y sigue acabando en chicharra.
   Esa es la parte que hay que sentir —apretar al final, fallar y
   que te quede tiempo para otra—, y una sola tirada por cuarto se la
   llevaría por delante. Un minuto da para tres o cuatro.

   La corrida OFICIAL no se toca: cinco minutos por cuarto. Es la que
   tiene dinero detrás. Y la práctica con casco también se queda en
   cinco, que ahí el reloj es la sesión entera y no un cuarto. */
var CUARTO_CORTO_MS=60*1000;   // ?min= puede moverlo; SESION_MS no
function duracionSesion(){
  return (AMISTOSO && !enPractica) ? CUARTO_CORTO_MS : SESION_MS;
}
/* ?min= ACORTA EL CUARTO — PERO NUNCA EL DE UNA CORRIDA OFICIAL.

   Existe por dos motivos buenos: acortar los cuartos cuando hay cola
   de nenes esperando el teléfono, y poder probar la chicharra sin
   sentarse cinco minutos cada vez.

   Y estaba al revés. Escribía sobre SESION_MS, que es justo el
   número de la corrida oficial, y no tocaba ni el scrimmage ni la
   demostración —que llevan el suyo— así que funcionaba sólo donde no
   debía y no funcionaba donde hacía falta.

   Lo que eso permitía: pegarle &min=30 al enlace de jugar y hacer
   cuartos de media hora en una corrida con padrinos detrás. Más
   tiempo son más tiradas, sólo cuenta la mejor, y los puntos suben
   por el cuadrado — así que la tía del nene acabaría debiendo varias
   veces lo que prometió, y el reporte no enseñaría nada raro: diría
   que anotó mucho.

   Ahora escribe sobre CUARTO_CORTO_MS, que es el del scrimmage y el
   de la demostración. La corrida oficial lee SESION_MS y nadie más
   lo toca: ahí está la seguridad, en el número que se escribe.

   Y NO lleva un if(!JUEGO), que es lo primero que uno escribe aquí:
   JUEGO se asigna ochocientas líneas más abajo, así que en este
   punto vale undefined y la comprobación pasaría para todo el
   mundo. Una guardia que parece proteger y no protege es peor que
   ninguna — quien la lea dará el caso por cubierto. */
try{
  var mm=(location.search.match(/[?&]min=([0-9.]+)/)||[])[1];
  if(mm){
    mm=parseFloat(mm);
    if(mm>=0.1&&mm<=30) CUARTO_CORTO_MS=Math.round(mm*60*1000);
  }
}catch(e){}
var relojHasta=0, relojCorriendo=false, relojTexto='';

function quedaMs(){ return relojCorriendo ? Math.max(0, relojHasta-performance.now()) : duracionSesion() }
function arrancarReloj(){ relojHasta=performance.now()+duracionSesion(); relojCorriendo=true }
function pintarReloj(){
  var ms=quedaMs(), seg=Math.ceil(ms/1000);
  var txt=Math.floor(seg/60)+':'+('0'+(seg%60)).slice(-2);
  var e=$('reloj');
  // Sólo se toca el DOM cuando cambia el segundo, no en cada cuadro.
  if(txt!==relojTexto){ relojTexto=txt; e.textContent=txt }
  var clase = ms<=10000 ? 'nada' : (ms<=30000 ? 'poco' : '');
  if(e.className!==clase) e.className=clase;
}

/* La chicharra. Dos cuadradas desafinadas a propósito y sostenidas:
   eso es lo que suena como el final de un período y no como un
   pitido de microondas. */
function sonarChicharra(){
  if(!audioCtx)return;
  var now=audioCtx.currentTime;
  try{
    [152,113].forEach(function(f){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='square';
      o.frequency.setValueAtTime(f,now);
      g.gain.setValueAtTime(.0001,now);
      g.gain.exponentialRampToValueAtTime(.38,now+0.02);
      g.gain.setValueAtTime(.38,now+1.25);
      g.gain.exponentialRampToValueAtTime(.0001,now+1.5);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(now);o.stop(now+1.55);
    });
  }catch(e){}
}

function pintarHud(){
  $('hNivel').textContent=String(nivel);
  $('hPts').textContent=String(pointsFor(Math.max(0,nivel-1)));
  var e=$('estado');
  if(fase==='listo'){
    e.textContent = MODO==='cabeza' ? T('listoPill') : T('listoPillD');
    e.className='listo';
  }else if(enCuartos() && !enPractica && cuartoActual){
    /* Jugando un cuarto, lo que manda arriba es QUÉ CUARTO ES. Que no
       quepa duda de si esto cuenta. */
    e.textContent = T('cuartoPill').replace('{Q}',cuartoActual) + ' · ' +
                    (fase==='turno' ? T('turno') : T('mira'));
    e.className = fase==='turno' ? 'tu' : '';
  }else{
    e.textContent = fase==='turno' ? T('turno') : T('mira');
    e.className = fase==='turno' ? 'tu' : '';
  }
}

/* ARMAR, Y QUE ARRANQUE EL QUE JUEGA.

   El casco no empieza a contar en cuanto se lo ponen: eso regalaría
   medio minuto al forcejeo de la correa. Queda armado, con la bola
   del medio latiendo, y el reloj parado en 5:00. El que juega la
   mira — o la toca, si es teléfono — y ahí arrancan sus cinco
   minutos. Es él quien decide cuándo está listo.

   Y es la del medio a propósito: es la única que está siempre al
   frente, se mide ya con ella y no hay que buscarla. */
/* Un cuarto se arma igual que una práctica: la bola del medio, cinco
   minutos, chicharra. Lo único que cambia es qué se hace al final y
   que la pantalla lo dice en todo momento, para que nadie crea que
   está calentando cuando está jugando su Q3. */
function armarCuarto(q){
  if(!q){ finDelJuego=true; volverAPortada(); return }
  cuartoActual=q; enPractica=false; armarSesion();
}
function armarPractica(){
  /* Practicar después de un scrimmage es empezar otra cosa: si se
     quedara marcado como scrimmage, la tarjeta al fallar ofrecería
     volver a un juego que ya terminó. */
  if(AMISTOSO && finDelJuego) AMISTOSO=false;
  cuartoActual=0; enPractica=true; armarSesion();
}
/* Volver a la portada del juego — es donde vive el marcador y el
   botón del cuarto siguiente. */
function volverAPortada(){
  limpiarT(); pararCuenta(); apagarTodas();
  relojCorriendo=false; relojTexto='';
  fase='tapa';
  $('fin').hidden=true; $('hud').hidden=true; $('pista').hidden=true;
  $('mira').hidden=true;
  $('tapa').hidden=false;
  pintarTapaJuego();
}

/* ¿Lleva reloj esta tanda?

   Sólo donde el tiempo significa algo. En el casco sí: hay una fila
   de nenes esperando y cinco minutos es el turno de cada uno. En un
   cuarto sí: es el juego. Practicando solo en el teléfono, no — ahí
   no hay nadie detrás a quien pasarle el casco, y una chicharra que
   te corta para decirte "siguiente jugador" cuando no hay siguiente
   jugador es una pantalla hablándole a nadie.

   Sin reloj tampoco hace falta armar nada: la bola del medio existe
   para que el que juega decida cuándo empiezan SUS minutos, y si no
   hay minutos que empezar, se juega y ya. */
var conReloj=false;

/* QUÉ ZONA LE TOCA A ESTA TANDA.

   Jugando un cuarto, la del cuarto: Q1 el 2-1-2, Q2 el 1-3-1, Q3 el
   2-3, Q4 el 3-2. Fijas y en ese orden, las mismas para todo el mundo
   — sorteadas, a un nene le tocaría una tanda más fácil que a otro y
   sus padrinos pagarían distinto por lo mismo.

   Practicando entre cuartos, la del cuarto QUE VIENE: practicar es
   calentar para el siguiente, y calentar en una zona que no vas a
   jugar es perder el rato.

   Practicando suelto —un teléfono, sin juego y sin scrimmage— van
   rotando una por tanda, para que el que practica solo acabe viendo
   las cuatro y no se encuentre el 3-2 por primera vez en Q4. */
var zonaSuelta=0;
function elegirZona(){
  if(enCuartos() && !enPractica && cuartoActual){
    ZONA=(cuartoActual-1)%ZONAS.length;
  }else if(enCuartos() && enPractica){
    ZONA=cuartos.length%ZONAS.length;
  }else{
    ZONA=zonaSuelta; zonaSuelta=(zonaSuelta+1)%ZONAS.length;
  }
}

function armarSesion(){
  limpiarT(); apagarTodas(); pararCuenta();
  /* La zona primero, y recolocar: las cinco bolas se mueven de sitio
     entre cuarto y cuarto, y si se eligiera después de encender nada
     el nene vería la forma vieja un cuadro antes de la nueva. */
  elegirZona(); colocarBolas();
  cadena=[]; nivel=0; voy=0; tanda=[];
  mirando=-1; bloqueada=-1; sinBolaDesde=0;
  relojCorriendo=false; relojHasta=0; relojTexto='';
  conReloj = (MODO==='cabeza') || (enCuartos() && !enPractica);
  fase='listo';
  $('fin').hidden=true;
  $('hud').hidden=false;
  $('pista').hidden=false;
  $('reloj').hidden=!conReloj;
  if(MODO==='cabeza'){
    $('mira').hidden=false;
    /* Cada tanda empieza con el frente donde esté la cara: en la fila
       del casco, el que entra no tiene el cuello donde lo dejó el que
       salió. Menos la primera de todas, que viene de la medida y ya
       trae su cero. */
    if(saltarCentro) saltarCentro=false; else recentrar();
  }
  if(!conReloj){ empezarTirada(); return }
  pintarReloj(); pintarHud(); pintarPista();
}

function empezarJuego(){
  if(fase!=='listo') return;
  arrancarReloj();
  empezarTirada();
}

function empezarTirada(){
  limpiarT(); apagarTodas(); pararCuenta();
  cadena=[]; nivel=0; voy=0;
  mirando=-1; bloqueada=-1; sinBolaDesde=0;
  $('fin').hidden=true;
  $('hud').hidden=false;
  $('pista').hidden=false;
  if(MODO==='cabeza') $('mira').hidden=false;
  fase='mirando';
  pintarPista();            // se va la línea de "mira el medio"
  pintarHud();
  /* Un respiro antes de la primera: si la primera bola se enciende en
     el mismo instante en que desaparece la portada, nadie la ve. */
  temporizadores.push(setTimeout(siguienteNivel, 600));
}

/* Una cadena entera, trazada de nuevo por la zona: n destellos, cada
   uno un pase legal desde el anterior, el primero por donde sube el
   balón. La misma regla que usa la que crece — lo único que cambia es
   que aquí se tira la anterior. */
function cadenaNueva(n){
  var c=[];
  for(var i=0;i<n;i++) c.push(nextInRotation(i?c[i-1]:null));
  return c;
}

function siguienteNivel(){
  if(fase==='roto'||fase==='fin') return;
  voy=0;
  nivel=nivel+1;
  /* Crece: la de antes más uno al final. Renueva: otra entera del
     largo que toca. El nivel sube igual en las dos, y los puntos
     salen del nivel, así que pointsFor no se entera de la diferencia
     y el reporte sigue diciendo lo mismo. */
  if(zona().nueva) cadena=cadenaNueva(nivel);
  else cadena.push(nextInRotation(cadena.length?cadena[cadena.length-1]:null));
  fase='mirando';
  pintarHud();
  mostrar(0);
}

function mostrar(i){
  if(fase==='roto'||fase==='fin') return;
  if(i>=cadena.length){
    fase='turno'; pintarHud();
    /* Con el dedo, no tocar es no contestar. Con la cabeza no existe
       "no mirar": la vista siempre está puesta en algo. Si al llegar
       tu turno ya estabas mirando una bola, a los seis décimos la
       contestaría sola. Así que la cuenta de esa bola — y sólo de
       ésa — empieza con retraso: mirarla fijo la contesta igual, pero
       más de un segundo después, que ya es querer. */
    if(MODO==='cabeza'){
      bloqueada=-1; sinBolaDesde=0;
      mirando=bolaEn((curX+1)/2*innerWidth, (1-curY)/2*innerHeight);
      mirandoDesde=performance.now()+(mirando>=0?GRACIA_MS:0);
    }
    return;
  }
  var idx=cadena[i];
  encender(idx);
  temporizadores.push(setTimeout(function(){
    apagar(idx);
    temporizadores.push(setTimeout(function(){ mostrar(i+1) }, GAP_MS));
  }, LIGHT_MS));
}

/* La única entrada del juego. Da igual si vino de un dedo, de un clic,
   de una tecla o de la mirada: llega aquí con un número de bola y nada
   más. Y antes de que empiece la tanda, la única bola que hace algo es
   la del medio. */
function elegir(idx){
  if(fase==='listo'){
    var c=centroZona();
    if(idx===c){ encender(c); temporizadores.push(setTimeout(function(){ apagar(c) },220));
                 empezarJuego() }
    return;
  }
  contestar(idx);
}

function contestar(idx){
  if(fase!=='turno') return;
  if(idx===cadena[voy]){
    encender(idx);
    temporizadores.push(setTimeout(function(){ apagar(idx) },220));
    voy++;
    if(voy>=cadena.length){
      fase='mirando'; pintarHud();
      temporizadores.push(setTimeout(siguienteNivel, LEVEL_PAUSE_MS));
    }
  }else{
    balls[idx].material.emissive.setHex(0xC2261B);
    balls[idx].scale.setScalar(balls[idx].userData.base*1.18);
    romper();
  }
}

function romper(){
  if(fase==='roto'||fase==='fin') return;
  fase='roto'; limpiarT();
  /* El nivel que se estaba intentando no se completó, así que la
     puntuación es el último que se aguantó entero. */
  var final=Math.max(0, nivel-1);
  if(final>mejor){
    mejor=final;
    try{ localStorage.setItem(LLAVE,String(mejor)) }catch(e){}
  }
  tanda.push(final);
  if(tanda.length>12) tanda.shift();
  temporizadores.push(setTimeout(function(){
    apagarTodas();
    fase='fin';
    $('finK').textContent=T('finK');
    $('finN').textContent=String(final);
    $('finP').textContent=T('fin')+'  ·  '+pointsFor(final)+' '+T('puntos');
    $('finS').textContent=T('mejor')+mejor;
    $('tanda').textContent=tanda.length>1 ? T('tanda')+tanda.join('  ·  ') : '';
    /* ¿Cuenta atrás o botón? Lo decide si hay reloj corriendo.
    
       Con reloj — el casco, un cuarto — la siguiente tirada entra
       sola: son TUS cinco minutos los que están pasando, y un botón
       ahí es tiempo tuyo gastado en apretarlo.
    
       Sin reloj no hay prisa de nadie. Se rompió la cadena, se acabó
       la tanda, y empieza otra cuando tú quieras. Meterle una cuenta
       atrás a una práctica es inventarle una urgencia que no tiene. */
    if(conReloj){
      $('otra').hidden=true;
      $('practicar').hidden=true;
      arrancarCuenta();
    }else if(JUEGO && enPractica){
      $('otra').hidden=false;  $('otra').textContent=T('volverJuego');
      $('practicar').hidden=false; $('practicar').textContent=T('otraTanda');
      $('cuenta').textContent='';
    }else{
      $('otra').hidden=false;  $('otra').textContent=T('otra');
      $('practicar').hidden=true;
      $('cuenta').textContent='';
    }
    $('fin').hidden=false;
    $('hud').hidden=true;
    $('pista').hidden=true;
  },750));
}

/* ══════════════════════════════════════════════════════════════════
   LA CHICHARRA

   Se acabaron los cinco minutos. Lo que esté pasando se para donde
   esté — a mitad de una cadena, en la pantalla de la puntuación, da
   igual: la chicharra no espera a que termines, igual que en un
   juego. La tirada que estaba en el aire se cuenta como se cuenta
   siempre, por el último nivel que se aguantó entero.

   Y AQUÍ SÍ hay botón, que es lo único que separa a un jugador del
   siguiente. En el casco se aprieta mirándolo.
   ══════════════════════════════════════════════════════════════════ */
function terminarSesion(porVentana){
  if(fase==='tiempo') return;
  var enElAire=(fase==='mirando'||fase==='turno');
  limpiarT(); pararCuenta();
  relojCorriendo=false;
  if(enElAire){
    var corte=Math.max(0, nivel-1);
    if(corte>mejor){ mejor=corte; try{ localStorage.setItem(LLAVE,String(mejor)) }catch(e){} }
    tanda.push(corte);
    if(tanda.length>12) tanda.shift();
  }
  fase='tiempo';
  sonarChicharra();
  apagarTodas();
  var mejorDeLaTanda=tanda.length ? Math.max.apply(null,tanda) : 0;

  /* EN UN CUARTO, la chicharra no acaba la tanda: cierra el cuarto,
     lo manda al servidor y enseña el marcador. */
  if(enCuartos() && !enPractica && cuartoActual){
    cerrarCuarto(cuartoActual, porVentana?0:mejorDeLaTanda, porVentana);
    return;
  }

  $('finK').textContent=T('seAcabo');
  $('finN').textContent=String(mejorDeLaTanda);
  $('finP').textContent=T('mejorTanda')+'  ·  '+pointsFor(mejorDeLaTanda)+' '+T('puntos');
  $('tanda').textContent=tanda.length ? T('tanda')+tanda.join('  ·  ') : '';
  $('finS').textContent=T('mejor')+mejor;
  $('cuenta').textContent='';
  $('caja').hidden=true;
  $('otra').hidden=false;
  $('otra').textContent = JUEGO ? T('volverJuego') : T('siguienteBtn');
  $('practicar').hidden=true;
  $('fin').hidden=false;
  $('hud').hidden=true;
  $('pista').hidden=true;
}

/* ══════════════════════════════════════════════════════════════════
   CERRAR UN CUARTO

   La mejor tirada del cuarto es el cuarto. Se manda, se espera a que
   el servidor diga que quedó — y sólo entonces se enseña el marcador
   y el botón del siguiente. Enseñar el número antes de que esté
   guardado sería enseñarle a un nene unos puntos que a lo mejor no
   existen.

   Si cerró la ventana a mitad, el cuarto vale 0 y no se manda nada:
   el servidor lo rechazaría de todas formas, y un cuarto sin fila
   ya cuenta como cero al sumar.
   ══════════════════════════════════════════════════════════════════ */
/* El cuarto que se jugó y todavía no está guardado. Mientras haya
   uno aquí, lo ÚNICO que ofrece la pantalla es volver a mandarlo: si
   el botón dejara seguir al cuarto siguiente, un teléfono sin señal
   serviría para repetir un cuarto que salió malo. */
var cuartoPendiente=null;

function empezarAmistoso(){
  AMISTOSO=true; finDelJuego=false; enPractica=false;
  cuartos=[]; cuartoActual=0; cuartoPendiente=null;
  armarCuarto(1);
}

function cerrarCuarto(q, nivel, porVentana){
  var puntos=pointsFor(nivel);
  fase='tiempo';
  $('finK').textContent=T('finCuarto').replace('{Q}',q);
  $('finN').textContent=String(puntos);
  $('tanda').textContent=tanda.length ? T('tanda')+tanda.join('  ·  ') : '';
  $('finS').textContent='';
  $('cuenta').textContent='';
  $('otra').hidden=true; $('practicar').hidden=true; $('caja').hidden=true;
  $('fin').hidden=false; $('hud').hidden=true; $('pista').hidden=true;
  $('mira').hidden=true;

  if(porVentana){
    finDelJuego=true;
    $('finP').textContent=T('porVentana');
    temporizadores.push(setTimeout(finDeJuego, 1800));
    return;
  }

  /* En un scrimmage no hay nada que mandar: el cuarto se apunta aquí
     y ya. Mismo marcador, mismas reglas, cero consecuencias. */
  if(AMISTOSO){
    cuartos.push({q:q, points:puntos, level:nivel});
    cuartos.sort(function(a,b){ return a.q-b.q });
    pintarCaja($('caja'), 0);
    var sigA=proximoCuarto();
    if(!sigA){ finDeJuego(); return }
    $('finP').textContent=T('totalJuego')+': '+totalJuego();
    $('otra').hidden=false;
    $('otra').textContent=T('siguienteCuarto').replace('{Q}',sigA);
    $('practicar').hidden=true;
    return;
  }

  cuartoPendiente={q:q, nivel:nivel, puntos:puntos};
  $('finP').textContent=T('guardando');
  guardarCuarto(q, nivel, puntos, function(ok){
    if(!ok && !finDelJuego){
      /* Sin esto la pantalla se quedaba sin un solo botón: el cuarto
         jugado, sin guardar, y nada que tocar. */
      $('finP').textContent=T('noGuardo');
      $('otra').hidden=false; $('otra').textContent=T('reintentar');
      return;
    }
    cuartoPendiente=null;
    pintarCaja($('caja'), 0);
    var sig=proximoCuarto();
    if(finDelJuego || !sig || quedaVentana()<=0){ finDeJuego(); return }
    $('finP').textContent=T('totalJuego')+': '+totalJuego();
    $('otra').hidden=false;
    $('otra').textContent=T('siguienteCuarto').replace('{Q}',sig);
    $('practicar').hidden=false;
    $('practicar').textContent=T('practicar');
  });
}

function finDeJuego(){
  finDelJuego=true;
  fase='tiempo';
  $('finK').textContent=AMISTOSO ? T('finAmistoso') : T('finJuego');
  $('finN').textContent=String(totalJuego());
  if($('finP').textContent!==T('porVentana')) $('finP').textContent=T('totalJuego');
  pintarCaja($('caja'), 0);
  $('practicar').hidden=false;
  $('practicar').textContent=T('practicar');
  if(DEMO){
    /* En demostración el botón no ofrece otro scrimmage: lleva a lo
       que el entrenador vino a ver, que es el dinero. */
    $('otra').hidden=false; $('otra').textContent=T('demoSigue');
  }else if(AMISTOSO){
    $('otra').hidden=false; $('otra').textContent=T('otroAmistoso');
  }else{
    $('otra').hidden=true;
  }
  $('fin').hidden=false;
}

/* ══════════════════════════════════════════════════════════════════
   ENTRE UNA TIRADA Y LA SIGUIENTE

   Se rompió la cadena pero quedan minutos: se enseña lo que hizo, se
   cuentan cuatro segundos y entra otra sola. Nadie aprieta nada, y
   sobre todo EL RELOJ NO SE PARA — estos cuatro segundos son de su
   tiempo, como lo son los de la cancha mientras se cobra una falta.

   Cuatro y no siete: dentro de cinco minutos las roturas se cuentan
   por decenas, y a siete segundos cada una se iría media tanda
   mirando un número.

   Abajo queda la lista de la tanda: lo que hizo en cada tirada, una
   al lado de la otra. Eso es lo que convierte pasarse el casco en una
   competencia.
   ══════════════════════════════════════════════════════════════════ */
var AUTO_MS=4000, cuentaHasta=0, tanda=[];
function arrancarCuenta(){ cuentaHasta=performance.now()+AUTO_MS }
function pararCuenta(){ cuentaHasta=0; $('cuenta').textContent='' }
function cuentaEnElBucle(){
  if(!cuentaHasta) return;
  var q=Math.ceil((cuentaHasta-performance.now())/1000);
  if(q<=0){ pararCuenta(); empezarTirada(); return }
  $('cuenta').textContent=T('otraTirada')+' — '+T('empiezaEn')+q;
}

/* ══════════════════════════════════════════════════════════════════
   JUGAR CON LA CABEZA, SIN MANDO

   En el casco esto se juega con el puntero del mando y se juega bien.
   Pero el mando es una pieza más que cargar, que se pierde, que se
   queda sin batería y que hay que explicar. Veintiún cascos pasando
   de mano en mano quieren cero piezas.

   Y aquí está la diferencia con lo que ya probamos y falló. En
   salida.html y en la vieja, el giroscopio movía EL MUNDO: la
   cabeza giraba y la cancha entera giraba con ella. Eso exige saber
   exactamente cómo está puesta la pantalla del casco, y este
   navegador de 2020 miente sobre eso — por ahí se nos fueron dos
   tardes, con la cancha torcida y el horizonte a la deriva.

   Aquí el mundo NO SE MUEVE. La cámara sigue clavada, las cinco bolas
   siguen todas a la vista, y la cabeza mueve una sola cosa: un punto
   de mira por la pantalla. Es el mismo trabajo que hace el mando, con
   el cuello en vez de la muñeca.

   Lo que eso cambia:

   · Si un signo sale al revés, el punto se va para el otro lado. Se
     ve en un segundo y se arregla volviendo a medir. Antes, un signo
     al revés dejaba la cancha boca abajo y no había forma de saber
     cuál de las cuatro correcciones era.
   · Nada puede quedar fuera de alcance, porque nada se sale de la
     pantalla: el punto va tope a tope.
   · Perderse es imposible de verdad: no hay "detrás".

   El mando sigue funcionando todo el tiempo. Si la cabeza se porta
   mal, se agarra el mando y se juega igual.
   ══════════════════════════════════════════════════════════════════ */
var MODO='puntero';           // puntero | cabeza
var GRADO=Math.PI/180;
var crudoA=0, crudoB=0, crudoG=0, girosN=0;

function alLlegarElGiro(ev){
  if(ev.alpha===null||ev.alpha===undefined) return;
  crudoA=ev.alpha; crudoB=ev.beta; crudoG=ev.gamma; girosN++;
}
try{
  addEventListener('deviceorientationabsolute', alLlegarElGiro, true);
  addEventListener('deviceorientation', alLlegarElGiro, true);
}catch(e){}

/* El iPhone no entrega el giroscopio si no se le pide dentro de un
   toque de verdad; Android — y los cascos son Android — lo da solo.
   Por eso el botón se ofrece también cuando sólo existe el permiso:
   todavía no ha llegado ningún dato, pero puede llegar. */
function hayGiro(){
  if(girosN>0) return true;
  try{ return typeof DeviceOrientationEvent!=='undefined' &&
       typeof DeviceOrientationEvent.requestPermission==='function' }catch(e){ return false }
}
function pedirElGiro(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' &&
       typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r==='granted'){
          try{
            addEventListener('deviceorientationabsolute', alLlegarElGiro, true);
            addEventListener('deviceorientation', alLlegarElGiro, true);
          }catch(e){}
        }
      }).catch(function(){});
    }
  }catch(e){}
}
/* Los datos llegan medio segundo después de abrir la página, así que
   el botón no puede decidirse al pintar la portada: se mira otra vez
   hasta que lleguen. */
/* El botón del casco sólo sale si lo pide la dirección:
   fortress-vr.html?casco=1

   Hasta ahora salía en cuanto llegaba un giroscopio, y un giroscopio
   lo tienen TODOS los teléfonos. O sea que a cualquier nene con un
   teléfono le aparecía "Con un casco", lo tocaba por curiosidad, y se
   encontraba con la medición de tres pasos — que sin casco puesto no
   lleva a ningún sitio y es un primer minuto malísimo con el juego.
   En una computadora no salía nunca, porque no hay giroscopio.

   Los cascos llevan esta dirección puesta de inicio, así que para
   ellos no cambia nada. Para todos los demás, el modo no existe.

   SI SE PIERDE EL PARÁMETRO al reconfigurar un casco, ese casco se
   queda sin el modo y parece roto. La dirección entera es:
       fortress-vr.html?casco=1 (en el dominio donde esté servido)  */
function pidenCasco(){
  try{ var v=new URLSearchParams(location.search).get('casco');
       return v==='1' || v==='si' || v==='yes' }catch(e){ return false }
}

var ojeando=setInterval(function(){
  if(JUEGO){ clearInterval(ojeando); return }   // nunca se ofrece el casco
  if(!pidenCasco()){ clearInterval(ojeando); return }
  if($('tapa').hidden){ clearInterval(ojeando); return }
  if(hayGiro()){
    $('goCabeza').hidden=false;
    $('tapaReq').hidden=false;
    $('tapaS').textContent=T('sCabeza');
    if(girosN>0) clearInterval(ojeando);
  }
},400);

/* ── Lo medido, una vez por casco ─────────────────────────────────
   No se adivina de qué eje sale el cabeceo ni hacia dónde crece: se
   mide, con el casco puesto, en tres pasos. Es la única parte de
   la vieja que valía la pena salvar entera. */
/* Las llaves guardadas dicen f3d porque este archivo nació con otro
   nombre y se mudó aquí. NO se renombran: cambiarlas obligaría a
   medir otra vez los cascos que ya se midieron, a cambio de nada. */
var ejeCabeceo='beta', signoCabeceo=1, signoGiro=1, hayCabeceo=true;
var ceroGiro=0, ceroCabeceo=0, calHecha=false;
try{
  var gg=JSON.parse(localStorage.getItem('f3d-cal')||'null');
  if(gg&&gg.e){ ejeCabeceo=gg.e; signoCabeceo=gg.s; signoGiro=gg.g;
                hayCabeceo=(gg.c!==false); calHecha=true }
}catch(e){}
function guardarCal(){
  try{ localStorage.setItem('f3d-cal',
    JSON.stringify({e:ejeCabeceo,s:signoCabeceo,g:signoGiro,c:hayCabeceo})) }catch(e){}
}
// Para volver a medir sin borrar nada: ?medir en la dirección.
try{ if(/[?&]medir/.test(location.search)) calHecha=false }catch(e){}

// Diferencia de ángulos por el camino corto, que alfa da la vuelta en 360.
function difAng(a,b){
  var d=(a-b)%360;
  if(d>180) d-=360;
  if(d<-180) d+=360;
  return d;
}
function valorCabeceo(){ return ejeCabeceo==='beta' ? crudoB : crudoG }
function recentrar(){ ceroGiro=crudoA; ceroCabeceo=valorCabeceo() }

var PASO_MS=2300;
var medir={activo:false, paso:0, t0:0, a0:0, b0:0, g0:0};
function empezarMedida(){
  medir.activo=true; medir.paso=0; medir.t0=performance.now();
  $('medida').hidden=false; $('hud').hidden=true; $('pista').hidden=true;
}
function pintarMedida(){
  var q=Math.max(0,Math.ceil((PASO_MS-(performance.now()-medir.t0))/1000));
  $('medidaT').textContent=T(['m1','m2','m3'][medir.paso]||'m1');
  $('medidaN').textContent=String(q);
}
function pasoDeMedida(){
  if(performance.now()-medir.t0 < PASO_MS) return;
  if(medir.paso===0){
    medir.a0=crudoA; medir.b0=crudoB; medir.g0=crudoG;
  }else if(medir.paso===1){
    /* ¿Cuál de los dos se movió al mirar arriba, y hacia dónde? Y
       antes de eso: ¿se movió alguno? Hay cascos cuyo navegador
       publica el giro y nada más — ni cabeceo ni balanceo. Si es el
       caso, no hay corrección que valga, y en vez de seguir buscándola
       se cambia la cancha: las cinco en una fila, que se alcanzan
       girando, que es lo único que responde. */
    var dB=difAng(crudoB,medir.b0), dG=difAng(crudoG,medir.g0);
    if(Math.max(Math.abs(dB),Math.abs(dG))<6){
      hayCabeceo=false;
    }else{
      hayCabeceo=true;
      if(Math.abs(dB)>=Math.abs(dG)){ ejeCabeceo='beta';  signoCabeceo=dB>0?1:-1 }
      else                          { ejeCabeceo='gamma'; signoCabeceo=dG>0?1:-1 }
    }
  }else{
    // Hacia dónde crece alfa al girar a la izquierda.
    signoGiro = difAng(crudoA,medir.a0)>0 ? 1 : -1;
    /* El cero sale del PASO 1, que fue "mira al frente" — no de aquí,
       que el último paso fue mirar a la izquierda. Cogerlo al final
       dejaba el frente 35 grados torcido; ese error ya lo pagamos una
       vez en la vieja. */
    ceroGiro=medir.a0;
    ceroCabeceo=(ejeCabeceo==='beta') ? medir.b0 : medir.g0;
    calHecha=true; guardarCal();
    saltarCentro=true;        // el cero ya es el del paso 1; no tocarlo
    colocarBolas();           // la cancha se adapta a lo que dé el casco
    medir.activo=false;
    $('medida').hidden=true;
    temporizadores.push(setTimeout(armarSesion, 500));
    return;
  }
  medir.paso++; medir.t0=performance.now();
}

/* ── El punto de mira ──────────────────────────────────────────────
   Cuánta cabeza hay que mover para ir de un borde al otro. 30 grados
   de un lado a otro es un vistazo normal, no un latigazo de cuello:
   la bola más lejos está a unos 17 grados. */
var RANGO_GIRO=30, RANGO_CAB=22;
var curX=0, curY=0;
/* La tirada que sale justo de la medida NO se recentra. El paso 1 ya
   fue "mira al frente" y ese es el cero bueno; medio segundo después
   la cabeza todavía está girada a la izquierda del paso 3, así que
   recentrar ahí deja el frente treinta grados torcido. Es el mismo
   error que ya nos comió una tarde en la vieja, reaparecido por la
   puerta de atrás al añadir el recentrado por tirada. */
var saltarCentro=false;
function tope(v){ return v>1?1:(v<-1?-1:v) }
function moverMira(){
  if(!calHecha||!girosN) return;
  curX=tope(signoGiro*difAng(crudoA,ceroGiro)/RANGO_GIRO);
  curY=hayCabeceo ? tope(signoCabeceo*difAng(valorCabeceo(),ceroCabeceo)/RANGO_CAB) : 0;
}

var DWELL_MS=620;        // con el dedo era un toque; con la cabeza, aguantar
var GRACIA_MS=650;
var PERDIDO_MS=8000;
var mirando=-1, mirandoDesde=0, bloqueada=-1, sinBolaDesde=0, avisoHasta=0;
var DWELL_BOTON=900, mirandoBoton=0;
var crudoCada=0;

function cabezaEnElBucle(){
  moverMira();
  var px=(curX+1)/2*innerWidth, py=(1-curY)/2*innerHeight;
  var m=$('mira');
  m.style.transform='translate('+px+'px,'+py+'px)';

  /* Los números crudos a la vista. En un casco no hay consola que
     mirar: si algo sale raro, esto es lo único que lo dice. */
  if(performance.now()-crudoCada>250){
    crudoCada=performance.now();
    $('crudo').textContent=SELLO+'  '+Math.round(crudoA)+' '+Math.round(crudoB)+' '+
      Math.round(crudoG)+'  '+(hayCabeceo?'':'sin cabeceo ')+(calHecha?'':'sin medir');
  }

  /* El botón de siguiente jugador se aprieta mirándolo. Es el único
     momento en que hace falta apretar algo, y en el casco no hay con
     qué: sin esto, la única salida sería el mando que queremos
     dejar en el cajón. Aguanta más que una bola — nueve décimos —
     porque apretarlo sin querer te manda a la tanda del siguiente. */
  if(fase==='tiempo'){
    var bt=$('otra');
    var dentro=false;
    if(!bt.hidden && !$('fin').hidden){
      var r=bt.getBoundingClientRect();
      dentro = px>=r.left && px<=r.right && py>=r.top && py<=r.bottom;
    }
    m.className = dentro ? 'sobre' : '';
    if(dentro){
      if(!mirandoBoton) mirandoBoton=performance.now();
      var tb=(performance.now()-mirandoBoton)/DWELL_BOTON;
      m.firstChild.style.transform='scale('+Math.max(0.02,Math.min(1,tb))+')';
      if(tb>=1){ mirandoBoton=0; armarSesion() }
    }else{
      mirandoBoton=0;
      m.firstChild.style.transform='scale(0.02)';
    }
    return;
  }
  mirandoBoton=0;

  var sobre = (fase==='turno'||fase==='listo') ? bolaEn(px,py) : -1;
  /* Antes de arrancar, la única que responde es la del medio: que el
     punto se llene encima de otra sería prometer algo que no pasa. */
  if(fase==='listo' && sobre!==centroZona()) sobre=-1;
  m.className = sobre>=0 ? 'sobre' : '';

  if(fase!=='turno' && fase!=='listo'){
    if(mirando>=0){ apagar(mirando); mirando=-1 }
    m.firstChild.style.transform='scale(0)';
    return;
  }

  // Soltar la bola recién contestada la desbloquea.
  if(sobre!==bloqueada) bloqueada=-1;

  if(sobre!==mirando){
    if(mirando>=0 && mirando!==bloqueada) apagar(mirando);
    mirando=sobre; mirandoDesde=performance.now();
  }
  var t=0;
  if(mirando>=0 && mirando!==bloqueada){
    t=(performance.now()-mirandoDesde)/DWELL_MS;
    if(t>=1){
      var i=mirando;
      apagar(i); mirando=-1; bloqueada=i; t=0;
      elegir(i);
    }else{
      var v=Math.round(t*150);
      balls[mirando].material.emissive.setRGB(v/255, v/255*.82, v/255*.5);
      balls[mirando].scale.setScalar(balls[mirando].userData.base*(1+t*0.12));
    }
  }
  m.firstChild.style.transform='scale('+(t>0?Math.max(0.02,t):0.02)+')';

  /* Perderse tiene salida y no hace falta mando: unos segundos sin
     tocar ninguna bola y el frente vuelve a ser donde esté la cara.
     Jugando no salta, porque jugando se mira a las bolas. */
  if(sobre<0 && fase==='turno'){
    if(!sinBolaDesde) sinBolaDesde=performance.now();
    else if(performance.now()-sinBolaDesde>PERDIDO_MS){
      sinBolaDesde=0; recentrar();
      $('estado').textContent=T('centrado'); avisoHasta=performance.now()+1300;
    }
  }else sinBolaDesde=0;
  if(avisoHasta && performance.now()>avisoHasta){ avisoHasta=0; pintarHud() }
}


/* ══════════════════════════════════════════════════════════════════
   EL JUEGO DE HOOPORIA

   La misma cancha y las mismas reglas, pero jugando por plata.

   Cuatro cuartos de cinco minutos. El cuarto se puntúa por la MEJOR
   tirada que hiciste dentro de él — no por la suma. Eso es lo que
   hace que cada tirada importe: la única forma de subir tu cuarto es
   aguantar una cadena más larga de la que ya aguantaste. Sumar
   premiaría correr, que es lo contrario del ejercicio.

   Los cuatro cuartos se suman y eso es el juego. Un padrino promete
   por punto sobre ese total.

   LA VENTANA. El día del juego se abre durante un rato — dos horas
   por defecto — y dentro de ese rato juegas tus cuartos cuando
   quieras: uno ahora, practicas un poco, el siguiente más tarde. El
   reloj del cuarto es el de siempre. Lo que manda es la hora del
   servidor, no la del teléfono, que se cambia en dos toques.

   SE CIERRA LA VENTANA Y SE ACABÓ. Lo que no jugaste vale cero. Un
   cuarto a medias cuando cierra también vale cero: por eso el que va
   quedando corto conviene que lo empiece con tiempo.

   CADA CUARTO SE GUARDA SOLO. En cuanto suena la chicharra, ese
   cuarto se manda y queda en el servidor. Si se muere el teléfono en
   el tercero, los dos primeros ya están puestos y se puede seguir
   desde donde iba mientras la ventana siga abierta. Un juego es uno
   solo: no se puede repetir un cuarto ya guardado.

   NUNCA EN EL CASCO. En un enlace de juego el botón de la cabeza no
   existe. El casco es para practicar.
   ══════════════════════════════════════════════════════════════════ */
var SB_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

var par=null;
try{ par=new URLSearchParams(location.search) }catch(e){}
function pr(k){ try{ return par?par.get(k):null }catch(e){ return null } }

var RETO=pr('c'), JUGADOR=pr('p'), LLAVE_RUN=pr('k');
/* LA DEMOSTRACIÓN.

   ?demo=1 arranca el scrimmage sin pasar por la portada y, al
   sonar la chicharra del cuarto cuarto, ofrece volver a
   demo.html con el total. Nada más: el scrimmage ya era un
   juego entero sin reto, sin padrinos y sin servidor.

   Existe porque enseñar esto en una banda son cuatro minutos y
   un teléfono prestado. El entrenador juega, ve su número, y la
   página siguiente le dice qué habría recaudado. Sin eso, el
   juego termina en una puntuación y la conversación se queda
   ahí. */
var JUEGO = !!(RETO && JUGADOR && LLAVE_RUN && pr('official')==='1');
/* ?demo=1 ya no toca el reloj —eso lo decide el scrimmage— y sólo
   cambia a dónde lleva el botón del final: a demo.html con el
   total, en vez de ofrecer otro scrimmage.

   Sigue apagado en una corrida oficial. Ahí el final manda el
   cuarto al servidor y la pantalla es la del juego de verdad; un
   parámetro pegado al final de un enlace no tiene por qué poder
   desviar eso a una página de venta. Va DESPUÉS de JUEGO a
   propósito: escrito antes, JUEGO todavía vale undefined. */
var DEMO = pr('demo')==='1' && !JUEGO;
var CUARTOS=4;

/* EL SCRIMMAGE.

   El juego completo — cuatro cuartos, reloj, chicharra, marcador —
   pero sin reto, sin padrinos y sin servidor. Nada sale de este
   teléfono.

   Hace falta porque practicar y jugar son cosas distintas, y hasta
   ahora sólo se podía ensayar la primera. Una tirada suelta no
   enseña a administrar cuatro cuartos: cuándo apretar, qué se siente
   ir corto en el tercero, cuánto cansa. Eso sólo se aprende jugándolo
   entero, y nadie debería estrenarse en eso el día que hay dinero
   encima.

   Y de paso sirve para enseñarlo: se juega uno delante de quien sea,
   con cero papeleo. */
var AMISTOSO=false;
function enCuartos(){ return JUEGO || AMISTOSO }

var cuartos=[];          // [{q,points,level}] lo que ya está guardado
var cuartoActual=0;      // el que se está jugando ahora, 0 = ninguno
var enPractica=false;    // practicando entre cuartos
var quienJuega='', programa='';
var ventanaBase=0, ventanaMs=0, ventanaViva=false;
var finDelJuego=false;

function quedaVentana(){
  if(!ventanaViva) return 0;
  return ventanaMs - (performance.now()-ventanaBase);
}
function cuartosHechos(){ return cuartos.length }
function totalJuego(){
  var t=0; for(var i=0;i<cuartos.length;i++) t+=cuartos[i].points||0; return t;
}
function cuartoDe(q){
  for(var i=0;i<cuartos.length;i++) if(cuartos[i].q===q) return cuartos[i];
  return null;
}
function proximoCuarto(){
  for(var q=1;q<=CUARTOS;q++) if(!cuartoDe(q)) return q;
  return 0;
}

function rpc(nombre, cuerpo, listo, falla){
  fetch(SB_URL+'/rest/v1/rpc/'+nombre,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
             'Content-Type':'application/json'},
    body:JSON.stringify(cuerpo)
  })
  .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json() })
  .then(function(d){ listo(d) })
  .catch(function(e){ if(falla) falla(e) });
}

/* El marcador de cuartos, pintado en cualquier sitio donde quepa. */
function pintarCaja(el, resalta){
  if(!el) return;
  var h='';
  for(var q=1;q<=CUARTOS;q++){
    var c=cuartoDe(q);
    var clase = q===resalta ? ' class="vivo"' : (c ? (c.points?'':' class="cero"') : ' class="cero"');
    var val = c ? String(c.points) : (q===resalta ? '·' : '—');
    h += '<div'+clase+'><b>Q'+q+'</b><span>'+val+'</span></div>';
  }
  h += '<div class="tot"><b>'+T('total')+'</b><span>'+totalJuego()+'</span></div>';
  el.innerHTML=h;
  el.hidden=false;
}

/* Cuánto queda de ventana, en palabras cortas para la portada. */
function textoVentana(){
  var ms=quedaVentana();
  if(ms<=0) return T('ventanaCerrada');
  var min=Math.ceil(ms/60000);
  if(min>=60){
    var h=Math.floor(min/60), m=min%60;
    return T('ventanaQueda').replace('{T}', h+'h'+(m?' '+m+'m':''));
  }
  return T('ventanaQueda').replace('{T}', min+' min');
}

function pintarTapaJuego(){
  if(!JUEGO) return;
  $('goCabeza').hidden=true;      // el juego no se juega con la cabeza, nunca
  $('goAmistoso').hidden=true;    // ni se practica a medias: es su juego
  $('tapaReq').hidden=true;
  $('tapaMod').hidden=true;
  $('tapaQuien').hidden=false;
  $('tapaQuien').textContent=(programa?programa+' · ':'')+(quienJuega||'');
  pintarCaja($('cajaTapa'), 0);
  $('tapaVentana').hidden=false;
  $('tapaVentana').textContent=textoVentana();

  var q=proximoCuarto();
  if(finDelJuego || !q || quedaVentana()<=0){
    $('tapaP').textContent=T('juegoHecho');
    $('go').hidden=true;
  }else{
    /* {M} y no un «5 minutos» escrito a mano: un scrimmage son
       cuartos de un minuto y una corrida oficial de cinco, y esta
       misma línea la leen los dos. */
    $('tapaP').textContent=T('juegoP').replace('{Q}', q).replace('{M}', cuantoDura());
    $('go').hidden=false;
    $('go').textContent=(q===1?T('empezarQ'):T('seguirQ')).replace('{Q}', q);
  }
  $('tapaS').textContent=T('juegoS');
}

/* Traer del servidor quién es, cuándo cierra, y qué cuartos ya tiene.
   Es también lo que hace que volver a abrir el enlace después de un
   teléfono muerto continúe donde iba. */
function traerEstadoJuego(){
  $('tapaP').textContent=T('cargando');
  $('go').hidden=true;
  rpc('cp_game_state',{p_challenge:RETO,p_player:JUGADOR,p_key:LLAVE_RUN},
    function(d){
      if(!d || !d.ok){
        $('tapaP').textContent = T('juegoNo'+(d&&d.reason==='key'?'Llave':
                                 (d&&d.reason==='window'?'Ventana':'')))||T('juegoNo');
        $('go').hidden=true;
        return;
      }
      quienJuega=d.name||''; programa=d.program||'';
      cuartos=(d.quarters||[]).slice();
      var cierra=Date.parse(d.closes_at||''), ahora=Date.parse(d.now||'');
      if(cierra && ahora){
        ventanaMs=cierra-ahora; ventanaBase=performance.now(); ventanaViva=true;
      }
      pintarTapaJuego();
    },
    function(){
      $('tapaP').textContent=T('sinRed');
      $('go').hidden=true;
      temporizadores.push(setTimeout(traerEstadoJuego, 4000));
    });
}

/* Guardar un cuarto. Si la red falla se reintenta sola: el nene ya
   jugó esos cinco minutos y perderlos por una barra de señal sería
   imperdonable. */
var mandando=false;
function guardarCuarto(q, nivel, puntos, cuandoTermine){
  mandando=true;
  var intentos=0;
  function va(){
    intentos++;
    rpc('cp_record_quarter',
      {p_challenge:RETO,p_player:JUGADOR,p_key:LLAVE_RUN,
       p_quarter:q,p_level:nivel,p_points:puntos},
      function(d){
        mandando=false;
        if(d && d.ok){
          cuartos=(d.quarters||[]).slice();
        }else if(d && d.reason==='already'){
          cuartos=(d.quarters||cuartos).slice();   // ya estaba: no se repite
        }else{
          // ventana cerrada, llave mala: el cuarto no entra y se dice
          finDelJuego = (d && d.reason==='window') || finDelJuego;
        }
        cuandoTermine(d&&d.ok);
      },
      function(){
        if(intentos<6){ temporizadores.push(setTimeout(va, 1500*intentos)); return }
        mandando=false;
        cuandoTermine(false);
      });
  }
  va();
}

// ──────────────────────────────────────────────────────────────────
//  TOCAR, HACER CLIC, O LAS TECLAS
//
//  Nada de "aguantar la vista": eso es del casco, donde no hay dedo.
//  pointerdown y no click, para que la bola responda en el instante en
//  que se toca — con click hay un retraso de medio parpadeo en algunos
//  teléfonos y se siente flojo.
// ──────────────────────────────────────────────────────────────────
var pos2=new THREE.Vector2();
function bolaEn(x,y){
  if(!raycaster) return -1;
  pos2.set((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
  raycaster.setFromCamera(pos2, camera);
  var hit=raycaster.intersectObjects(balls);
  return hit.length ? hit[0].object.userData.i : -1;
}
addEventListener('pointerdown',function(e){
  if(fase!=='turno' && fase!=='listo') return;
  var i=bolaEn(e.clientX,e.clientY);
  if(i>=0) elegir(i);
},{passive:true});

/* Con ratón, encender un poco la bola por encima de la que está el
   cursor. Es la única pista de puntería que hace falta aquí, y le
   dice al que juega que el juego está vivo antes de que toque nada. */
var encima=-1;
addEventListener('pointermove',function(e){
  if(!HAY_FINO||!renderer||MODO==='cabeza') return;
  var i=(fase==='turno'||fase==='listo') ? bolaEn(e.clientX,e.clientY) : -1;
  if(i===encima) return;
  if(encima>=0 && encima!==i && balls[encima].material.emissive.getHex()===0x2A2016)
    apagar(encima);
  encima=i;
  if(i>=0 && balls[i].material.emissive.getHex()===0x000000)
    balls[i].material.emissive.setHex(0x2A2016);
  renderer.domElement.style.cursor = i>=0 ? 'pointer' : 'default';
},{passive:true});

/* Teclas para la computadora: repetir una cadena de nueve con el
   ratón cansa, y el que practica en serio practica más rápido con los
   dedos ya puestos. De izquierda a derecha y de arriba abajo, como se
   ve en la pantalla. */
var TECLAS={'1':0,'2':1,'3':2,'4':3,'5':4};
addEventListener('keydown',function(e){
  if(fase==='tiempo' && (e.key==='Enter'||e.key===' ')){ armarSesion(); return }
  var i=TECLAS[e.key];
  if(i!==undefined) elegir(i);
});

// ──────────────────────────────────────────────────────────────────
//  EL BUCLE. Aquí no decide nada: pinta. Lo que cambia el juego lo
//  cambian los toques y los temporizadores.
// ──────────────────────────────────────────────────────────────────
function bucle(){
  requestAnimationFrame(bucle);
  if(!renderer) return;
  /* Mientras se mide, todo lo demás está parado: lo que se está
     midiendo es la cabeza, y cualquier cosa moviéndose en la pantalla
     invita a seguirla con la vista y falsea la lectura. */
  if(medir.activo){ pintarMedida(); pasoDeMedida(); renderer.render(scene,camera); return }

  /* El reloj se pinta y se vence aquí, en un solo sitio, pase lo que
     pase por debajo. Por eso sigue corriendo mientras se enseña la
     puntuación: es tiempo corrido, no se para entre tiradas. */
  /* La ventana manda por encima del reloj del cuarto: si cierra a
     mitad, ese cuarto vale 0 y el juego se acaba ahí. */
  if(JUEGO && ventanaViva && !finDelJuego && fase!=='tiempo' &&
     fase!=='tapa' && quedaVentana()<=0){
    /* Si cerró mientras calentaba, el juego se acabó igual: lo que
       no jugó vale cero, y seguir practicando sobre un juego cerrado
       sería dejarle creer que todavía cuenta. */
    if(enPractica){ limpiarT(); pararCuenta(); enPractica=false; finDeJuego() }
    else terminarSesion(true);
    renderer.render(scene,camera); return;
  }
  if(relojCorriendo){
    pintarReloj();
    if(quedaMs()<=0){ terminarSesion(); renderer.render(scene,camera); return }
  }

  /* La del medio late mientras la tanda está armada: es lo que dice
     "yo soy el botón" sin escribirlo en ningún sitio. Y «la del medio»
     es la del medio de ESTA zona — en el 2-3 es la del fondo y en el
     3-2 la de arriba, pero las cuatro tienen una en x=0, que es la que
     está siempre al frente y no hay que buscar. */
  if(fase==='listo' && balls.length){
    var l=(Math.sin(performance.now()/420)+1)/2;
    var v=0.10+l*0.52, bc=balls[centroZona()];
    bc.material.emissive.setRGB(v, v*0.82, v*0.5);
    bc.scale.setScalar(bc.userData.base*(1+l*0.09));
  }

  if(MODO==='cabeza') cabezaEnElBucle();
  if(fase==='fin') cuentaEnElBucle();
  renderer.render(scene,camera);
}

// ──────────────────────────────────────────────────────────────────
//  ARRANQUE
// ──────────────────────────────────────────────────────────────────
pintarTextos();
if(JUEGO) traerEstadoJuego();

function arrancar(que){
  var conCabeza = (que==='cabeza');
  if(JUEGO) conCabeza=false;      // el juego nunca se juega con la cabeza
  if(typeof THREE==='undefined'){
    $('tapaP').textContent = LANG==='es'
      ? 'No cargó three.js — sin red, o bloqueado.'
      : 'three.js did not load — no network, or blocked.';
    return;
  }
  abrirAudio();          // el audio sólo abre dentro de un toque de verdad
  if(conCabeza){
    MODO='cabeza';
    pedirElGiro();       // el iPhone sólo lo da si se pide aquí
    $('mira').hidden=false;
    $('crudo').hidden=false;
    /* A pantalla completa: en el casco, la barra del navegador se
       come un trozo de la vista y encima es otra cosa que se puede
       tocar sin querer. */
    try{ if(document.documentElement.requestFullscreen)
           document.documentElement.requestFullscreen() }catch(e){}
    /* Y que no se apague sola entre jugador y jugador. Si el casco no
       conoce esto, no pasa nada: el dibujo corriendo ya lo mantiene
       despierto en casi todos. */
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}) }catch(e){}
  }
  $('tapa').hidden=true;
  $('lang').style.display='none';
  if(!renderer){ construir(); bucle() }
  colocarBolas();
  /* Si este casco no se ha medido nunca, primero se mide: son siete
     segundos y pasa UNA vez en la vida del casco. Si ya está medido,
     se arranca directo — pero poniendo el frente donde esté la cara
     ahora mismo, que el cero guardado es de la última vez y el casco
     pudo haber despertado mirando a la pared. */
  if(MODO==='cabeza' && !calHecha){ empezarMedida(); return }
  if(MODO==='cabeza') recentrar();
  if(JUEGO){ armarCuarto(proximoCuarto()); return }
  /* En demostración NO se arranca solo. El cuarto lleva reloj, y
     cinco minutos corriendo mientras el teléfono todavía está
     cambiando de mano son cinco minutos del entrenador. El toque
     en «Scrimmage» es él diciendo que está listo. */
  if(que==='amistoso'){ empezarAmistoso(); return }
  armarSesion();
}
$('go').onclick=function(){ arrancar('practica') };
$('goCabeza').onclick=function(){ arrancar('cabeza') };
$('otra').onclick=function(){
  pararCuenta();
  if(DEMO && finDelJuego && !enPractica){
    location.href = 'demo.html?p=' + encodeURIComponent(String(totalJuego()));
    return;
  }
  if(AMISTOSO && !enPractica){
    if(finDelJuego){ empezarAmistoso(); return }   // otro scrimmage entero
    var qa=proximoCuarto();
    if(qa) armarCuarto(qa); else empezarAmistoso();
    return;
  }
  if(!JUEGO){ armarSesion(); return }
  /* Hay un cuarto sin guardar: lo único que se puede hacer es
     volver a mandarlo. */
  if(cuartoPendiente){
    var c=cuartoPendiente;
    $('otra').hidden=true; $('finP').textContent=T('guardando');
    cerrarCuarto(c.q, c.nivel, false);
    return;
  }
  if(enPractica){ volverAPortada(); return }
  var q=proximoCuarto();
  if(q && !finDelJuego && quedaVentana()>0) armarCuarto(q); else volverAPortada();
};
$('practicar').onclick=function(){ pararCuenta(); armarPractica() };
$('goAmistoso').onclick=function(){ arrancar('amistoso') };
})();
