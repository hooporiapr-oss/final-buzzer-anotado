/* ══════════════════════════════════════════════════════════════════
   LA PÁGINA DEL PADRINO

   Aquí llega alguien por un enlace que le mandó un nene — la mamá, el
   tío, el vecino, el negocio de la esquina. Casi nunca sabe qué es
   esto. Así que la página tiene UN trabajo: explicar el trato en diez
   segundos y recoger la promesa sin hacerle una cuenta de cabeza.

   El trato: el nene juega cuatro cuartos de cinco minutos, el juego
   saca el marcador, y el padrino promete unos centavos por punto.

   Tres cosas que esta página no hace, y son a propósito:

   · No cobra nada, aquí ni después. Cada Punto Cuenta no procesa pagos: el
     padrino le paga al programa, directo, cuando el programa le diga.
   · No deja prometer una vez empezado el juego. Después ya se sabe
     cuánto anotó, y prometer sabiendo el resultado no es prometer.
   · No esconde la cuenta. Se enseña el número con el marcador típico
     delante, no en letra chica.
   ══════════════════════════════════════════════════════════════════ */
:root{--ink:#07141E;--paper:#EAF2F7;--mute:#7A96A9;--line:#1B3A4F;--panel:#0E2232;
      --gold:#FF8A2B;--green:#4FD3F0;--warn:#FFC247}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.6;
  -webkit-text-size-adjust:100%}
.wrap{width:min(560px,92vw);margin:0 auto;padding:0 0 60px}
header{border-bottom:1px solid var(--line);margin:0 0 26px}
.bar{display:flex;align-items:center;justify-content:space-between;

.mark{font-weight:900;color:#fff;text-decoration:none;font-size:1rem}
.mark em{font-style:normal;color:#4FD3F0}
.mark i{font-style:normal;color:#7A96A9}
#lang{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

h1 em{font-style:normal;color:var(--gold)}
.prog{color:var(--green);font-weight:900;font-size:.95rem;margin:0 0 16px}
.trato{color:#C8D6E2;font-size:1rem;margin:0 0 6px}
.cuando{color:var(--warn);font-weight:800;font-size:.86rem;margin:14px 0 0}

.caja{display:flex;gap:3px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.caja div{min-width:58px;padding:8px 5px;background:var(--panel);
  border:1px solid var(--line);border-radius:5px;text-align:center}
.caja div.tot{background:rgba(255,138,43,.13);border-color:rgba(255,138,43,.42)}
.caja b{display:block;font-size:.55rem;font-weight:900;letter-spacing:.13em;
  color:var(--mute);text-transform:uppercase}
.caja span{display:block;font-size:1.2rem;font-weight:900;line-height:1.3}
.caja div.tot span{color:var(--gold)}

form{margin:26px 0 0}
label{display:block;font-size:.72rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);margin:0 0 7px}
.campo{margin:0 0 18px}
input{width:100%;font:inherit;font-size:1rem;padding:13px;border:1px solid var(--line);

input:focus{outline:2px solid var(--gold);outline-offset:1px}
.ayuda{color:var(--mute);font-size:.8rem;margin:7px 0 0}

/* Los centavos por punto. Botones de verdad, no una lista. */
.tarifas{display:flex;gap:8px;flex-wrap:wrap}
.tarifa{flex:1 1 0;min-width:86px;background:var(--panel);color:var(--paper);
  border:2px solid var(--line);border-radius:8px;padding:13px 6px;cursor:pointer;
  font:inherit;font-weight:900;font-size:1.15rem;line-height:1.2}
.tarifa small{display:block;font-size:.6rem;font-weight:900;letter-spacing:.1em;
  color:var(--mute);text-transform:uppercase;margin-top:3px}
.tarifa.on{border-color:var(--gold);background:rgba(255,138,43,.13);color:var(--gold)}
.tarifa.on small{color:var(--gold)}

.cuenta{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);

.cuenta b{color:#fff}
.cuenta .tot{color:var(--gold);font-weight:900}

button.enviar{width:100%;background:var(--gold);color:#0B1724;border:0;border-radius:8px;
  font:inherit;font-weight:900;font-size:1.05rem;padding:16px;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.38)}

button.volver{margin:18px auto 0;display:block;background:none;color:var(--mute);
  border:1px solid var(--line);border-radius:7px;font:inherit;font-weight:800;

/* ══ LA MARCA ══════════════════════════════════════════════════
   cada (hueso) · punto (naranja) · cuenta (cian), a 23px con peso
   800 y el espaciado cerrado — la que lleva padrinos.html. Es la
   marca, no un enlace del menú, y a 16px con peso 900 parecía lo
   segundo: apretada, pequeña y sin aire entre las letras.

   El espaciado va en em y no en px para que siga cerrado si alguna
   página la pinta a otro tamaño. */
.mark, .mark .wm{
  color:#EAF2F7 !important;text-decoration:none !important;
  font-size:23px !important;font-weight:800 !important;
  letter-spacing:-.035em !important;line-height:1.1}
/* Aquí había dos reglas para el color de la marca —em naranja, i
   azul— que venían de la marca de tres palabras de Cada Punto, donde
   el naranja caía sobre "punto" y el azul sobre "cuenta". Quitadas:
   no pintaban nada, porque más abajo la piel de documento las gana
   con !important, y dejar reglas muertas que dicen un color distinto
   del que se ve es cómo se pierde media hora.

   El color de la marca en esta página se decide en un solo sitio, el
   bloque de la cabecera: sobre crema, el nombre en navy y el punto
   naranja. Si hay que cambiarlo, es ahí. */
/* En un teléfono estrecho, que no empuje al botón de idioma. */
@media(max-width:380px){
  .mark, .mark .wm{font-size:20px !important}
}

/* ══════════════════════════════════════════════════════════════
   EL LOOK NUEVO — crema, navy y naranja
   18 de octubre de 2026

   Esta página es la que abre un padrino cuando le llega el enlace,
   así que tiene que parecerse al resto del sitio y no al juego.

   Va al final y manda encima: la geometría de arriba no se toca.
   Ojo con los nombres, que aquí están al revés de otras páginas —
   --ink es el FONDO y --paper es el TEXTO — así que se cruzan.
   ══════════════════════════════════════════════════════════════ */
:root{
  --navy:#101c2a; --orange:#ff7a18; --cream:#faf8f4; --linea:#e7e6e2;
  /* Cruzados a propósito: ink era el oscuro del fondo. */
  --ink:#faf8f4; --paper:#1b2937;
  --mute:#617083; --line:#e7e6e2; --panel:#ffffff;
  --gold:#ff7a18; --green:#0b7a5a; --warn:#8a5a00;
}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}

/* La cabecera: sobre crema, la marca va en navy y el punto naranja. */
header{border-bottom:1px solid var(--linea)}
.mark, .mark .wm{color:var(--navy) !important}
.mark em, .wm em{color:var(--navy) !important}
.mark i, .wm i{color:var(--orange) !important}
#lang{border:1px solid var(--linea);color:var(--mute);background:#fff;border-radius:7px}
#lang:hover{border-color:var(--orange);color:var(--orange)}

.kick{color:var(--orange)}
h1 em{color:var(--orange)}
.prog, .cuando, .ayuda, .trato{color:var(--mute)}

/* Los paneles, blancos con su sombra. */
.caja, .cuenta, .cerrado, .listo, .aviso{
  background:#fff;border:1px solid var(--linea);border-radius:14px;
  box-shadow:0 8px 25px #17243806;color:var(--paper)}
.caja span, .caja div.tot span{color:var(--mute)}
.caja b, .cuenta b{color:var(--paper)}

/* Lo que se escribe. */
.campo input, input{background:#fff;border:1px solid #d6d9d6;border-radius:10px;
  color:var(--paper)}
input::placeholder{color:#9aa6b2}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,24,.18);outline:none}

/* Las tarifas: fichas claras, y la escogida en naranja. */
.tarifa{background:#fff;border:1px solid var(--linea);color:var(--paper)}
.tarifa small{color:var(--mute)}
.tarifa.on{background:var(--orange);border-color:var(--orange);color:#111a24}
.tarifa.on small{color:#111a24}

button.enviar{background:var(--orange);border:0;color:#111a24;border-radius:9px;font-weight:800}
button.enviar:disabled{opacity:.5}
button.volver{background:transparent;border:1px solid var(--navy);color:var(--navy);
  border-radius:9px}
button.volver:hover{background:var(--navy);color:#fff}

.estado.mal{color:#b4231c}
.estado.bien{color:var(--green)}
.cerrado h2{color:var(--paper)}
.cerrado p{color:var(--mute)}
.listo .grande{color:var(--orange)}
.pie, .pie a{color:var(--mute)}
.pie a:hover{color:var(--orange)}

/* ══ La barra, el menú y el idioma ══════════════════════════════════
   Puesto al final de la hoja a propósito: lo que haya escrito arriba
   sobre header, .bar o .langb queda debajo de esto.

   --barra tiene que ser la MISMA altura en los dos sitios donde se
   usa: el hueco que deja scroll-padding para que un ancla no quede
   detrás de la cabecera, y el punto donde arranca el panel. */
:root{--barra:66px}
html{scroll-padding-top:calc(var(--barra) + 10px)}
/* overflow-x en el body y no sólo en html: en Safari de iOS, html
   solo no lo sujeta y basta un elemento ancho para arrastrar la
   página de lado. */
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:100;
  padding-top:env(safe-area-inset-top,0px)}
header .bar{min-height:var(--barra);padding:0;gap:10px}
/* El botón del idioma dice el idioma AL QUE lleva, no el que está
   puesto. Por eso necesita sitio para una palabra y no para dos
   letras, y nowrap para que «Español» no se parta en dos líneas. */
.langb,#lang{white-space:nowrap;min-height:40px;font-size:.85rem;
  padding:0 12px;border-radius:9px;font-family:inherit}
.barra-dcha{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Las rayas se pintan con currentColor, no con blanco: prometer.html
   tiene la barra en crema con la marca en navy, y unas rayas
   blancas ahí no se ven. Heredando el color de la barra valen para
   las dos, y para la próxima página que cambie de fondo. Lo
   encontró una captura, no la prueba: la prueba miraba que el botón
   estuviera, no que se viera. */
/* El color de las rayas sale de la barra, y la barra de estas
   páginas no declaraba ninguno: heredaban la tinta del cuerpo
   —navy sobre navy— y el botón se veía con 1.2:1 de contraste,
   que es no verse. Esta barra es crema, así que al revés. */
header{color:#101c2a}
.hamb{display:none;width:44px;height:44px;flex:0 0 44px;color:inherit;
  border:1px solid currentColor;background:transparent;border-radius:9px;
  cursor:pointer;padding:0;align-items:center;justify-content:center}
@supports (border-color: color-mix(in srgb, currentColor 45%, transparent)){
  .hamb{border-color: color-mix(in srgb, currentColor 45%, transparent)}
}
.hamb:hover{border-color:var(--orange);color:var(--orange)}
/* color:inherit en la propia raya y no sólo en el botón: privacy
   y terms traen un `strong,b{color:var(--ink)}` para el texto, y
   currentColor dentro de un <b> resuelve al color DEL <b>, no al
   del padre. Las rayas salían navy sobre navy. */
.hamb b{display:block;width:20px;height:2px;color:inherit;
  background:currentColor;border-radius:2px;
  position:relative;transition:background .18s ease}
.hamb b::before,.hamb b::after{content:'';position:absolute;left:0;
  width:20px;height:2px;background:currentColor;border-radius:2px;transition:transform .18s ease}
.hamb b::before{top:-6px}
.hamb b::after{top:6px}
.hamb[aria-expanded="true"] b{background:transparent}
.hamb[aria-expanded="true"] b::before{transform:translateY(6px) rotate(45deg)}
.hamb[aria-expanded="true"] b::after{transform:translateY(-6px) rotate(-45deg)}

.menu{position:absolute;left:0;right:0;top:100%;
  display:flex;flex-direction:column;align-items:stretch;
  background:var(--navy);border-bottom:1px solid #ffffff22;
  /* Cerrado con max-height para que tenga transición, y con
     visibility para que el teclado no se meta dentro: max-height
     sola deja los enlaces tabulables en un panel invisible. */
  max-height:0;visibility:hidden;overflow:hidden;
  transition:max-height .22s ease,visibility .22s}
.menu.abierto{max-height:80vh;visibility:visible;overflow:auto}
.menu a{display:flex;align-items:center;min-height:52px;
  padding:0 max(20px,calc((100vw - 900px)/2 + 20px));
  color:#fff;text-decoration:none;font-weight:600;font-size:1rem;
  border-top:1px solid #ffffff14}
.menu a:first-child{border-top:0}
.menu a:hover{color:var(--orange)}
.menu a.cta{margin:14px 20px 18px;justify-content:center;border-top:0;
  background:var(--orange);color:#111a24;font-weight:800;border-radius:9px}
.menu a.cta:hover{color:#111a24}
/* Las rayas se ven siempre: estas páginas no tienen enlaces en la
   barra en ningún tamaño, así que el menú es la única puerta y
   esconderlo en escritorio dejaría la página sin salida otra vez. */
.hamb{display:flex}
@media(max-width:430px){
:root{--barra:60px}
.langb,#lang{padding:0 10px;font-size:.8rem}
}
</style>
</head>

  yaVan1:'1 persona ya prometió en este juego.',
  listoH:'Listo. Eres su padrino.',
  listoP:'Al publicarse el marcador te llega un aviso con el resultado y lo que dio tu promesa. Le pagas directo al programa — Cada Punto Cuenta no te va a cobrar nada.',
  volver:'Cambiar mi promesa',
  otraVez:'Ya tenías una promesa para este juego — la actualizamos con lo que acabas de poner.',
  noVa:'Este enlace no abre una promesa.',
  total:'Tot',
  pie:'Cada Punto Cuenta es un sistema de manejo de promesas de Gostar Digital LLC. No procesamos pagos: le pagas al programa, directo.'
 },
 en:{
  kick:'Pledge by the point',
  trato:'You pledge a few cents for every point the team scores in this game. Win or lose, every point counts.',
  cuandoAbre:'The game is on {F}. Pledging closes when the score is posted.',
  cuandoSin:'No date yet. You can pledge from now.',
  lTarifa:'How much a point?',
  ayudaTarifa:'A youth team runs about {P} points in a game.',
  lTope:'Cap (optional)',
  ayudaTope:'Your pledge never goes above this, however much they score. $5 minimum.',
  lNom:'Your name',
  lMail:'Your email',
  ayudaMail:'So we can send you the final score and what your pledge came to. Nothing else.',
  enviar:'Pledge',
  cuenta:'If they score <b>{P} points</b>, your pledge comes to <span class="tot">{A}</span> for the program.',
  cuentaTope:'With your {C} cap, never more than <span class="tot">{M}</span>.',
  cuentaPiso:'Heads up: at that rate they would need {N} points to reach the $5 minimum. Below it the pledge closes and nothing is owed.',
  aviso:'Nothing is charged now, and nothing here later. When the score is posted you get one notice with the result and what your pledge came to — no payment link — and you pay the program directly. If the total comes to less than $5, the pledge closes and nothing is owed.',
  mandando:'Sending…',
  malNom:'Write your name.',
  malMail:'Check the email.',
  malTope:'The minimum cap is $5.',
  malTarifa:'That rate is too high. Check a zero did not slip in.',
  malRed:'That did not work. Check your connection and try again.',
  cerrada:'Pledging has closed',
  cerradaP:'The score is already in, so this pledge is late. But the team plays again — ask them for the next link.',
  cancelada:'This game was not played',
  canceladaP:'The game was cancelled, so there is nothing to pledge on. Nobody owes anything.',
  jugado:'Final score',
  yaVan:'{N} people have already pledged on this game.',
  yaVan1:'1 person has already pledged on this game.',
  listoH:'Done. You are their padrino.',
  listoP:'When the score is posted you get one notice with the result and what your pledge came to. You pay the program directly — Cada Punto Cuenta will not charge you anything.',
  volver:'Change my pledge',
  otraVez:'You already had a pledge on this game — we updated it with what you just put in.',
  noVa:'This link does not open a pledge.',
  total:'Tot',
  pie:'Cada Punto Cuenta is a pledge management system by Gostar Digital LLC. We do not process payments: you pay the program, directly.'
 }
};
var LANG='es';
try{ LANG=localStorage.getItem('cfh_lang')||localStorage.getItem('cp-lang')||
  ((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en') }catch(e){}
function T(k){ return (S[LANG]&&S[LANG][k])||S.es[k] }
function $(id){ return document.getElementById(id) }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

var par=new URLSearchParams(location.search);
/* Un solo parámetro: el juego. `?c=` y `?p=` eran el reto y el
   alumno del producto retirado. */
var GAME=par.get('g');

/* Ya no hay cargo que sumarle al padrino: Cada Punto Cuenta se licencia al
   programa por evento y al padrino no se le cobra nada. Lo
   que se enseña es la promesa, y nada más. */
/* Para la cuenta de ejemplo. No es una promesa de cuánto va a anotar:
   es el único número honesto que tenemos para que el padrino sepa en
   qué orden de magnitud se está metiendo. */
/* UN JUEGO, NO UNA TEMPORADA. 150 puntos era el total acumulado de
   un reto entero; un equipo juvenil anota unos 55 en un juego. Dejar
   el 150 haría que un padrino escogiera su tarifa contra un número
   casi tres veces mayor que el que va a salir.

   Y las tarifas se subieron por la misma razón. A 5¢ por punto, 55
   puntos son $2.75: por debajo del mínimo de $5, así que la opción
   que venía marcada por defecto producía una promesa que no recauda
   nada. Ofrecer eso como primera opción es ofrecer la nada. */
var TIPICO=55;
var TARIFAS=[0.10,0.25,0.50];
var tarifa=0.25;

function dinero(n){ return '$'+(Math.round(n*100)/100).toFixed(2) }

function rpc(nombre, cuerpo, listo, falla){
  fetch(SB_URL+'/rest/v1/rpc/'+nombre,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(cuerpo)
  }).then(function(r){
    if (r.ok) return r.json();
    /* El cuerpo de un error de PostgREST trae el porqué —message,
       hint, details— y esta línea lo tiraba: lanzaba 'http 400' y
       nada más. Seis páginas se arreglaron en su día y ésta se
       quedó, que es la que toca un padrino: cualquier fallo le salía
       como problema de internet, también cuando el problema era la
       base, y de la razón no quedaba rastro en ningún sitio. */
    return r.text().then(function(t){
      var d = {}; try { d = JSON.parse(t) } catch(x){}
      var e = new Error(d.message || d.hint || t || ('rpc ' + r.status));
      e.detalle = d.details || d.hint || '';
      e.codigo  = d.code || r.status;
      throw e;
    });
  })
    .then(listo).catch(function(e){ if(falla) falla(e) });
}

/* El porqué, cuando lo hay. Recortado: esto es una línea debajo de
   un botón, no un registro. */
function porque(x){
  if (!x) return '';
  var r = (typeof x === 'string') ? x
        : (x.why || x.error || x.message || x.hint || x.detalle || '');
  return r ? ' — ' + String(r).slice(0, 160) : '';
}

function pintarTarifas(){
  var h='';
  for(var i=0;i<TARIFAS.length;i++){
    var t=TARIFAS[i], cent=Math.round(t*100);
    h+='<button type="button" class="tarifa'+(t===tarifa?' on':'')+'" data-t="'+t+'">'+
       cent+'¢<small>'+(LANG==='es'?'por punto':'per point')+'</small></button>';
  }
  $('tarifas').innerHTML=h;
  var bs=$('tarifas').querySelectorAll('.tarifa');
  for(var j=0;j<bs.length;j++) bs[j].onclick=function(){
    tarifa=parseFloat(this.getAttribute('data-t'));
    pintarTarifas(); pintarCuenta();
  };
}

function pintarCuenta(){
  var base=tarifa*TIPICO;
  var txt=T('cuenta').replace('{P}',TIPICO).replace('{A}',dinero(base));
  var tope=parseFloat($('tope').value);
  if(tope>=5) txt+='<br>'+T('cuentaTope').replace('{C}',dinero(tope))
                      .replace('{M}',dinero(tope));

  /* EL PISO, DICHO MIENTRAS SE ESCOGE. A 10¢ por punto harían falta
     50 puntos para llegar a $5, y hay juegos que no llegan. Decírselo
     aquí es muy distinto a que lo descubra en el correo del lunes: ahí
     ya no puede hacer nada, y lo que lee es que su promesa no sirvió
     de nada. */
  var piso = (ESTADO && ESTADO.piso_centavos ? ESTADO.piso_centavos : 500)/100;
  var hacenFalta = Math.ceil(piso/tarifa);

  /* El umbral se mide contra un juego FLOJO y no contra uno típico.
     Comparado con los 55 de siempre, el aviso no saltaba nunca —a 10¢
     hacen falta 50, que caben— y era código muerto. Pero 50 de 55 es
     justo lo que no se alcanza la noche que el equipo anota 38, y ésa
     es exactamente la noche en la que un padrino que prometió 10¢ se
     entera por correo de que su promesa no sirvió de nada. */
  if (hacenFalta > TIPICO * 0.75)
    txt += '<br><span class="ojo">'+T('cuentaPiso').replace('{N}',hacenFalta)+'</span>';

  $('cuenta').innerHTML=txt;
}

/* UN DÍA DE CALENDARIO NO ES UN INSTANTE.
   `plays_on` llega como "2026-11-07", sin hora. new Date() de eso lo
   lee como medianoche UTC, y Puerto Rico va cuatro horas por detrás:
   el juego del sábado salía el viernes. Lo que trae hora de verdad —un
   timestamptz— sigue por el camino de siempre.

   Y SE QUITÓ LA HORA DE AQUÍ. La sacaba de la misma fecha, así que
   para un día sin hora inventaba una —las 8 de la noche del día
   anterior— y la ponía al lado de la hora de verdad del juego, que se
   pinta aparte. Dos horas distintas en la misma pantalla, una de
   ellas falsa. */
function fecha(iso){
  try{
    var d;
    var solo = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    if (solo) d = new Date(+solo[1], +solo[2] - 1, +solo[3]);
    else      d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(LANG==='es'?'es-PR':'en-US',
      {weekday:'long',day:'numeric',month:'long'});
  }catch(e){ return '' }
}

/* El marcador, cuando ya lo hay. Los cuatro cuartos eran del producto
   por alumno; aquí lo que cuenta es el resultado del juego y los
   puntos del equipo, que es sobre lo que se promete. */
function pintarMarcador(){
  var mios = ESTADO.puntos;
  var suyos = ESTADO.rival_puntos;
  $('caja').innerHTML =
    '<div><b>'+esc(ESTADO.equipo||'')+'</b><span>'+(mios==null?'—':mios)+'</span></div>'+
    '<div><b>'+esc(ESTADO.rival||'')+'</b><span>'+(suyos==null?'—':suyos)+'</span></div>';
  $('caja').hidden=false;
}

function esc(x){ return String(x==null?'':x)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var ESTADO=null;

function pintar(){
  document.documentElement.lang=LANG;
  $('lang').textContent=LANG==='es'?'English':'Español';
  if(!ESTADO) return;
  $('kick').textContent=T('kick');
  /* El EQUIPO es el titular, y el juego la línea de debajo. Un
     padrino promete por su equipo; cuál de sus juegos es el detalle. */
  $('quien').textContent=ESTADO.equipo||'';
  $('programa').textContent=
    (ESTADO.juego||'') +
    (ESTADO.cancha ? ' · ' + ESTADO.cancha : '') +
    (ESTADO.hora   ? ' · ' + ESTADO.hora   : '');
  $('trato').textContent=T('trato');
  /* Cuántos van ya. Sin nombres y sin cifras: que otros doce hayan
     prometido es lo único que un padrino puede saber de los demás, y
     es lo que le dice que esto va en serio. */
  var n = Number(ESTADO.promesas||0);
  $('yaVan').textContent = n <= 0 ? ''
    : (n === 1 ? T('yaVan1') : T('yaVan').replace('{N}', n));
  $('cuando').textContent = ESTADO.fecha
    ? T('cuandoAbre').replace('{F}', fecha(ESTADO.fecha))
    : T('cuandoSin');
  $('lTarifa').textContent=T('lTarifa');
  $('ayudaTarifa').textContent=T('ayudaTarifa').replace('{P}',TIPICO);
  $('lTope').textContent=T('lTope');
  $('ayudaTope').textContent=T('ayudaTope');
  $('lNom').textContent=T('lNom');
  $('lMail').textContent=T('lMail');
  $('ayudaMail').textContent=T('ayudaMail');
  $('enviar').textContent=T('enviar');
  $('aviso').textContent=T('aviso');
  $('pie').textContent=T('pie');
  /* Cerrado por marcador y cancelado no son lo mismo, y a un padrino
     le importan de maneras distintas: del primero puede pedir el
     enlace del próximo juego; del segundo no hay nada que pedir. */
  $('cerradoH').textContent = ESTADO.cancelado ? T('cancelada') : T('cerrada');
  $('cerradoP').textContent = ESTADO.cancelado ? T('canceladaP') : T('cerradaP');
  $('listoH').textContent=T('listoH');
  $('listoP').textContent=T('listoP');
  $('volver').textContent=T('volver');
  /* El marcador SÓLO cuando ya cerró. Abierta, un marcador hecho le
     estaría diciendo a un padrino que el nene ya anotó — y de paso le
     dejaría prometer sabiendo el resultado, que es justo lo que esta
     página no hace. Pasa de verdad: basta con mover la ventana de un
     reto que ya se jugó. */
  if(!ESTADO.abierto && ESTADO.jugado) pintarMarcador();
  else $('caja').hidden=true;
  pintarTarifas(); pintarCuenta();
}

$('lang').onclick=function(){
  LANG=LANG==='es'?'en':'es';
  try{ localStorage.setItem('cfh_lang',LANG); localStorage.setItem('cp-lang',LANG) }catch(e){}
  pintar();
};
$('tope').oninput=pintarCuenta;

function arrancar(){
  if(!GAME){ $('cargando').textContent=T('noVa'); return }
  rpc('juego_publico',{p_game:GAME}, function(d){
    if(!d||!d.ok){ $('cargando').textContent=T('noVa'); return }
    ESTADO=d;
    $('cargando').hidden=true;
    $('todo').hidden=false;
    if(d.abierto){ $('form').hidden=false } else { $('cerrado').hidden=false }
    pintar();
  }, function(e){
    /* Con la razón delante. Esto reintenta cada cuatro segundos, y
       un fallo que no va a arreglarse solo —un enlace mal copiado,
       un reto que ya no está— se quedaba dando vueltas sin decir
       nunca por qué. El reintento se queda, que un corte de red sí
       se arregla solo; lo que faltaba era la razón. */
    $('cargando').textContent=T('malRed')+porque(e);
    setTimeout(arrancar, 4000);
  });
}

$('form').onsubmit=function(ev){
  ev.preventDefault();
  var nom=$('nom').value.trim(), mail=$('mail').value.trim();
  var tope=$('tope').value?parseFloat($('tope').value):null;
  if(nom.length<2){ return decir(T('malNom'),'mal') }
  if(mail.indexOf('@')<1 || mail.indexOf('.')<0){ return decir(T('malMail'),'mal') }
  if(tope!==null && !(tope>=5)){ return decir(T('malTope'),'mal') }

  $('enviar').disabled=true;
  decir(T('mandando'),'');
  rpc('juego_prometer',{p_game:GAME,p_nombre:nom,p_email:mail,
                        p_tarifa:tarifa,p_tope:tope},
    function(d){
      $('enviar').disabled=false;
      if(d&&d.ok){
        $('form').hidden=true;
        $('listo').hidden=false;
        if(d.cambiada) $('listoP').textContent=T('otraVez');
        return;
      }
      var r=(d&&d.reason)||'';
      /* Si el marcador se publicó mientras esta página estaba abierta,
         no se le dice «error»: se le enseña que cerró, que es lo que
         pasó. */
      if(r==='ya-jugado'||r==='cancelado'||r==='ya-avisado'){
        if(ESTADO) ESTADO.cancelado = (r==='cancelado');
        $('form').hidden=true; $('cerrado').hidden=false; pintar(); return;
      }
      decir(r==='falta-nombre'?T('malNom'):r==='correo'?T('malMail'):
            r==='tope'?T('malTope'):
            (r==='tarifa'||r==='tarifa-alta')?T('malTarifa'):T('malRed'),'mal');
    },
    function(e){ $('enviar').disabled=false; decir(T('malRed')+porque(e),'mal') });
};
function decir(t,c){ var e=$('dice'); e.textContent=t; e.className='estado'+(c?' '+c:'') }

/* Volver al formulario con todo como lo dejó. Mandar otra vez con el
   mismo correo actualiza la promesa, no hace una segunda. */
$('volver').onclick=function(){
  $('listo').hidden=true;
  $('form').hidden=false;
  decir('','');
  $('nom').focus();
};

pintar();
arrancar();
})();
</script>

<script>
/* ══ El menú de la barra ════════════════════════════════════════════
   Vive aparte del sistema de idioma de cada página a propósito: son
   doce páginas con cuatro formas distintas de pintar sus textos, y
   engancharse a cada una sería cuatro maneras de romperse. Esto lee
   el idioma de donde lo deja todo el mundo —localStorage— y pinta
   sus seis enlaces y nada más. */
(function(){
var ROTULOS = {
  en: { inicio:'Home', como:'How it works', precio:'What it costs',
        ayuda:'Questions', mia:'My program', alta:'Sign up a program',
        menu:'Menu', otro:'Español', aOtro:'Cambiar a español' },
  es: { inicio:'Inicio', como:'Cómo funciona', precio:'Cuánto cuesta',
        ayuda:'Preguntas', mia:'Mi programa', alta:'Registra un programa',
        menu:'Menú', otro:'English', aOtro:'Switch to English' }
};
function idioma(){
  try{
    return localStorage.getItem('cfh_lang') || localStorage.getItem('cp-lang') ||
           localStorage.getItem('fc-lang') ||
           ((navigator.language||'').toLowerCase().indexOf('es')===0 ? 'es':'en');
  }catch(e){ return 'es' }
}
var b = document.getElementById('hamb'),
    m = document.getElementById('menu'),
    l = document.getElementById('langBtn') || document.getElementById('lang');
if (!b || !m) return;

function pintar(){
  var t = ROTULOS[idioma()] || ROTULOS.es;
  m.querySelectorAll('[data-m]').forEach(function(a){
    a.textContent = t[a.getAttribute('data-m')] || a.textContent;
  });
  b.setAttribute('aria-label', t.menu);
  /* El botón del idioma lo pinta la propia página, cada una a su
     manera. Aquí sólo se corrige si se quedó con las dos letras
     viejas, para que ninguna página diga «EN» mientras las demás
     dicen «English». */
  if (l && /^(EN|ES)$/.test((l.textContent||'').trim())) {
    l.textContent = t.otro;
    l.setAttribute('aria-label', t.aOtro);
  }
}
function pon(abierto){
  m.classList.toggle('abierto', abierto);
  b.setAttribute('aria-expanded', abierto ? 'true' : 'false');
}
b.addEventListener('click', function(){
  pon(b.getAttribute('aria-expanded') !== 'true');
});
m.addEventListener('click', function(e){ if (e.target.closest('a')) pon(false) });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && b.getAttribute('aria-expanded') === 'true') {
    pon(false); b.focus();
  }
});
/* Al pulsar el idioma, la página repinta lo suyo; el menú repinta
   lo suyo detrás, con un turno de espera para que el valor nuevo ya
   esté guardado cuando se lea. */
if (l) l.addEventListener('click', function(){ setTimeout(pintar, 0) });
pintar();
})();
</script>
