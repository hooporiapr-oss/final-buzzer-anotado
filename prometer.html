<style>
/* ══════════════════════════════════════════════════════════════════
   LA PÁGINA DEL PADRINO

   Aquí llega alguien por un enlace que le mandó un nene — la mamá, el
   tío, el vecino, el negocio de la esquina. Casi nunca sabe qué es
   esto. Así que la página tiene UN trabajo: explicar el trato en diez
   segundos y recoger la promesa sin hacerle una cuenta de cabeza.

   El trato: el nene juega cuatro cuartos de cinco minutos, el juego
   saca el marcador, y el padrino promete unos centavos por punto.

   Tres cosas que esta página no hace, y son a propósito:

   · No cobra nada, aquí ni después. Hooporia no procesa pagos: el
     padrino le paga al programa, directo, cuando el programa le diga.
   · No deja prometer una vez empezado el juego. Después ya se sabe
     cuánto anotó, y prometer sabiendo el resultado no es prometer.
   · No esconde la cuenta. Se enseña el número con el marcador típico
     delante, no en letra chica.
   ══════════════════════════════════════════════════════════════════ */
:root{--ink:#07141E;--paper:#EAF2F7;--mute:#7A96A9;--line:#1B3A4F;--panel:#0E2232;
      --gold:#FF8A2B;--green:#4FD3F0;--warn:#FFC247}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.6;
  -webkit-text-size-adjust:100%}
.wrap{width:min(560px,92vw);margin:0 auto;padding:0 0 60px}
header{border-bottom:1px solid var(--line);margin:0 0 26px}
.bar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(13px + env(safe-area-inset-top,0px)) 0 13px}
.mark{font-weight:900;color:#fff;text-decoration:none;font-size:1rem}
.mark em{font-style:normal;color:#4FD3F0}
.mark i{font-style:normal;color:#7A96A9}
#lang{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}

.kick{font-size:.68rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);margin:0 0 6px}
h1{font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:900;letter-spacing:-.02em;
  line-height:1.12;margin:0 0 4px}
h1 em{font-style:normal;color:var(--gold)}
.prog{color:var(--green);font-weight:900;font-size:.95rem;margin:0 0 16px}
.trato{color:#C8D6E2;font-size:1rem;margin:0 0 6px}
.cuando{color:var(--warn);font-weight:800;font-size:.86rem;margin:14px 0 0}

.caja{display:flex;gap:3px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.caja div{min-width:58px;padding:8px 5px;background:var(--panel);
  border:1px solid var(--line);border-radius:5px;text-align:center}
.caja div.tot{background:rgba(255,138,43,.13);border-color:rgba(255,138,43,.42)}
.caja b{display:block;font-size:.55rem;font-weight:900;letter-spacing:.13em;
  color:var(--mute);text-transform:uppercase}
.caja span{display:block;font-size:1.2rem;font-weight:900;line-height:1.3}
.caja div.tot span{color:var(--gold)}

form{margin:26px 0 0}
label{display:block;font-size:.72rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);margin:0 0 7px}
.campo{margin:0 0 18px}
input{width:100%;font:inherit;font-size:1rem;padding:13px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);color:var(--paper)}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.ayuda{color:var(--mute);font-size:.8rem;margin:7px 0 0}

/* Los centavos por punto. Botones de verdad, no una lista. */
.tarifas{display:flex;gap:8px;flex-wrap:wrap}
.tarifa{flex:1 1 0;min-width:86px;background:var(--panel);color:var(--paper);
  border:2px solid var(--line);border-radius:8px;padding:13px 6px;cursor:pointer;
  font:inherit;font-weight:900;font-size:1.15rem;line-height:1.2}
.tarifa small{display:block;font-size:.6rem;font-weight:900;letter-spacing:.1em;
  color:var(--mute);text-transform:uppercase;margin-top:3px}
.tarifa.on{border-color:var(--gold);background:rgba(255,138,43,.13);color:var(--gold)}
.tarifa.on small{color:var(--gold)}

.cuenta{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:7px;padding:14px 15px;margin:0 0 20px;font-size:.9rem;color:#C8D6E2}
.cuenta b{color:#fff}
.cuenta .tot{color:var(--gold);font-weight:900}

button.enviar{width:100%;background:var(--gold);color:#0B1724;border:0;border-radius:8px;
  font:inherit;font-weight:900;font-size:1.05rem;padding:16px;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.38)}
button.enviar:disabled{opacity:.5;cursor:default;box-shadow:none}
.aviso{margin:16px 0 0;font-size:.82rem;color:var(--mute)}
.estado{margin:16px 0 0;font-weight:800;font-size:.95rem;min-height:1.3em}
.estado.mal{color:#FF5A4A}
.estado.bien{color:var(--green)}

.cerrado{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:20px;text-align:center}
.cerrado h2{font-size:1.1rem;font-weight:900;margin:0 0 8px}
.cerrado p{color:var(--mute);font-size:.92rem}
.listo{text-align:center;padding:30px 0}
.listo .grande{font-size:clamp(2.6rem,12vw,4rem);font-weight:900;color:var(--green);
  line-height:1;margin:0 0 10px}
button.volver{margin:18px auto 0;display:block;background:none;color:var(--mute);
  border:1px solid var(--line);border-radius:7px;font:inherit;font-weight:800;
  font-size:.88rem;padding:11px 20px;cursor:pointer}
button.volver:hover{color:var(--paper);border-color:var(--mute)}
.pie{margin:34px 0 0;padding:18px 0 0;border-top:1px solid var(--line);
  color:#5E7488;font-size:.78rem}
.pie a{color:#5E7488}
[hidden]{display:none !important}

/* ══ LA MARCA ══════════════════════════════════════════════════
   cada (hueso) · punto (naranja) · cuenta (cian), a 23px con peso
   800 y el espaciado cerrado — la que lleva padrinos.html. Es la
   marca, no un enlace del menú, y a 16px con peso 900 parecía lo
   segundo: apretada, pequeña y sin aire entre las letras.

   El espaciado va en em y no en px para que siga cerrado si alguna
   página la pinta a otro tamaño. */
.mark, .mark .wm{
  color:#EAF2F7 !important;text-decoration:none !important;
  font-size:23px !important;font-weight:800 !important;
  letter-spacing:-.035em !important;line-height:1.1}
/* Aquí había dos reglas para el color de la marca —em naranja, i
   azul— que venían de la marca de tres palabras de Cada Punto, donde
   el naranja caía sobre "punto" y el azul sobre "cuenta". Quitadas:
   no pintaban nada, porque más abajo la piel de documento las gana
   con !important, y dejar reglas muertas que dicen un color distinto
   del que se ve es cómo se pierde media hora.

   El color de la marca en esta página se decide en un solo sitio, el
   bloque de la cabecera: sobre crema, el nombre en navy y el punto
   naranja. Si hay que cambiarlo, es ahí. */
/* En un teléfono estrecho, que no empuje al botón de idioma. */
@media(max-width:380px){
  .mark, .mark .wm{font-size:20px !important}
}

/* ══════════════════════════════════════════════════════════════
   EL LOOK NUEVO — crema, navy y naranja
   18 de octubre de 2026

   Esta página es la que abre un padrino cuando le llega el enlace,
   así que tiene que parecerse al resto del sitio y no al juego.

   Va al final y manda encima: la geometría de arriba no se toca.
   Ojo con los nombres, que aquí están al revés de otras páginas —
   --ink es el FONDO y --paper es el TEXTO — así que se cruzan.
   ══════════════════════════════════════════════════════════════ */
:root{
  --navy:#101c2a; --orange:#ff7a18; --cream:#faf8f4; --linea:#e7e6e2;
  /* Cruzados a propósito: ink era el oscuro del fondo. */
  --ink:#faf8f4; --paper:#1b2937;
  --mute:#617083; --line:#e7e6e2; --panel:#ffffff;
  --gold:#ff7a18; --green:#0b7a5a; --warn:#8a5a00;
}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}

/* La cabecera: sobre crema, la marca va en navy y el punto naranja. */
header{border-bottom:1px solid var(--linea)}
.mark, .mark .wm{color:var(--navy) !important}
.mark em, .wm em{color:var(--navy) !important}
.mark i, .wm i{color:var(--orange) !important}
#lang{border:1px solid var(--linea);color:var(--mute);background:#fff;border-radius:7px}
#lang:hover{border-color:var(--orange);color:var(--orange)}

.kick{color:var(--orange)}
h1 em{color:var(--orange)}
.prog, .cuando, .ayuda, .trato{color:var(--mute)}

/* Los paneles, blancos con su sombra. */
.caja, .cuenta, .cerrado, .listo, .aviso{
  background:#fff;border:1px solid var(--linea);border-radius:14px;
  box-shadow:0 8px 25px #17243806;color:var(--paper)}
.caja span, .caja div.tot span{color:var(--mute)}
.caja b, .cuenta b{color:var(--paper)}

/* Lo que se escribe. */
.campo input, input{background:#fff;border:1px solid #d6d9d6;border-radius:10px;
  color:var(--paper)}
input::placeholder{color:#9aa6b2}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,24,.18);outline:none}

/* Las tarifas: fichas claras, y la escogida en naranja. */
.tarifa{background:#fff;border:1px solid var(--linea);color:var(--paper)}
.tarifa small{color:var(--mute)}
.tarifa.on{background:var(--orange);border-color:var(--orange);color:#111a24}
.tarifa.on small{color:#111a24}

button.enviar{background:var(--orange);border:0;color:#111a24;border-radius:9px;font-weight:800}
button.enviar:disabled{opacity:.5}
button.volver{background:transparent;border:1px solid var(--navy);color:var(--navy);
  border-radius:9px}
button.volver:hover{background:var(--navy);color:#fff}

.estado.mal{color:#b4231c}
.estado.bien{color:var(--green)}
.cerrado h2{color:var(--paper)}
.cerrado p{color:var(--mute)}
.listo .grande{color:var(--orange)}
.pie, .pie a{color:var(--mute)}
.pie a:hover{color:var(--orange)}
</style>

var TIPICO=150;
var TARIFAS=[0.05,0.10,0.20];
var tarifa=0.05;

function dinero(n){ return '$'+(Math.round(n*100)/100).toFixed(2) }

function rpc(nombre, cuerpo, listo, falla){
  fetch(SB_URL+'/rest/v1/rpc/'+nombre,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(cuerpo)
  }).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json() })
    .then(listo).catch(function(e){ if(falla) falla(e) });
}

function pintarTarifas(){
  var h='';
  for(var i=0;i<TARIFAS.length;i++){
    var t=TARIFAS[i], cent=Math.round(t*100);
    h+='<button type="button" class="tarifa'+(t===tarifa?' on':'')+'" data-t="'+t+'">'+
       cent+'¢<small>'+(LANG==='es'?'por punto':'per point')+'</small></button>';
  }
  $('tarifas').innerHTML=h;
  var bs=$('tarifas').querySelectorAll('.tarifa');
  for(var j=0;j<bs.length;j++) bs[j].onclick=function(){
    tarifa=parseFloat(this.getAttribute('data-t'));
    pintarTarifas(); pintarCuenta();
  };
}

function pintarCuenta(){
  var base=tarifa*TIPICO;
  var txt=T('cuenta').replace('{P}',TIPICO).replace('{A}',dinero(base));
  var tope=parseFloat($('tope').value);
  if(tope>=5) txt+='<br>'+T('cuentaTope').replace('{C}',dinero(tope))
                      .replace('{M}',dinero(tope));
  $('cuenta').innerHTML=txt;
}

function fecha(iso){
  try{
    var d=new Date(iso);
    return d.toLocaleDateString(LANG==='es'?'es-PR':'en-US',
      {weekday:'long',day:'numeric',month:'long'})+', '+
      d.toLocaleTimeString(LANG==='es'?'es-PR':'en-US',{hour:'numeric',minute:'2-digit'})
      /* "2:52 p. m." ya trae su punto final; la frase le ponía otro. */
      .replace(/\.$/,'');
  }catch(e){ return '' }
}

function pintarCaja(cuartos, total){
  var h='';
  for(var q=1;q<=4;q++){
    var c=null;
    for(var i=0;i<cuartos.length;i++) if(cuartos[i].q===q) c=cuartos[i];
    h+='<div><b>Q'+q+'</b><span>'+(c?c.points:'—')+'</span></div>';
  }
  h+='<div class="tot"><b>'+T('total')+'</b><span>'+total+'</span></div>';
  $('caja').innerHTML=h; $('caja').hidden=false;
}

  $('cerradoH').textContent=T('cerrada');
  $('cerradoP').textContent=T('cerradaP');
  $('listoH').textContent=T('listoH');
  $('listoP').textContent=T('listoP');
  $('volver').textContent=T('volver');
  /* El marcador SÓLO cuando ya cerró. Abierta, un marcador hecho le
     estaría diciendo a un padrino que el nene ya anotó — y de paso le
     dejaría prometer sabiendo el resultado, que es justo lo que esta
     página no hace. Pasa de verdad: basta con mover la ventana de un
     reto que ya se jugó. */
  if(!ESTADO.open && ESTADO.played) pintarCaja(ESTADO.quarters||[], ESTADO.total||0);
  else $('caja').hidden=true;
  pintarTarifas(); pintarCuenta();
}

$('lang').onclick=function(){
  LANG=LANG==='es'?'en':'es';
  try{ localStorage.setItem('cfh_lang',LANG); localStorage.setItem('cp-lang',LANG) }catch(e){}
  pintar();
};
$('tope').oninput=pintarCuenta;

function arrancar(){
  if(!RETO||!JUGADOR){ $('cargando').textContent=T('noVa'); return }
  rpc('cp_padrino_view',{p_challenge:RETO,p_player:JUGADOR}, function(d){
    if(!d||!d.ok){ $('cargando').textContent=T('noVa'); return }
    ESTADO=d;
    $('cargando').hidden=true;
    $('todo').hidden=false;
    if(d.open){ $('form').hidden=false } else { $('cerrado').hidden=false }
    pintar();
  }, function(){
    $('cargando').textContent=T('malRed');
    setTimeout(arrancar, 4000);
  });
}

$('form').onsubmit=function(ev){
  ev.preventDefault();
  var nom=$('nom').value.trim(), mail=$('mail').value.trim();
  var tope=$('tope').value?parseFloat($('tope').value):null;
  if(nom.length<2){ return decir(T('malNom'),'mal') }
  if(mail.indexOf('@')<1 || mail.indexOf('.')<0){ return decir(T('malMail'),'mal') }
  if(tope!==null && !(tope>=5)){ return decir(T('malTope'),'mal') }

  $('enviar').disabled=true;
  decir(T('mandando'),'');
  rpc('cp_pledge',{p_challenge:RETO,p_player:JUGADOR,p_name:nom,p_email:mail,
                   p_rate:tarifa,p_cap:tope,p_lang:LANG},
    function(d){
      $('enviar').disabled=false;
      if(d&&d.ok){
        $('form').hidden=true;
        $('listo').hidden=false;
        if(d.again) $('listoP').textContent=T('otraVez').replace('{N}',ESTADO.name);
        return;
      }
      var r=(d&&d.reason)||'';
      if(r==='closed'){ $('form').hidden=true; $('cerrado').hidden=false; return }
      decir(r==='name'?T('malNom'):r==='email'?T('malMail'):
            r==='cap'?T('malTope'):T('malRed'),'mal');
    },
    function(){ $('enviar').disabled=false; decir(T('malRed'),'mal') });
};
function decir(t,c){ var e=$('dice'); e.textContent=t; e.className='estado'+(c?' '+c:'') }

/* Volver al formulario con todo como lo dejó. Mandar otra vez con el
   mismo correo actualiza la promesa, no hace una segunda. */
$('volver').onclick=function(){
  $('listo').hidden=true;
  $('form').hidden=false;
  decir('','');
  $('nom').focus();
};

pintar();
arrancar();
})();
</script>
</body>
</html>
